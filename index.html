  const plan={id:'pl_'+Date.now()+'_'+index+'_'+Math.random().toString(36).slice(2,6),type,title,reason:'',config:{date:p.date||today(),time:p.time,area:p.area,returnTime:p.returnTime,budget:p.budget,energy:p.energy,transport:p.transport,dateStyle:p.dateStyle||'auto',duration:p.duration},cover:seq[1]?.img||seq[0]?.img||IMG.hero,places:seq,segments:segs,timeline,totalCost:m.cost,travelMin:segs.reduce((a,x)=>a+x.durationMin,0),totalHours:m.mins/60,return:m.ret,returnLeave:m.ret.leave,dateStyle:style,constraintLimited:!!chosen.limited,signature:chosen.sig};

(0,4).map(s=>{const p=s.plan||findPlan(s.planId);return p?`<button class="v28-event" onclick="navigate('candidatePreview',{id:'${p.id}'})"><b>${esc(p.title)}</b><span>${esc(v29CourseMini(p))} · 날짜 정하기 ›</span></button>`:''}).join('')||'<div class="v14-empty v34-candidate-empty">저장해둔 후보 코스가 없어요.<br><span style="font-size:11px">코스를 저장하면 여기서 날짜를 정할 수 있어요.</span></div>'}</div>`}
function v28AutoMilestones(count=6){if(!state.profile.coupleStart)return [];const d=daysTogether(),start=state.profile.coupleStart,next=Math.max(100,Math.ceil(d/100)*100),out=[];for(let n=next;n<next+count*100;n+=100){const date=v28AddDays(start,n-1),daysLeft=Math.ceil((new Date(date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);out.push({id:'auto_'+n,name:`우리 ${n}일`,date,daysLeft,auto:true})}return out}

function v28CustomAnnivNext(a){let date=a.date;if(a.yearly){const base=new Date(a.date+'T00:00:00'),now=new Date(today()+'T00:00:00');let y=now.getFullYear(),d=new Date(y,base.getMonth(),base.getDate());if(d<now)d=new Date(y+1,base.getMonth(),base.getDate());date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}const daysLeft=Math.ceil((new Date(date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);return {...a,date,daysLeft,auto:false}}
function v28NextAnniversary(){const custom=(state.v28.anniversaries||[]).map(v28CustomAnnivNext).filter(x=>x&&x.daysLeft>=0),all=[...v28AutoMilestones(6),...custom].sort((a,b)=>a.date.localeCompare(b.date));return all[0]||{id:'setup',name:'기념일 설정하기',date:'',daysLeft:null,setup:true}}

routes.anniversaries=()=>{const next=v28NextAnniversary(),auto=v28AutoMilestones(6),custom=(state.v28.anniversaries||[]).map(v28CustomAnnivNext).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));return `${pagebar('우리 기념일',`<button class="iconbtn" onclick="openAnniversarySheet()">${icon('plus')}</button>`)}<div class="v28-anniv-hero"><div class="eyebrow">${relationship()}</div><h1>우리에게 중요한 날</h1><div class="section-sub">연애 시작일을 설정하면 100일·200일·300일을 자동 계산하고, 둘만의 기념일은 직접 추가할 수 있어요.</div></div>${next.setup?`<div class="v28-anniv-next"><small>자동 기념일을 쓰려면</small><h2>연애 시작일을 먼저 설정해주세요.</h2><p>설정에서 시작일을 입력하면 바로 계산해요.</p><button class="v31-primary-link" onclick="navigate('profile')">연애 시작일 설정</button></div>`:`<div class="v28-anniv-next"><small>가장 가까운 기념일</small><h2>${esc(next.name)}</h2><p>${v28FmtDate(next.date)} · ${next.daysLeft===0?'오늘이에요':`D-${next.daysLeft}`}</p></div>`}<div class="v28-anniv-list"><div class="row-between"><div class="section-title" style="font-size:18px">자동으로 계산되는 날</div></div>${auto.length?auto.map(x=>`<div class="v28-anniv-row"><div><b>${esc(x.name)}</b><span>${v28FmtDate(x.date)}</span></div><em>${x.daysLeft===0?'오늘':`D-${x.daysLeft}`}</em></div>`).join(''):`<div class="v14-empty">연애 시작일을 설정하면 자동 기념일이 여기에 보여요.</div>`}<div class="row-between" style="margin-top:30px"><div class="section-title" style="font-size:18px">둘만의 기념일</div><button class="v14-link" onclick="openAnniversarySheet()">+ 추가</button></div>${custom.length?custom.map(x=>`<button class="v28-anniv-row" style="width:100%;border-left:0;border-right:0;border-top:0;background:#fff;text-align:left" onclick="openAnniversarySheet('${x.id}')"><div><b>${esc(x.name)}</b><span>${v28FmtDate(x.date)} · ${x.yearly?'매년 반복':'한 번만'}</span></div><em>${x.daysLeft<0?'지난 기념일':x.daysLeft===0?'오늘':`D-${x.daysLeft}`}</em></button>`).join(''):`<div class="v14-empty">직접 추가한 기념일은 아직 없어요.</div>`}</div>`};


/* one exact stay-time source. +10 from overdue means 10 minutes from now. */
function adjustStay(mins){const L=state.live,p=findPlan(L?.planId);if(!L||!p||L.stage!=='at')return;const info=v28StayInfo(p,L),key=String(L.placeIndex);if(mins<0&&info.remainingSec<=Math.abs(mins)*60){v29LeaveCurrentPlace();return}if(mins>0&&info.remainingSec<=0)L.stayEndsAt[key]=Date.now()+mins*60000;else L.stayEndsAt[key]=Number(L.stayEndsAt[key])+mins*60000;L.stayAdjustments[key]=Number(L.stayAdjustments[key]||0)+mins;L.stayAlerts={};save();const next=v28StayInfo(p,L),el=document.getElementById('v28StayRemain');if(el)el.textContent=v28FormatRemain(next.remainingSec);const dep=document.getElementById('v28StayDepart');if(dep)dep.textContent=`추천 출발 ${next.departAt} · 지금 남은 시간 기준 ${mins>0?'+':''}${mins}분`;const bar=document.getElementById('v28StayBar');if(bar)bar.style.width=next.pct+'%';toast(mins>0?'지금부터 10분 더 있을 수 있게 바꿨어요.':'현재 남은 시간에서 10분을 뺐어요.')}
function v29LeaveCurrentPlace(){const L=state.live,p=findPlan(L?.planId);if(!L||!p)return;if(L.placeIndex>=p.places.length-1){toast('남은 시간이 10분 이하예요. 데이트를 마무리할지 확인할게요.');requestFinishDate();return}toast('남은 시간이 10분 이하라 이 장소는 지금 마치고 다음 장소로 이동할게요.');departNext()}

/* truthful live completion + memory */
function v30LocalDate(ts){const d=new Date(ts);return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function requestFinishDate(){document.querySelector('.sheet-wrap')?.remove();document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>오늘 데이트를 마무리할까요?</h3><p>마무리하면 실제 함께한 시간과 남긴 사진을 기록하고, 서로에게 한마디를 남길 수 있어요.</p><button class="sheet-option" onclick="finishDate()"><div><b>기록 남기고 마무리</b><span>오늘 추억으로 저장</span></div><div>›</div></button><button class="sheet-option" onclick="document.querySelector('.sheet-wrap').remove()"><div><b>계속 데이트할래요</b><span>진행 화면으로 돌아가기</span></div><div>›</div></button></div></div>`)}
function finishDate(){const L=state.live,p=findPlan(L?.planId);if(!L||!p)return;const photos=Array.isArray(L.photos)?L.photos:[],end=Date.now(),hours=Math.max(.1,(end-Number(L.startedAt||end))/3600000),visited=L.stage==='to_first'?0:Math.min(p.places.length,L.placeIndex+1),rec={id:'r_'+Date.now(),date:v30LocalDate(L.startedAt||end),title:p.title,cost:p.totalCost,costType:'estimated',hours:Number(hours.toFixed(1)),rating:null,photos:photos.length,photoMemories:photos.map(x=>({...x})),places:p.places.slice(0,visited).map(x=>x.cat),memo:'',messages:{me:'',partner:''},startedAt:L.startedAt||null,endedAt:end};state.records.unshift(rec);state.v13.lastRecordId=rec.id;L.status='ended';L.photos=[];if(!save())return;document.querySelector('.sheet-wrap')?.remove();nav=[{route:'dateWrap',params:{id:rec.id}}];render()}
function cancelLive(){document.querySelector('.sheet-wrap')?.remove();document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>정말 데이트 진행을 종료할까요?</h3><p>실수로 누른 거라면 계속 진행을 선택하세요.</p><button class="sheet-option" onclick="requestFinishDate()"><div><b>기록 남기고 마무리</b></div><div>›</div></button><button class="sheet-option" onclick="v30DiscardLive()"><div><b style="color:#b33847">기록 없이 종료</b><span>진행 상태만 종료</span></div><div>›</div></button><button class="sheet-option" onclick="document.querySelector('.sheet-wrap').remove()"><div><b>계속 진행</b></div><div>›</div></button></div></div>`)}
function v30DiscardLive(){if(state.live){state.live.status='ended';state.live.photos=[]}if(!save())return;document.querySelector('.sheet-wrap')?.remove();switchTab('home');toast('데이트 진행을 종료했어요')}
function setWrapRating(id,val){const r=state.records.find(x=>x.id===id);if(!r)return;r.rating=Number(val);if(!save())return;document.querySelectorAll('.v30-rating button').forEach(b=>b.classList.toggle('on',Number(b.dataset.rating)===Number(val)))}
routes.dateWrap=({id})=>{const r=state.records.find(x=>x.id===id);if(!r)return v33ErrorPanel('마무리할 기록을 찾지 못했어요.','이미 정리되었거나 삭제된 데이트 기록이에요. 지난 데이트에서 다시 확인해주세요.',"navigate('records')",'지난 데이트로');const pics=r.photoMemories||[];return `${pagebar('데이트 마무리')}<div class="wrap-hero"><div class="check">✓</div><h1>오늘도 잘 놀았어요.</h1><div class="section-sub">실제 진행시간과 사진은 자동으로 기록했어요. 마지막으로 서로에게 한마디만 남겨볼까요?</div><div class="wrap-summary"><div class="wrap-stat"><span>실제 함께한 시간</span><b>${r.hours}시간</b></div><div class="wrap-stat"><span>예상 비용</span><b>${money(r.cost||0)}</b></div><div class="wrap-stat"><span>방문</span><b>${r.places.length}곳</b></div></div>${pics.length?`<div class="planner-row" style="margin-top:20px"><label>오늘 남긴 사진 · ${pics.length}장</label><div class="v28-wrap-photos">${pics.map(x=>`<img src="${x.data}" alt="데이트 추억">`).join('')}</div></div>`:`<div class="locked-note" style="margin-top:18px">오늘은 진행 중에 따로 저장한 사진이 없어요.</div>`}<div class="planner-row"><label>오늘 데이트는 어땠어요? · 선택</label><div class="v30-rating">${[[1,'별로'],[2,'아쉬움'],[3,'괜찮음'],[4,'좋음'],[5,'최고']].map(([v,l])=>`<button data-rating="${v}" class="${r.rating===v?'on':''}" onclick="setWrapRating('${r.id}',${v})"><b>${v}</b>${l}</button>`).join('')}</div></div><div class="v28-message-pair"><div class="section-sub">서로에게 하고 싶은 말</div><label>${esc(state.profile.me)} → ${esc(state.profile.partner)}</label><textarea id="wrapMeMsg" class="compose" style="min-height:88px" placeholder="오늘 좋았던 것, 고마웠던 것, 다음에 하고 싶은 말을 남겨보세요.">${esc(r.messages?.me||'')}</textarea><label>${esc(state.profile.partner)} → ${esc(state.profile.me)}</label><textarea id="wrapPartnerMsg" class="compose" style="min-height:88px" placeholder="연인이 직접 적어도 좋아요.">${esc(r.messages?.partner||'')}</textarea></div><button class="primary" style="margin-top:18px" onclick="saveDateWrap('${r.id}')">오늘 데이트 기록 마치기</button><button class="textbtn" style="width:100%;margin-top:7px" onclick="switchTab('home')">나중에 남길게요</button></div>`}
function saveDateWrap(id){const r=state.records.find(x=>x.id===id);if(!r)return;r.messages={me:document.getElementById('wrapMeMsg')?.value.trim()||r.messages?.me||'',partner:document.getElementById('wrapPartnerMsg')?.value.trim()||r.messages?.partner||''};if(!r.memo)r.memo=r.messages.me||'오늘 데이트를 함께했어요.';r.photos=(r.photoMemories||[]).length;if(!save())return;switchTab('home');toast('오늘 기록을 저장했어요')}
function v30RecordCost(r){if(r.cost==null)return '금액 미입력';return `${r.costType==='estimated'?'예상 ':'실제 '}${money(r.cost)}`}
function v30HasRating(r){return r.rating!==null&&r.rating!==undefined&&r.rating!==''&&Number.isFinite(Number(r.rating))}

function v31SetMood(who,idx){if(!['me','partner'].includes(who)||!V31_MOODS[idx])return;const c=v31TodayCheckin();c[who]=idx;v31LogDaily('checkin');if(!save())return;render();toast(`${who==='me'?'내':'연인'} 기분을 저장했어요`)}
function v31SaveCheckinNote(){const c=v31TodayCheckin(),el=document.getElementById('v31CheckinNote');if(!el)return;c.note=el.value.trim().slice(0,80);if(!save())return;toast('오늘 상태 메모를 저장했어요')}
function v31MoodCard(who,label){const c=v31TodayCheckin(),idx=c[who];return `<div class="v31-person-card"><small>${esc(label)}</small><strong>${idx==null?'—':V31_MOODS[idx][0]}</strong><p>${idx==null?'아직 선택하지 않았어요.':V31_MOODS[idx][1]}</p></div>`}
function v31MoodButtons(who){const c=v31TodayCheckin();return `<div class="v31-moods">${V31_MOODS.map((x,i)=>`<button class="v31-mood ${c[who]===i?'on':''}" onclick="v31SetMood('${who}',${i})" aria-label="${esc(x[1])}">${x[0]}</button>`).join('')}</div><div class="v31-mood-labels">${V31_MOODS.map(x=>`<span>${esc(x[1])}</span>`).join('')}</div>`}
routes.checkin=()=>{const c=v31TodayCheckin();return `${pagebar('오늘 우리 상태')}<div class="section compact"><div class="feed-kicker">${v31KoreanShortDate(today())}</div><h1 style="font-size:28px;letter-spacing:-.9px;margin:7px 0 7px">오늘은 어때요?</h1><div class="section-sub">설명하기 귀찮으면 가장 가까운 표정 하나만 눌러도 돼요.</div><div class="v31-mood-summary">${v31MoodCard('me',state.profile.me)}${v31MoodCard('partner',state.profile.partner)}</div><div class="v31-section-label">${esc(state.profile.me)}의 기분</div>${v31MoodButtons('me')}<div class="v31-section-label">${esc(state.profile.partner)}의 기분 · 연인 연결 예시</div>${v31MoodButtons('partner')}<div class="v31-help">실제 서비스에서는 연인이 자기 기기에서 답하고 여기에는 결과만 보여요. 지금은 연결 전 흐름을 확인하기 위한 목업이에요.</div><div class="v31-section-label">오늘 상태 메모 · 선택</div><input id="v31CheckinNote" class="v31-note-input" maxlength="80" value="${esc(c.note||'')}" placeholder="예: 오늘 좀 피곤해. 저녁엔 푹 쉬고 싶어"><button class="v31-secondary-link" onclick="v31SaveCheckinNote()">상태 메모 저장</button></div>`};


/* ----- Daily mission ----- */
function v31CompleteMission(){const st=v31TodayMissionState();if(st.completed){toast('오늘 미션은 이미 완료했어요');return}st.completed=true;st.completedAt=Date.now();v31LogDaily('mission');if(!save())return;render();toast('오늘 둘이 한 일을 기록했어요')}
function v31RerollMission(){const st=v31TodayMissionState();if(st.completed){toast('완료한 미션은 바꾸지 않아도 돼요');return}if(st.rerolls>=2){toast('오늘은 두 번까지 바꿀 수 있어요');return}st.offset=(st.offset||0)+1;st.rerolls=(st.rerolls||0)+1;if(!save())return;render()}
routes.mission=()=>{const m=v31TodayMission(),st=m.state,locked=st.rerolls>=2;return `${pagebar('오늘의 둘 미션')}<div class="section compact"><div class="v31-mission"><div class="tag">오늘 딱 하나 · ${esc(m.cat)}</div><h2>${esc(m.title)}</h2><p>${esc(m.desc)}</p><div class="v31-mission-meta"><span>약 ${esc(m.time)}</span><span>변경 ${st.rerolls}/2</span></div><button class="v31-complete ${st.completed?'done':''}" onclick="v31CompleteMission()">${st.completed?'✓ 오늘 완료했어요':'둘이 했어요'}</button>${!st.completed?`<button class="v31-subtle-btn" ${locked?'disabled style="opacity:.42;cursor:default"':''} onclick="${locked?'void(0)':'v31RerollMission()'}">${locked?'오늘 변경 2/2 사용':'오늘은 다른 걸로 바꿀래요'}</button>`:''}</div><div class="v31-help">미션은 숙제가 아니에요. 하기 싫은 날은 건너뛰어도 돼요.</div></div>`};


/* ----- One-line couple board ----- */
function v31OpenNoteSheet(from='me'){const who=from==='partner'?state.profile.partner:state.profile.me;document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>${esc(who)}의 한마디</h3><p>채팅처럼 길게 쓰지 않아도 돼요. 오늘 남기고 싶은 한마디만 적어요.</p><textarea id="v31NoteText" class="compose" maxlength="120" style="min-height:92px" placeholder="예: 오늘도 고생했어. 푹 쉬어."></textarea><div class="v31-inline-actions"><button onclick="document.getElementById('v31NoteText').value='보고 싶어'">보고 싶어</button><button onclick="document.getElementById('v31NoteText').value='오늘도 고생했어'">고생했어</button></div><button class="primary" style="margin-top:12px" onclick="v31SaveNote('${from}')">남기기</button></div></div>`)}
function v31SaveNote(from){const el=document.getElementById('v31NoteText'),text=el?.value.trim();if(!text){toast('한마디를 적어주세요');return}state.v31.notes.unshift({id:'n_'+Date.now(),from:from==='partner'?'partner':'me',text:text.slice(0,120),date:today(),ts:Date.now()});state.v31.notes=state.v31.notes.slice(0,100);v31LogDaily('note');if(!save())return;document.querySelector('.sheet-wrap')?.remove();render();toast('둘만의 한마디에 남겼어요')}
function v31DeleteNote(id){const n=state.v31.notes.find(x=>x.id===id);if(!n)return;document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>이 한마디를 지울까요?</h3><p>삭제하면 다시 복구할 수 없어요.</p><button class="sheet-option" onclick="v31ConfirmDeleteNote('${id}')"><div><b style="color:#b33847">삭제</b></div><div>›</div></button><button class="sheet-option" onclick="document.querySelector('.sheet-wrap').remove()"><div><b>그대로 둘래요</b></div><div>›</div></button></div></div>`)}
function v31ConfirmDeleteNote(id){state.v31.notes=state.v31.notes.filter(x=>x.id!==id);if(!save())return;document.querySelector('.sheet-wrap')?.remove();render();toast('한마디를 삭제했어요')}
function v31NoteList(limit=20){const list=state.v31.notes.slice(0,limit);if(!list.length)return `<div class="v31-empty">아직 남긴 한마디가 없어요.<br>“고생했어”부터 시작해도 돼요.</div>`;return `<div class="v31-note-list">${list.map(n=>`<div class="v31-note-card ${n.from==='partner'?'partner':''}"><div style="display:flex;gap:10px;align-items:flex-start"><div style="min-width:0;flex:1"><div class="meta">${n.from==='partner'?esc(state.profile.partner):esc(state.profile.me)} · ${v31KoreanShortDate(n.date)}</div><div class="body">${esc(n.text)}</div></div><button class="v31-delete" aria-label="한마디 삭제" onclick="v31DeleteNote('${n.id}')">×</button></div></div>`).join('')}</div>`}

routes.coupleNotes=()=>`${pagebar('둘만의 한마디',`<button class="iconbtn" onclick="v31OpenNoteSheet('me')">${icon('plus')}</button>`)}<div class="section compact"><div class="section-sub">메신저 대신 쓰는 채팅방이 아니라, 나중에 다시 보고 싶은 짧은 말만 모아두는 곳이에요.</div><div class="v31-inline-actions"><button class="dark" onclick="v31OpenNoteSheet('me')">내가 남기기</button><button onclick="v31OpenNoteSheet('partner')">연인이 남기기</button></div><div class="v31-section-label">최근 한마디</div>${v31NoteList()}</div>`

/* ----- Weekly recap ----- */
function v31WeekDates(){return Array.from({length:7},(_,i)=>v31DateShift(today(),i-6))}
/* v32 clean removed superseded fn:v31WeekStats */

function v31WeekSentence(s){if(s.dates)return `이번 주에는 데이트 ${s.dates}번과 작은 기록 ${s.notes+s.missions}개가 남았어요. 많이 하지 않아도 둘이 남긴 흔적이 있다는 게 중요해요.`;if(s.both>=4)return `이번 주에는 ${s.both}일 서로의 상태를 확인했어요. 데이트가 없어도 서로 어떻게 지냈는지는 꽤 잘 알고 있었네요.`;if(s.notes+s.missions>=3)return `이번 주에는 한마디와 미션을 ${s.notes+s.missions}번 남겼어요. 거창한 이벤트보다 이런 작은 기록이 계속 쌓여요.`;return `이번 주 기록이 많지 않아도 괜찮아요. 오늘 기분 하나만 남겨도 다음 주에 다시 볼 수 있어요.`}
routes.weekly=()=>{const s=v31WeekStats();return `${pagebar('이번 주 우리')}<div class="section compact"><div class="feed-kicker">최근 7일</div><h1 style="font-size:28px;letter-spacing:-.9px;margin:7px 0">이번 주, 우리는 이랬어요.</h1><div class="v31-week-grid"><div class="v31-week-stat"><span>둘 다 기분 체크</span><b>${s.both}일</b></div><div class="v31-week-stat"><span>오늘 미션</span><b>${s.missions}번</b></div><div class="v31-week-stat"><span>서로 한마디</span><b>${s.notes}개</b></div><div class="v31-week-stat"><span>데이트 기록</span><b>${s.dates}번</b></div></div><div class="v31-week-copy">${esc(v31WeekSentence(s))}</div><button class="v31-secondary-link" onclick="v31OpenUsToday()">오늘 기록하러 가기</button></div>`}

/* ----- Bucket list ----- */
function v31OpenBucketSheet(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>같이 해보고 싶은 것</h3><p>장소가 아니어도 돼요. “새벽 드라이브”, “동네 맛집 깨기”처럼 적어도 돼요.</p><input id="v31BucketTitle" class="input" maxlength="70" placeholder="예: 제주도에서 스쿠터 타기"><div class="planner-row"><label>종류</label><select id="v31BucketCat" class="input"><option>데이트</option><option>여행</option><option>일상</option><option>먹기</option><option>놀이</option><option>기타</option></select></div><button class="primary" style="margin-top:12px" onclick="v31AddBucket()">버킷에 추가</button></div></div>`)}
function v31AddBucket(){const t=document.getElementById('v31BucketTitle')?.value.trim(),cat=document.getElementById('v31BucketCat')?.value||'기타';if(!t){toast('같이 해보고 싶은 걸 적어주세요');return}state.v31.bucket.unshift({id:'b_'+Date.now(),title:t.slice(0,70),category:cat,done:false,createdAt:today()});if(!save())return;document.querySelector('.sheet-wrap')?.remove();render();toast('우리 버킷에 추가했어요')}
function v31ToggleBucket(id){const x=state.v31.bucket.find(x=>x.id===id);if(!x)return;x.done=!x.done;x.doneAt=x.done?today():null;if(!save())return;render();toast(x.done?'같이 해낸 일로 기록했어요':'다시 하고 싶은 목록으로 돌렸어요')}
function v31DeleteBucket(id){state.v31.bucket=state.v31.bucket.filter(x=>x.id!==id);if(!save())return;render();toast('버킷에서 삭제했어요')}
function v31BucketHTML(){if(!state.v31.bucket.length)return `<div class="v31-empty">아직 같이 하고 싶은 게 없어요.<br>장소 말고 행동 하나부터 적어봐요.</div>`;return `<div class="v31-bucket-list">${[...state.v31.bucket].sort((a,b)=>Number(a.done)-Number(b.done)).map(x=>`<div class="v31-bucket-item ${x.done?'done':''}"><button class="v31-bucket-check" aria-label="${x.done?'완료 취소':'완료'}" onclick="v31ToggleBucket('${x.id}')"></button><div class="v31-bucket-copy"><b>${esc(x.title)}</b><span>${esc(x.category)}${x.doneAt?` · ${v31KoreanShortDate(x.doneAt)} 완료`:''}</span></div><button class="v31-delete" aria-label="삭제" onclick="v31DeleteBucket('${x.id}')">×</button></div>`).join('')}</div>`}
routes.bucket=()=>`${pagebar('우리 버킷',`<button class="iconbtn" onclick="v31OpenBucketSheet()">${icon('plus')}</button>`)}<div class="section compact"><div class="section-sub">유명한 데이트 장소만 저장하지 말고, 둘이 언젠가 해보고 싶은 일을 모아둬요.</div><div style="margin-top:18px">${v31BucketHTML()}</div><button class="v31-primary-link" onclick="v31OpenBucketSheet()">+ 하고 싶은 것 추가</button></div>`

/* ----- Time capsules ----- */
function v31OpenCapsuleSheet(){const min=v31DateShift(today(),1),def=v31DateShift(today(),30);document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>미래의 우리에게</h3><p>정한 날이 오기 전까지 내용은 가려둘게요.</p><input id="v31CapTitle" class="input" maxlength="40" placeholder="예: 한 달 뒤 우리에게"><textarea id="v31CapText" class="compose" maxlength="300" style="min-height:100px;margin-top:9px" placeholder="그때의 우리에게 하고 싶은 말"></textarea><div class="planner-row"><label>열어볼 날</label><input id="v31CapDate" class="input" type="date" min="${min}" value="${def}"></div><button class="primary" style="margin-top:12px" onclick="v31AddCapsule()">타임캡슐 잠그기</button></div></div>`)}
function v31AddCapsule(){const title=document.getElementById('v31CapTitle')?.value.trim(),text=document.getElementById('v31CapText')?.value.trim(),unlockDate=document.getElementById('v31CapDate')?.value;if(!title||!text||!unlockDate){toast('제목, 내용, 열어볼 날을 확인해주세요');return}if(unlockDate<=today()){toast('내일 이후 날짜를 골라주세요');return}state.v31.capsules.unshift({id:'cap_'+Date.now(),title:title.slice(0,40),text:text.slice(0,300),unlockDate,createdAt:today(),from:'me'});if(!save())return;document.querySelector('.sheet-wrap')?.remove();render();toast('정한 날까지 잠가둘게요')}
function v31CapsuleHTML(){if(!state.v31.capsules.length)return `<div class="v31-empty">아직 타임캡슐이 없어요.<br>한 달 뒤의 우리에게 짧은 말을 남겨봐요.</div>`;return state.v31.capsules.map(c=>{const open=c.unlockDate<=today(),left=Math.max(0,v31DayDiff(today(),c.unlockDate));return `<div class="v31-note-card" style="margin-bottom:9px"><div class="meta">${open?'열 수 있어요':`D-${left} · ${v31KoreanShortDate(c.unlockDate)}에 열림`}</div><div class="body"><b>${esc(c.title)}</b>${open?`<p style="margin:8px 0 0;line-height:1.55">${esc(c.text)}</p>`:`<p style="margin:8px 0 0;color:#999">내용은 아직 잠겨 있어요.</p>`}</div></div>`}).join('')}
routes.capsules=()=>`${pagebar('우리 타임캡슐',`<button class="iconbtn" onclick="v31OpenCapsuleSheet()">${icon('plus')}</button>`)}<div class="section compact"><div class="section-sub">오늘 쓴 말을 미래의 특정 날짜에 다시 열어봐요. 앱을 다시 찾을 이유가 되는 작은 약속이에요.</div><div style="margin-top:18px">${v31CapsuleHTML()}</div><button class="v31-primary-link" onclick="v31OpenCapsuleSheet()">+ 새 타임캡슐</button></div>`

/* ----- Memory flashback ----- */
function v31MemoryPick(){if(!state.records.length)return null;return state.records[Math.abs(hash(today()))%state.records.length]}
routes.memoryFlash=()=>{const r=v31MemoryPick();if(!r)return `${pagebar('추억 꺼내보기')}<div class="section compact"><div class="v31-empty">아직 꺼내볼 데이트 기록이 없어요.</div></div>`;const pic=r.photoMemories?.[0]?.data||IMG.memory;return `${pagebar('추억 꺼내보기')}<div class="section compact"><div class="v31-memory-card"><img src="${pic}" alt="데이트 추억"><div class="v31-memory-body"><small>${esc(r.date)}</small><b>${esc(r.title)}</b><p>${esc(r.memo||'그날의 데이트 기록이에요.')}</p></div></div><button class="v31-secondary-link" onclick="navigate('record',{id:'${r.id}'})">그날 기록 자세히 보기</button></div>`}

/* ----- Mock API/service adapter ----- */
function v31FindPlace(planId,placeId){const p=findPlan(planId);return p?.places?.find(x=>String(x.id)===String(placeId))||null}
function v31MockPlaceMeta(place,area){const h=hash(`${area}|${place.id||place.name}`),rating=(4.1+(h%8)/10).toFixed(1),reviews=70+(h%840),crowds=['여유','보통','조금 붐빔'][h%3],open=(h%7)!==0,parking=['주차 가능','근처 공영주차장 이용','주차 어려움'][h%3],slots=['18:30','19:00','19:30','20:00'].filter((_,i)=>(h+i)%3!==0);return {rating,reviews,crowds,open,parking,slots:slots.length?slots:['20:30'],hours:open?'오늘 22:00까지':'현재 영업 종료',wait:open?`${5+(h%4)*5}분 내외`:'-' }}
function v31SavePlace(planId,placeId){const p=findPlan(planId),pl=v31FindPlace(planId,placeId);if(!p||!pl)return;if(state.wishlist.some(w=>w.name===pl.name&&w.area===(p.config?.area||''))){toast('이미 같이 가고 싶은 곳에 있어요');return}state.wishlist.unshift({id:'w_'+Date.now(),name:pl.name,area:p.config?.area||'',cat:pl.cat,img:pl.img||IMG.cafe});if(!save())return;render();toast('같이 가고 싶은 곳에 저장했어요')}
function v31Reserve(planId,placeId,time){if(!v33RequireOnline('예약 가능 시간을 확인하려면 인터넷 연결이 필요해요.'))return;const p=findPlan(planId),pl=v31FindPlace(planId,placeId);if(!p||!pl)return;state.v31.reservations=state.v31.reservations.filter(x=>!(x.planId===planId&&x.placeId===placeId));state.v31.reservations.push({id:'rv_'+Date.now(),planId,placeId,name:pl.name,date:p.config?.date||today(),time,status:'mock'});if(!save())return;render();toast(`${time} 예약 선택을 저장했어요`)}
function v31CopyPlaceAddress(planId,placeId){const pl=v31FindPlace(planId,placeId);if(pl)copyText(pl.address)}

/* ==================== v33 first-five-minutes clean layer ==================== */
let v33LastRenderedRoute='';
function v33EnsureState(){
  const hadV33=!!localStorage.getItem('moment_v33'),hadLegacy=!!localStorage.getItem('moment_v32')||!!localStorage.getItem('moment_v13')||!!localStorage.getItem('moment_v11');
  const base=structuredClone(defaultState.v33);
  state.v33={...base,...(state.v33||{}),auth:{...base.auth,...(state.v33?.auth||{})},setup:{...base.setup,...(state.v33?.setup||{})},couple:{...base.couple,...(state.v33?.couple||{})},network:{...base.network,...(state.v33?.network||{})},qa:{...base.qa,...(state.v33?.qa||{})},runtime:{...base.runtime,...(state.v33?.runtime||{})}};
  if(!hadV33&&hadLegacy){state.v33.auth={...state.v33.auth,status:'signed_in',provider:'legacy',sessionValid:true,lastLoginAt:Date.now(),reason:null};state.v33.setup={profileDone:true,coupleDone:true,firstPlanDone:true};state.v33.couple.status=state.profile.partner&&state.profile.partner!=='연인'?'linked':'skipped';state.v13.onboarded=true}
  if(!Array.isArray(state.v33.auth.resumeNav))state.v33.auth.resumeNav=null;
}
function v33IsSignedIn(){return state.v33?.auth?.status==='signed_in'&&state.v33?.auth?.sessionValid!==false}
function v33IsOffline(){return state.v33?.network?.mode==='offline'}
function v33IsProtectedRoute(route){return !['login','authEmail','authLoading','setupProfile','setupCouple','setupFirstDate','planLoading','errorState','connectionHelp'].includes(route)}
function v33ShouldShowMainNav(){return v33IsSignedIn()&&state.v33.setup.profileDone&&state.v33.setup.coupleDone&&state.v33.setup.firstPlanDone}
function v33ApplyRouteGuard(){
  const route=current().route;
  if(!v33IsSignedIn()){
    if(!['login','authEmail','authLoading','connectionHelp'].includes(route)){
      if(v33IsProtectedRoute(route))state.v33.auth.resumeNav=structuredClone(nav);
      nav=[{route:'login',params:{reason:state.v33.auth.reason||null}}]
    }
    return
  }
  if(!state.v33.setup.profileDone){if(route!=='setupProfile')nav=[{route:'setupProfile',params:{}}];return}
  if(!state.v33.setup.coupleDone){if(route!=='setupCouple')nav=[{route:'setupCouple',params:{}}];return}
  if(!state.v33.setup.firstPlanDone){if(!['setupFirstDate','planLoading','errorState'].includes(route))nav=[{route:'setupFirstDate',params:{}}];return}
}
function v33Boot(){v33EnsureState();v38PlaceState();if(state.planner.area)ensureNationwideArea(state.planner.area);if(!v33IsSignedIn())nav=[{route:'login',params:{reason:state.v33.auth.reason||null}}];else if(!state.v33.setup.profileDone)nav=[{route:'setupProfile',params:{}}];else if(!state.v33.setup.coupleDone)nav=[{route:'setupCouple',params:{}}];else if(!state.v33.setup.firstPlanDone)nav=[{route:'setupFirstDate',params:{}}];else nav=[{route:'home',params:{}}]}
function v33NotifySaveFailure(){const app=document.getElementById('app');if(!app)return;app.querySelector('.v33-save-error-sheet')?.remove();app.insertAdjacentHTML('beforeend',`<div class="v33-save-error-sheet"><div class="v33-save-error-card"><h3>저장하지 못했어요</h3><p>사진이나 오래된 기록 때문에 기기 저장 공간이 부족할 수 있어요. 지금 화면은 닫지 않았고 입력한 내용도 가능한 한 그대로 두었어요.</p><button onclick="this.closest('.v33-save-error-sheet').remove()">확인</button></div></div>`)}
function v33RequireOnline(msg='인터넷 연결이 필요해요.'){if(!v33IsOffline())return true;toast(msg);return false}
function v33ErrorPanel(title,desc,action,label){return `${pagebar('문제가 생겼어요')}<div class="v33-error"><div class="v33-error-icon">!</div><h1>${esc(title)}</h1><p>${esc(desc)}</p><div class="v33-error-actions"><button class="main" onclick="${action}">${esc(label)}</button></div></div>`}

function v33ProviderLabel(p){return ({kakao:'카카오',apple:'Apple',google:'Google',email:'이메일',legacy:'기존 계정'})[p]||'계정'}
function v33BeginLogin(provider){if(v33IsOffline()){state.v33.auth.reason='offline';render();return}state.v33.auth.pendingProvider=provider;state.v33.auth.reason=null;nav=[{route:'authLoading',params:{provider}}];render();const delay=state.v33.network.mode==='slow'?1800:650;const id=setTimeout(()=>v33FinishLogin(provider),delay);timers.push(id)}
function v33FinishLogin(provider){state.v33.auth.status='signed_in';state.v33.auth.provider=provider;state.v33.auth.sessionValid=true;state.v33.auth.lastLoginAt=Date.now();state.v33.auth.reason=null;if(provider==='email')state.v33.auth.email=state.v33.runtime.pendingEmail||'demo@moment.app';if(!save())return;const resume=state.v33.auth.resumeNav;state.v33.auth.resumeNav=null;if(state.v33.setup.profileDone&&state.v33.setup.coupleDone&&state.v33.setup.firstPlanDone&&Array.isArray(resume)&&resume.length)nav=resume;else if(!state.v33.setup.profileDone)nav=[{route:'setupProfile',params:{}}];else if(!state.v33.setup.coupleDone)nav=[{route:'setupCouple',params:{}}];else if(!state.v33.setup.firstPlanDone)nav=[{route:'setupFirstDate',params:{}}];else nav=[{route:'home',params:{}}];render()}
function v33SubmitEmailLogin(){const email=document.getElementById('v33Email')?.value.trim(),pw=document.getElementById('v33Password')?.value;if(!email||!email.includes('@')){toast('이메일 주소를 확인해주세요.');return}if(!pw||pw.length<4){toast('비밀번호를 4자 이상 입력해주세요.');return}state.v33.runtime.pendingEmail=email;v33BeginLogin('email')}
function v33Logout(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>로그아웃할까요?</h3><p>이 기기에 저장된 데이트 기록은 지우지 않아요. 다시 로그인하면 그대로 이어갈 수 있어요.</p><button class="primary" onclick="v33DoLogout()">로그아웃</button><button class="secondary" style="width:100%;margin-top:8px" onclick="this.closest('.sheet-wrap').remove()">취소</button></div></div>`)}
function v33DoLogout(){state.v33.auth.status='signed_out';state.v33.auth.sessionValid=false;state.v33.auth.reason=null;if(!save())return;nav=[{route:'login',params:{}}];render()}
function v33ExpireSession(){state.v33.auth.resumeNav=structuredClone(nav);state.v33.auth.status='signed_out';state.v33.auth.sessionValid=false;state.v33.auth.reason='expired';save();nav=[{route:'login',params:{reason:'expired'}}];render()}
function v33SaveBasicProfile(){const me=document.getElementById('v33Me')?.value.trim(),region=v23CleanArea(document.getElementById('v33Region')?.value);if(!me){toast('앱에서 부를 이름을 적어주세요.');return}state.profile.me=me.slice(0,20);state.profile.region=region;state.planner.area=region||state.planner.area;state.v33.setup.profileDone=true;if(!save())return;nav=[{route:'setupCouple',params:{}}];render()}
function v33InviteCode(){if(!state.v33.couple.inviteCode){const raw=(hash((state.v33.auth.email||state.profile.me||'moment')+'|'+Date.now()).toString(36).toUpperCase()+'MOMENT').replace(/[^A-Z0-9]/g,'');state.v33.couple.inviteCode=raw.slice(0,6)}return state.v33.couple.inviteCode}
function v33SetCoupleFlow(flow){state.v33.couple.flow=flow;if(flow==='invite')v33InviteCode();render()}
function v33ShareInvite(){const code=v33InviteCode(),text=`모먼트에서 우리를 연결해요. 초대 코드 ${code}`;if(navigator.share)navigator.share({title:'모먼트 커플 연결',text}).catch(()=>{});else copyText(code)}
function v33CompleteCoupleLink(source){let partner=document.getElementById('v33PartnerName')?.value.trim();const start=document.getElementById('v33CoupleStart')?.value;if(source==='code'){const code=document.getElementById('v33JoinCode')?.value.trim().toUpperCase();if(!code||code.length<4){toast('초대 코드를 확인해주세요.');return}partner=partner||'연인'}if(!partner)partner='연인';state.profile.partner=partner.slice(0,20);if(start)state.profile.coupleStart=start;state.v33.couple.status='linked';state.v33.couple.partnerName=state.profile.partner;state.v33.couple.linkedAt=Date.now();state.v33.setup.coupleDone=true;if(!save())return;nav=[{route:'setupFirstDate',params:{}}];render()}
function v33SkipCouple(){state.v33.couple.status='skipped';state.v33.couple.flow=null;state.v33.setup.coupleDone=true;if(!save())return;nav=[{route:'setupFirstDate',params:{}}];render()}
function v33FinishFirstDateSetup(){const area=v23CleanArea(document.getElementById('v33FirstArea')?.value),date=document.getElementById('v33FirstDate')?.value,time=document.getElementById('v33FirstTime')?.value;if(area.length<2||!date||!time){toast('지역, 날짜, 시간을 확인해주세요.');return}state.planner.area=area;state.planner.date=date;state.planner.time=time;state.planner.duration=5;state.profile.region=state.profile.region||area;ensureNationwideArea(area);v23RememberArea(area);state.v33.setup.firstPlanDone=true;state.v13.onboarded=true;if(!save())return;v33StartPlanLoading('first')}
function v33NeedsNextDayConfirm(start,ret){return !!start&&!!ret&&hmToMin(ret)<hmToMin(start)}
function v33ConfirmNextDayReturn(callback){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="sheet-wrap"><div class="sheet"><div class="grab"></div><h3>다음 날 귀가가 맞나요?</h3><p>귀가 시간이 시작 시간보다 빨라서 다음 날 귀가로 계산돼요. 잘못 선택했다면 시간을 다시 확인해주세요.</p><button class="primary" id="v33NextDayOk">다음 날 귀가가 맞아요</button><button class="secondary" style="width:100%;margin-top:8px" onclick="this.closest('.sheet-wrap').remove()">시간 다시 보기</button></div></div>`);document.getElementById('v33NextDayOk').onclick=()=>{state.v33.runtime.nextDayConfirmed=true;document.querySelector('.sheet-wrap')?.remove();callback()}}
function v33StartPlanLoading(source){if(v33IsOffline()){state.v33.lastError={type:'network',source};nav.push({route:'errorState',params:{type:'network'}});render();return}state.v33.loading={source,stage:0,startedAt:Date.now()};nav.push({route:'planLoading',params:{source}});render();const delays=state.v33.network.mode==='slow'?[650,1350,2200]:[350,720,1180];delays.slice(0,2).forEach((d,i)=>{const id=setTimeout(()=>v33UpdatePlanLoading(i+1),d);timers.push(id)});const id=setTimeout(async()=>{await v38GeneratePlans();if(!save())return;state.v33.loading=null;replace('results');if(state.v38?.places?.status==='fallback')toast('장소 검색이 어려워 예시 데이터로 계속했어요')},delays[2]);timers.push(id)}
function v33UpdatePlanLoading(stage){if(current().route!=='planLoading')return;state.v33.loading.stage=stage;document.querySelectorAll('.v33-load-step').forEach((el,i)=>{el.classList.toggle('done',i<stage);el.classList.toggle('on',i===stage)});const msg=document.getElementById('v33LoadMsg');if(msg)msg.textContent=['주변에서 갈 만한 곳을 고르고 있어요.','동선과 이동시간을 비교하고 있어요.','예산과 귀가시간에 맞춰 마지막으로 정리하고 있어요.'][stage]||msg.textContent}
async function v33UseCachedPlan(){const last={...(state.v33.lastError||{})};await v38GeneratePlans({forceMock:true});if(!save())return;state.v33.lastError=null;if(last.source==='event'&&last.eventId){goBack();openV29CourseChooser(last.eventId)}else replace('results');toast('예시 데이터로 코스를 만들었어요')}
function v33RetryLastError(){if(v33IsOffline()){toast('인터넷 연결을 확인해주세요.');return}const last={...(state.v33.lastError||{})},src=last.source||'planned';state.v33.lastError=null;goBack();if(src==='event'&&last.eventId)setTimeout(()=>v29GenerateForEvent(last.eventId),50);else setTimeout(()=>v33StartPlanLoading(src),50)}
function v33SetNetwork(mode){state.v33.network.mode=mode;if(!save())return;render();toast(mode==='offline'?'오프라인 상태를 테스트해요':mode==='slow'?'느린 네트워크를 테스트해요':'네트워크를 정상으로 돌렸어요')}

function v33RestartSetup(){state.v33.setup={profileDone:false,coupleDone:false,firstPlanDone:false};state.v33.couple=structuredClone(defaultState.v33.couple);state.v13.onboarded=false;if(!save())return;nav=[{route:'setupProfile',params:{}}];render()}

routes.login=({reason}={})=>{const expired=(reason||state.v33.auth.reason)==='expired',offline=v33IsOffline();return `<div class="v33-auth"><div class="v33-auth-brand">모먼트</div><div class="v33-auth-main"><h1>${expired?'다시 연결하면\n바로 이어갈게요.':'오늘 데이트,\n그냥 따라오세요.'}</h1><p>${expired?'로그인 세션만 만료됐어요. 작성하던 일정과 기록은 이 기기에 그대로 보관돼 있어요.':'언제·어디서 만나는지만 정하면 코스, 이동, 시간 관리, 기록까지 한 흐름으로 이어져요.'}</p>${expired?`<div class="v33-auth-alert">로그인이 만료됐어요. 다시 로그인하면 보던 화면으로 돌아가요.</div>`:''}${offline?`<div class="v33-auth-alert offline">인터넷 연결이 없어서 로그인할 수 없어요. Wi-Fi나 모바일 데이터를 확인한 뒤 다시 시도해주세요.</div>`:''}<div class="v33-auth-proof"><div><i>1</i><span>전국 어느 동네든 실제 하루처럼 코스를 구성해요.</span></div><div><i>2</i><span>데이트 중에는 이동과 남은 체류시간까지 이어서 봐요.</span></div><div><i>3</i><span>끝나면 둘의 일정·사진·기록으로 자연스럽게 남아요.</span></div></div></div><div class="v33-auth-actions"><button class="v33-auth-btn kakao" onclick="v33BeginLogin('kakao')">카카오로 계속하기</button><button class="v33-auth-btn apple" onclick="v33BeginLogin('apple')">Apple로 계속하기</button><button class="v33-auth-btn google" onclick="v33BeginLogin('google')">Google로 계속하기</button><button class="v33-auth-btn email" onclick="navigate('authEmail')">이메일로 계속하기</button><p class="v33-auth-legal">프로토타입에서는 실제 인증 대신 로그인 흐름을 시뮬레이션해요.</p></div></div>`}

# MOMENT / 모먼트 v38 — 새 채팅 전체 인수인계 컨텍스트

> **사용법:** 새 ChatGPT 채팅에서 이 파일과 `index.html`을 함께 올리거나, `index.html` 하나만 올려도 됩니다. `index.html` 하단에도 이 인수인계 문맥이 HTML 주석으로 포함되어 있습니다. 새 채팅의 어시스턴트는 이 문서를 **현재 제품의 권위 있는 기준 상태(authoritative state)** 로 취급하고, 사용자가 이전 맥락을 다시 설명하게 하지 말아야 합니다.

—-

## 0. 새 채팅 어시스턴트에게 주는 최우선 지시

이 프로젝트는 한국어 커플/데이트 앱 **모먼트(MOMENT)** 의 단일 HTML 프로토타입이다. 사용자는 제품 오너처럼 직접 UX를 검수하며, 매우 구체적으로 불편한 부분을 지적한다. 답변은 한국어로, 군더더기 없이 직접적으로 한다. 사용자가 버그를 하나 찾으면 그 부분만 고치지 말고 **인접 흐름과 같은 유형의 오류를 함께 전수검사**해야 한다.

반드시 지킬 것:

1. **현재 최신 기준본은 이 파일에 함께 제공된 `index.html`** 이다.
2. 이전 버전으로 회귀하지 말 것.
3. 기능을 새로 붙일 때는 기존 로직/저장/캘린더/live/커플 콘텐츠를 깨뜨리지 말 것.
4. 사용자가 직접 버그를 하나씩 찾게 만들지 말고, 수정 후 주변 흐름까지 선제적으로 검수할 것.
5. “오류 하나도 없다” 같은 표현은 실제 검증이 없으면 하지 말 것.
6. 단일 HTML 프로토타입이지만, 실제 서비스로 갈 수 있도록 provider / state / UI의 책임을 분리하는 방향을 유지할 것.
7. **API 키나 비밀값은 코드/인수인계 문서에 절대 넣지 말 것.** 과거 대화에서 키가 제공된 적이 있어도 새 채팅에서 재노출하지 말고 환경변수/서버 프록시 방식으로만 다룬다.
8. 사용자가 “멍청한 사용자도 쓸 수 있게”를 중요하게 본다. 모든 화면은 다음 행동이 명확해야 하며, 입력값을 받았다면 반드시 이후 어디선가 확인/수정할 수 있어야 한다.

## 1. 제품 한 줄 정의

**“언제/어디서 만날지만 알려주면, 데이트 코스부터 이동·시간 관리·귀가·기록까지 실제 데이트를 운영해주는 앱.”**

단순 장소 추천 앱이 아니다. 내부적으로는 **Date OS / 데이트 실행 앱**에 가깝다.

경쟁 포지션:
- 데이트팝/데이트립: 어디 갈지 찾는 앱
- 오디: AI 코스 추천
- 썸원/비트윈/The Couple: 커플 소통/기록
- TimeTree: 일정 공유
- **모먼트: 데이트 계획 → 실제 이동 → 체류 → 조정 → 귀가 → 기록까지 한 흐름으로 운영**

핵심 차별점은 **실시간 데이트 진행 모드**다.

—-

## 2. 디자인 원칙

사용자가 강하게 싫어했던 것:
- AI 양산형 랜딩페이지 느낌
- 큰 파스텔 히어로 + AI 라벨 + 설명 칩 3개
- 과한 그라데이션
- 의미 없는 배지/상태 점
- 카드 박스 남발
- 작은 글씨
- 정보가 한 화면에 너무 많이 경쟁하는 구조
- 사진 위 텍스트가 겹쳐 가독성이 깨지는 UI
- 버튼이 화면을 계속 가리는 fixed CTA

현재 방향:
- **화이트 베이스**
- 현대적인 한국 소비자 앱 느낌
- 큰 타이포 + 넉넉한 여백
- 카드보다는 섹션/행 중심
- 한 화면에 대표 행동 하나
- 사진은 필요할 때만, 텍스트 가독성을 깨지 않게 독립 미디어 영역으로 사용
- 메인 기능 존재감은 장식이 아니라 **위계와 행동 구조**에서 나온다
- 탭: **홈 / 데이트 / 라운지 / 우리**

타이포 시스템은 Display / Page / Section / Card / Body / Caption 정도의 제한된 단계로 유지한다.

마이크로 인터랙션은 짧고 기능적인 수준만:
- 버튼 pressed
- 바텀시트
- 화면 진입
- skeleton
- 오늘 콘텐츠 좌우 전환
- 저장 완료
과장된 AI식 움직임은 금지.

—-

## 3. 첫 5분 경험 — 매우 중요

최초 사용자 플로우:

**로그인 → 기본정보 → 커플연동 선택 → 첫 데이트 입력 → 단계별 로딩 → 추천 → 코스 상세**

로그인 목업:
- 카카오
- Apple
- Google
- 이메일

첫 기본정보는 최소:
- 이름/별명
- 자주 만나는 지역(선택)

커플연동은 강제하지 않음:
- 내가 초대하기 → 6자리 코드 생성/복사/공유
- 받은 코드 입력
- 지금은 혼자 시작
- 나중에 설정에서 다시 연결 가능

첫 코스는 처음부터 예산/교통/컨디션을 다 묻지 않는다.
우선:
- 어디서 만나나요?
- 언제 만나나요?
만 받고 첫 성공 경험을 만든다.

사용자가 앱 설치 후 **5분 내 “이거 실제 데이트에 따라가면 되겠네”** 라고 느끼는 게 목표다.

—-

## 4. 로그인 / 세션 / 네트워크 설계

현재는 mock auth/provider지만 UX는 구현되어 있다.

원칙:
- **네트워크 끊김 ≠ 로그아웃**
- 오프라인이어도 로컬 일정/메모 등은 유지
- 온라인 기능만 재시도
- 세션이 진짜 만료됐을 때만 로그인 화면
- 재로그인 후 이전 화면/작성 상태로 복귀

오류 예시:
- 인터넷 연결 확인 → `다시 시도` / `예시 데이터로 계속`
- 세션 만료 → `다시 로그인하면 보던 화면으로 돌아가요`
- 저장 실패 → 성공 토스트 금지, 화면 이동 중단

QA 시 강제로 테스트해야 할 상태:
- 정상
- 느린 네트워크
- 오프라인
- 세션 만료
- 사진 실패
- 결과 0개
- 긴 장소명
- 주소 없음
- 영업시간 없음
- localStorage 저장 실패

—-

## 5. 홈 구조

홈은 기능 백화점처럼 만들지 않는다.

핵심 상단:
- **데이트 코스 짜기**
- **이미 데이트 중이에요 · 지금 뭐 하지?**

데이트 코스 짜기 버튼을 누르면 composer / bottom sheet에서 필요한 값을 받는다.
현재 위치 사용 기능이 일반 코스 짜기에도 있다.

그 아래는 조용한 섹션:
- 오늘 우리 둘
- 다가오는 것
- 우리의 최근
- 라운지 인기글

진행 중 live가 있으면 홈 상단에 `진행 중인 데이트 / 이어서 하기`가 나온다.

중요: **진행 중이거나 잠시 나가기로 보존된 live가 있으면 새 코스 생성을 그대로 허용하면 안 된다.**
현재 최신 빌드는 충돌 시:
- 기존 데이트 이어가기
- 기존 진행 종료 후 새 코스 만들기
를 명확히 고르게 한다.

—-

## 6. 전국 지역 / 다양한 데이트 추천

초기 성수/강남/건대 고정 데이터셋은 폐기 방향.

사용자는 전국 어디든 입력 가능해야 한다:
- 전주 효자동
- 원주 무실동
- 제주 애월
- 거창읍
- 청주 복대동
- 역/동네/시군구 단위 등

현재 실제 외부 장소 API 전이라 mock place provider를 사용하지만 UI/로직은 전국형으로 구성.

데이트는 트렌디한 카페/전시만 추천하지 않는다.
가능한 유형 예:
- 동네 식당 → 산책 → 코노 → PC방
- 공원 → 영화 → 술
- 밥 → 볼링 → PC방
- 시장 → 산책 → 술
- 밥 → 영화 → 카페
- 시장 → 드라이브 → 야경
- 쇼핑 → 식사 → 놀거리
- 문화/실내/드라이브/동네 데이트

카테고리 후보:
식사, 분식, 공원, 산책, 영화, 코인노래방, PC방, 볼링, 카페, 술, 시장, 쇼핑, 전시, 드라이브, 야경, 실내 놀거리 등.

추천 엔진의 hard constraints:
- 예산 초과 금지
- 사용 가능한 데이트 시간 초과 금지
- 귀가 마지노선 초과 금지

조건이 너무 빡빡하면 억지로 장소 수를 채우지 말고 코스를 축소하거나 대안을 설명한다.

`조금 더 저렴하게` 같은 대안 라벨은 실제 계산 결과를 비교해서만 붙인다.

—-

## 7. 추천 결과 / 코스 확정

추천 결과는 3개를 똑같이 경쟁시키지 않는다.
- 1순위 추천을 가장 명확히
- 대안은 실제 특성에 따라 저렴하게 / 이동 적게 / 특별하게 등

CTA 최신 문구:
- `코스 보기`
- **`이대로 결정할게요`**

두 버튼의 아이콘/높이/비율은 동일해야 한다.

코스 상세 CTA:
- `일정·코스 수정`
- `데이트 시작`
두 버튼 크기도 동일.

### 확정 직후 플로우
`이 코스로 확정` 후 화면에 남겨두지 않는다.
`코스가 확정됐어요` 시트에서 다음 행동을 제공:
- 지금 데이트 시작
- 홈으로 가기 / 일정 보기

오늘/현재에 가까운 일정이면 시작을 강조하고, 미래 일정이면 홈/일정 쪽을 자연스럽게 우선시한다.

확정 상태는 홈의 다가오는 데이트와 캘린더에 반영되어야 한다.

—-

## 8. 코스 상세

중요한 과거 버그:
- 이미지가 텍스트 영역까지 덮음
- 하단 `데이트 시작` fixed CTA가 스크롤 내내 내용을 가림

현재 원칙:
- 사진 영역과 텍스트 영역 완전 분리
- 밝은/어두운 사진과 무관하게 텍스트는 불투명 배경 위
- CTA는 콘텐츠 흐름 안에 자연스럽게 배치
- 장소명, 주소, 시간, 비용, 이동 정보가 이미지 때문에 안 보이면 안 됨

`이 코스를 추천한 이유`는 고정 문구 금지.
실제 코스 구성, 예산, 이동시간, 귀가시간, 데이트 스타일을 보고 동적으로 생성해야 한다.

—-

## 9. 실제 데이트 진행 모드 — 핵심 기능

데이트 시작 시 첫 장소에 이미 도착한 것으로 시작하면 안 된다.

정상 흐름:
**데이트 시작 → 현재 위치에서 첫 장소로 이동 → 도착 → 첫 장소 체류 → 다음 장소 이동 → ... → 귀가/종료**

live 상태는 대략:
- to_first
- moving
- at
- paused/active
- ended

### 첫 장소 이동 / 장소 간 이동
교통수단:
- 도보
- 대중교통
- 택시
- 자차

목적지 주소는 이동 중에도 항상 확인 가능해야 한다.

### 대중교통 상세
버스:
- 타는 정류장명
- 정류장 번호
- 어느 방향 정류장인지
- 가능한 버스 번호 여러 개
- 추천 버스
- 가장 빠른 버스 / 다음 버스
- 몇 정거장
- 내리는 정류장
- 하차 후 방향

지하철:
- 역명
- 호선
- 방면
- 승강장
- 빠른 열차 / 다음 열차
- 몇 정거장
- 하차역
- 출구
- 빠른 하차 추천 칸

현재 값은 mock. 실제 API 연결 시 provider만 교체하는 방향.

### 체류시간
추천 체류시간은 실시간으로 초 단위 감소.
- 10분 남음 알림
- 5분 남음 알림
- `다음 장소로 출발`
- `10분 더 있을래요`
- `10분 일찍 갈래요`

정확한 규칙:
- 현재 보이는 남은 시간 기준 ±10분
- 이미 시간이 만료된 상태에서 +10 → **지금부터 정확히 10분**
- 남은 시간이 10분 이하인데 -10 → 즉시 현재 장소 종료 후 다음 이동

앞 코스에서 늦어지면 뒤 장소 추천 체류시간도 일정에 맞게 재조정될 수 있어야 한다.

### 잠시 나가기
현재 장소/이동 단계/교통수단/사진 등을 보존하고 홈에서 이어가기.

중요: 잠시 나간 live가 있는 상태에서 새 데이트 코스 생성은 충돌 UX로 막는다.

### 종료
실수 방지를 위해 즉시 종료하지 말고 확인 단계 제공.

—-

## 10. 사진 / 추억 / 데이트 마무리

진행 중:
- 사진 찍기/사진 추가 가능
- 현재 장소의 추억으로 저장
- 프로토타입 상한 10장
- 10/10에서 추가 불가 안내, 오래된 사진 몰래 삭제 금지

마무리에서 의미 없는 `사진 수 직접 입력`은 제거됨.
실제 live에서 남긴 사진 개수로 기록.

마무리 기록:
- 실제 시작~종료 시간 기반 함께한 시간
- 자동 코스 비용은 `예상 비용`
- 사용자가 실제 금액을 넣은 경우만 `실제 비용`
- 사용자 평가를 하지 않았는데 임의 4.8 같은 만족도 생성 금지
- 만족도는 직접 선택 시만 저장

`오늘 한 줄`보다 커플다운 구조:
- 나 → 연인에게 하고 싶은 말
- 연인 → 나에게 하고 싶은 말
- 나중에 기록 상세에서 추가/수정 가능

사진은 실제 서비스에서 서버/object storage로 이동해야 한다. localStorage base64는 프로토타입 한계.

—-

## 11. 데이트 탭 / 캘린더

데이트 탭의 메인은 월간 캘린더.

점 규칙:
- 지난 일정: 회색 점
- 예정 일정: 빨간 점

캘린더에:
- 하단 `+ 일정 추가`
- 화면 우하단에 **항상 따라다니는 fixed FAB + 버튼**
둘 다 존재.

FAB는 콘텐츠 최하단에 붙어 있으면 안 된다.
키보드가 올라오면 가리지 않도록 숨기거나 이동.

일정 추가:
- 데이트 이름
- 날짜
- 시간
- 지역
- 메모

중요: **메모를 입력받았다면 캘린더/일정 상세에서 실제 메모 내용이 보여야 한다.** `메모 있음` 같은 불친절한 표현만 보여주면 안 된다.

일정 상세:
- 기존 메모 표시
- 수정 시 기존 값 prefill
- 날짜/시간/지역/메모 수정
- 코스가 없으면 고르기
- 이미 있으면 코스 변경
- 확정 일정 취소 가능

일정에 코스를 붙이는 순간 planId만 저장하지 말고 일정별 **코스 snapshot** 보존. 다른 추천을 생성해도 일정 코스가 사라지면 안 된다.

일정 시간 변경 시 코스 타임라인도 재계산.

일정 지역을 변경해서 기존 코스 지역과 달라지면 기존 코스를 자동 분리하고 `고민 중 후보`로 보존.

`코스 고민 중` 빈 상태는 중앙 정렬된 정상적인 empty state.
후보 코스 상세 마지막에는:
**“이 코스, 언제 즐기고 싶어요?”**
날짜/시간을 골라 캘린더에 넣을 수 있다.

—-

## 12. 기념일

홈의 다음 기념일을 누르면 우리 탭으로 보내지 말고 **기념일 전용 페이지**.

자동 계산:
- 100일
- 200일
- 300일
- ...

정확히 D+100 당일을 건너뛰면 안 됨.

사용자 추가:
- 생일
- 첫 여행
- 처음 만난 날
- 사용자 기념일
- 매년 반복 여부
- 수정/삭제

과거 1회성 기념일이 `오늘`처럼 보이면 안 된다.

—-

## 13. 오늘 우리 둘 / 커플 체류 기능

커뮤니티 외에도 데이트 없는 날 들어올 이유를 만든다.

### 가벼운 오늘 콘텐츠
- 오늘의 10초 선택
- 오늘의 밸런스
- 오늘의 질문

홈과 우리 탭에서 동일한 캐러셀 UX.
- 좌우 화살표
- 모바일 스와이프
- 자연스러운 슬라이드
- 넘길 때 전체 페이지 rerender / scroll top 이동 금지

10초 선택 완료 → 기본 다음 추천은 밸런스 → 질문 순서지만 사용자가 자유롭게 넘길 수 있다.

질문:
- 내 답 수정 시 기존 답 prefill
- `연인이 답하면 알려드릴까요?`
- 켰다면 `연인이 답하면 알려드릴게요.`
- 끌 때 `연인 답장 알림을 끌까요?`

API 전에도 mock delay로 테스트.
코스 생성 단계 예:

### Error

외부 이미지 실패 시 깨진 아이콘/빈 박스 금지.
- skeleton during loading
- 실패 시 fallback visual

### Keyboard
입력 화면에서 키보드가 저장 버튼을 가리면 안 됨.
- focus 시 scroll into view

## 18. 데이터/안정성 원칙

주요 엔티티를 섞지 않는다:
- **Plan** = 장소/동선 중심의 코스
- **Schedule/Event** = 날짜/시간/지역/메모 + 코스 스냅샷
- **Live** = 실제 진행 상태
- **Record** = 실제 완료 결과

중복된 날짜/시간 값이 서로 따로 놀지 않게 관리.

저장 실패 시 성공 처리 금지.

신규 사용자는 데모용 과거 기록/가짜 연애 데이터가 보이면 안 된다.
데모 데이터와 실제 초기상태 분리.

사용자/API 문자열을 inline JS에 직접 삽입해 문법이 깨지지 않도록 안전하게 처리.

현재 단일 HTML 프로토타입이지만 function/route 중복 정의를 만들지 않는 **clean build 원칙** 유지.

## 24. v38 장소 provider 브리지

최신 기준본은 v38이다. 추천 엔진의 기존 hard constraint와 UI는 유지하면서 장소 데이터 획득 책임을 분리했다.

- 공개 계약: `searchPlaces({ area, categories, limit })`
- 기본 모드: `mock`
- 실제 연동 모드: `proxy`
- 프록시 요청: `GET /api/places/search?area=…&categories=…&limit=…`
- 브라우저 HTML에는 장소 API 키를 넣지 않는다. 키와 공급자별 변환은 서버 프록시가 담당한다.
- 외부 장소 이름·주소·ID·이미지는 정규화한 뒤 사용한다. 내부 ID는 안전한 해시로 다시 만든다.
- 프록시가 실패하면 같은 지역의 최근 provider 결과가 있으면 재사용하고, 없으면 예시 장소로 흐름을 계속한다.
- 추천 화면과 개발·QA 화면에서 현재 장소 데이터 출처를 확인할 수 있다.
- 저장 키는 `moment_v38`; 기존 `moment_v36` 이하 상태를 읽어 자동 마이그레이션한다.
