p ${p.energy===v?'on':''}" onclick="setPlanOpt('energy','${v}',this)">${l}</button>`).join('')}</div><div class="field-label" style="margin-top:15px">귀가 마지노선</div><input class="input" id="returnTime" type="time" value="${p.returnTime}"></div></div></div><div style="height:96px"></div><div class="cta-fixed"><button class="primary" onclick="generateFromPlanner()">코스 짜줘</button></div>`}
routes.results=()=>{return `${pagebar('추천 코스',`<button class="iconbtn" onclick="regenerate()">↻</button>`)}<div class="section compact"><h1 style="font-size:30px;letter-spacing:-1.1px;margin:4px 0 5px">세 가지로 골라봤어요.</h1><div class="section-sub">다 고를 필요 없어요. 제일 마음 가는 것 하나만 보면 돼요.</div></div><div class="section compact">${state.plans.map((p,i)=>`<div class="result-card"><div class="result-img"><img src="${p.cover}"><div class="result-badge">${['가장 잘 맞음','가성비','평소와 다르게'][i]||'추천'}</div></div><div class="result-body"><div class="result-title">${esc(p.title)}</div><div class="result-reason">${esc(p.reason)}</div><div class="result-meta"><span class="meta-pill">${p.totalHours.toFixed(1)}시간</span><span class="meta-pill">2인 약 ${money(p.totalCost)}</span><span class="meta-pill">이동 ${p.travelMin}분</span></div><button class="result-button" onclick="openPlan('${p.id}')">코스 상세보기</button></div></div>`).join('')}</div>`}
routes.course=({id})=>{const p=findPlan(id);if(!p)return `${pagebar('코스')}<div class="section">코스를 찾지 못했어요.</div>`;const confirmed=state.confirmed.find(x=>x.planId===p.id);const live=state.live&&state.live.planId===p.id&&state.live.status!=='ended';return `${pagebar('코스 상세')}<div class="course-cover"><img src="${p.cover}"><div class="cover-copy"><h1>${esc(p.title)}</h1><p>${p.totalHours.toFixed(1)}시간 · 2인 약 ${money(p.totalCost)} · ${esc(p.config?.area||state.planner.area)}</p></div></div><div class="why"><b>이 코스를 추천한 이유</b><ul>${p.why.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="timeline">${timelineHTML(p)}</div><div class="section"><div class="field"><div class="field-label">귀가 체크</div><div class="field-value">${p.returnLeave}까지 마지막 장소에서 출발 권장</div><div class="field-note">내 집까지 ${p.return.me.duration}분 · 연인 집까지 ${p.return.partner.duration}분 · 두 사람 중 더 촉박한 쪽 기준</div><button class="smallbtn" style="margin-top:10px" onclick="navigate('return',{planId:'${p.id}'})">귀가 경로 자세히</button></div></div><div style="height:110px"></div><div class="cta-fixed">${live?`<button class="primary" onclick="resumeLive()">데이트 이어가기</button>`:confirmed?`<button class="primary" onclick="startLive('${p.id}')">데이트 시작</button>`:`<div style="display:grid;grid-template-columns:1fr 1.5fr;gap:9px"><button class="secondary" onclick="saveCandidate('${p.id}')">고민 중 저장</button><button class="primary" onclick="confirmPlan('${p.id}')">이 코스로 확정</button></div>`}</div>`}
routes.live=()=>{const L=state.live;if(!L||L.status==='ended')return `${pagebar('데이트 진행')}<div class="section">진행 중인 데이트가 없어요.</div>`;const p=findPlan(L.planId);if(!p)return '' ;const pct=Math.min(100,Math.round((L.placeIndex/(p.places.length))*100));if(L.stage==='moving')return liveMoving(p,L,p.segments[L.segmentIndex]);return liveAt(p,L)}
routes.walkNav=({planId,segIndex,stepIndex,returnWho})=>{const ctx=getSegmentContext(planId,segIndex,returnWho),step=ctx?.segment?.steps?.[stepIndex];if(!step)return `${pagebar('도보 길찾기')}<div class="section">경로를 찾지 못했어요.</div>`;return `${pagebar('도보 길찾기',`<button class="iconbtn" onclick="copyText('${esc(step.to||ctx.destination.address)}')">${icon('copy')}</button>`)}<div class="map">${mapSVG('walk')}<div class="map-ui"><div class="map-pill">GPS 정확도 4m</div><div class="map-pill" id="walkRemain">${step.duration||6}분 남음</div></div><div class="map-bottom"><strong>${esc(step.to||ctx.destination.name)}</strong><p>${esc(step.address||ctx.destination.address)} · 현재 위치에서 경로를 계속 갱신해요.</p></div></div><div class="nav-instruction"><div class="instruction-main" id="walkInstruction">80m 직진 후 오른쪽</div><div class="instruction-sub">화면을 켜둔 동안 현재 위치 기준으로 다음 안내가 바뀝니다.</div><div class="nav-stats"><div class="stat"><span>남은 거리</span><b id="walkDist">420m</b></div><div class="stat"><span>남은 시간</span><b id="walkTime">${step.duration||6}분</b></div><div class="stat"><span>도착 예정</span><b>${minutesToHM(hmToMin(nowHM())+(step.duration||6))}</b></div></div></div>`}
routes.transit=({planId,segIndex,stepIndex,returnWho})=>{const ctx=getSegmentContext(planId,segIndex,returnWho),step=ctx?.segment?.steps?.[stepIndex];if(!step)return `${pagebar('대중교통')}<div class="section">정보를 찾지 못했어요.</div>`;const bus=step.type==='bus';return `${pagebar(bus?'버스 상세':'지하철 상세')}<div class="section compact"><div class="transit-card"><div class="transit-line"><div class="line-dot">${bus?'BUS':step.line||'2'}</div><div><b>${esc(step.from)} → ${esc(step.to)}</b><div class="section-sub">${bus?esc(step.line)+'번 · '+esc(step.stopId):esc(step.direction)+' · '+esc(step.platform)}</div></div></div><div class="train-row"><div><b>${bus?'가장 빠른 버스':'가장 빠른 열차'}</b><p id="vehicleLoc">${bus?'서울숲역 정류장 통과':'뚝섬역 출발'} · ${bus?'혼잡 보통':'권장 탑승 5-2칸'}</p></div><div class="countdown" data-countdown="112">1분 52초</div></div><div class="train-row"><div><b>다음 ${bus?'버스':'열차'}</b><p>${bus?'한양대입구 정류장 접근':'한양대역 접근'}</p></div><div class="countdown" data-countdown="368">6분 08초</div></div><div class="train-row"><div><b>도착 안내</b><p>${esc(step.stops||5)}정거장 · ${esc(step.exit||'3번 출구')} 이용 · ${esc(step.tip||'빠른 하차 위치 4-3칸')}</p></div><b>${step.duration}분</b></div></div></div>`}
routes.taxi=({planId,segIndex,returnWho})=>{const ctx=getSegmentContext(planId,segIndex,returnWho),s=ctx.segment;return `${pagebar('택시로 이동')}<div class="map">${mapSVG('car')}<div class="map-bottom"><strong>${esc(ctx.destination.name)}</strong><p>${esc(ctx.destination.address)}</p></div></div><div class="section compact"><div class="field"><div class="field-label">최종 목적지</div><div class="field-value">${esc(ctx.destination.name)}</div><div class="field-note">${esc(ctx.destination.address)}</div><div class="address-actions"><button onclick="copyText('${esc(ctx.destination.address)}')">주소 복사</button><button onclick="openMapApp('kakao','${esc(ctx.destination.address)}')">카카오맵</button></div></div><div class="field"><div class="field-label">호출 전 예상</div><div class="field-value">${s.durationMin}~${s.durationMin+6}분 · ${money(s.costLow)}~${money(s.costHigh)}</div><div class="field-note">현재 교통 ${s.traffic||'보통'} · 실제 배차와 요금은 택시 앱에서 확정돼요.</div></div><div class="feed-card"><div class="feed-pad"><div class="feed-kicker">택시는 외부 앱에서 호출</div><div class="feed-title">목적지만 그대로 넘겨드릴게요.</div><div class="feed-desc">이 앱이 직접 택시를 부른 것처럼 기사 도착시간을 꾸며내지 않아요. 호출 후 다시 돌아오면 진행 상태를 이어갈 수 있어요.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px"><button class="secondary" onclick="openTaxiApp('kakao','${esc(ctx.destination.address)}')">주소 복사 후 카카오 T 확인</button><button class="secondary" onclick="copyText('${esc(ctx.destination.address)}')">주소 복사</button></div></div></div></div>`}
routes.car=({planId,segIndex,returnWho})=>{const ctx=getSegmentContext(planId,segIndex,returnWho),s=ctx.segment;return `${pagebar('자차 길찾기')}<div class="map">${mapSVG('car')}<div class="map-bottom"><strong>${esc(ctx.destination.name)}</strong><p>${esc(ctx.destination.address)}</p></div></div><div class="section compact"><div class="field"><div class="field-label">목적지 주소</div><div class="field-value">${esc(ctx.destination.name)}</div><div class="field-note">${esc(ctx.destination.address)}</div><div class="address-actions"><button onclick="copyText('${esc(ctx.destination.address)}')">주소 복사</button><button onclick="openMapApp('kakao','${esc(ctx.destination.address)}')">카카오맵</button><button onclick="openMapApp('tmap','${esc(ctx.destination.address)}')">T map</button><button onclick="openMapApp('naver','${esc(ctx.destination.address)}')">네이버지도</button></div></div><div class="nav-stats"><div class="stat"><span>예상 시간</span><b>${s.durationMin}분</b></div><div class="stat"><span>유류비</span><b>${money(s.fuelCost||0)}</b></div><div class="stat"><span>주차 예상</span><b>${money(s.parkingCost||0)}</b></div></div><div class="field" style="margin-top:10px"><div class="field-label">추천 주차</div><div class="field-value">${esc(s.parkingName||'목적지 인근 공영주차장')}</div><div class="field-note">${esc(s.parkingAddress||ctx.destination.address)} · 주차 후 도보 ${s.walkAfter||4}분 · 예상 빈자리 ${s.spaces||12}대</div></div></div>`}
routes.return=({planId})=>{const p=findPlan(planId);return `${pagebar('귀가 경로')}<div class="section compact"><h1 style="font-size:28px;letter-spacing:-1px;margin:4px 0 7px">둘 다 무리 없이 집까지.</h1><div class="section-sub">마지막 장소에서 각자 집까지 따로 계산해요.</div></div>${['me','partner'].map(w=>{const r=p.return[w],name=w==='me'?state.profile.me:state.profile.partner;return `<div class="section compact"><div class="feed-card"><div class="feed-pad"><div class="feed-kicker">${esc(name)} 귀가</div><div class="feed-title">${r.duration}분 · ${r.lastTrain} 막차 여유</div><div class="feed-desc">${esc(r.summary)}</div><button class="feed-action" onclick="navigate('returnDetail',{planId:'${p.id}',who:'${w}'})">경로 상세보기</button></div></div></div>`}).join('')}`}
routes.returnDetail=({planId,who})=>{const p=findPlan(planId),r=p.return[who],name=who==='me'?state.profile.me:state.profile.partner;return `${pagebar(`${name} 귀가`)}<div class="section compact"><div class="field"><div class="field-label">권장 출발</div><div class="field-value">${p.returnLeave}</div><div class="field-note">막차 ${r.lastTrain} · 집 도착 예상 ${r.arrive}</div><div class="next-address"><div class="lab">귀가 최종 목적지</div><b>${who==='me'?esc(state.profile.homeMe):esc(state.profile.homePartner)}</b><div class="address-actions"><button onclick="copyText('${who==='me'?esc(state.profile.homeMe):esc(state.profile.homePartner)}')">주소 복사</button></div></div></div><div class="live-card" style="margin:12px 18px">${r.steps.map((s,i)=>`<button class="route-step" style="width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left" onclick="openReturnStep('${planId}','${who}',${i})"><div class="step-num">${i+1}</div><div><b>${esc(s.title)}</b><p>${esc(s.detail)}</p></div><div class="chev">›</div></button>`).join('')}</div></div>`}
routes.taste=()=>{const c=state.taste.choice;return `${pagebar('오늘의 10초 취향')}<div class="section compact"><h1 style="font-size:30px;letter-spacing:-1.1px;margin:4px 0 7px">오늘은 어디가 더 끌려?</h1><div class="section-sub">한 번 고르면 오늘 추천에 반영돼요.</div></div><div class="section compact"><div class="choice-wrap"><button class="choice-card ${c==='quiet'?'selected':c?'dim':''}" onclick="chooseTaste('quiet')"><img src="${IMG.cafe1}"><div class="choice-copy"><b>조용한 골목 카페</b><p>작고 조용한 공간, 오래 앉아 대화하기</p>${c==='quiet'?'<div class="choice-check">✓ 오늘은 이쪽</div>':''}</div></button><button class="choice-card ${c==='rooftop'?'selected':c?'dim':''}" onclick="chooseTaste('rooftop')"><img src="${IMG.cafe2}"><div class="choice-copy"><b>대형 루프탑 카페</b><p>뷰, 사진, 공간 자체를 즐기는 쪽</p>${c==='rooftop'?'<div class="choice-check">✓ 오늘은 이쪽</div>':''}</div></button></div>${c?`<div class="locked-note" style="margin-top:12px">오늘 선택이 저장됐어요. 다음 데이트 코스에 반영합니다.</div><button class="secondary" style="width:100%;margin-top:10px" onclick="changeTaste()">선택 변경</button>`:''}</div>`}
routes.question=()=>{const q='우리 처음 만났을 때 내가 어떤 사람 같았어?';return `${pagebar('오늘의 질문')}<div class="section compact"><div class="feed-card"><div class="feed-pad"><div class="feed-kicker">오늘의 질문</div><div class="feed-title">${q}</div><div class="feed-desc">두 사람 모두 답하면 서로의 답이 공개돼요.</div></div></div>${state.question.my?`<div class="answer-box" style="margin-top:12px"><div class="answer-label">내 답</div><div class="answer-text">${esc(state.question.my)}</div></div>${state.question.partner?`<div class="answer-box" style="margin-top:10px"><div class="answer-label">연인의 답</div><div class="answer-text">${esc(state.question.partner)}</div></div>`:`<div class="locked-note" style="margin-top:10px">연인의 답을 기다리고 있어요.</div><button class="secondary" style="width:100%;margin-top:8px" onclick="state.question.notify=!state.question.notify;save();render()">${state.question.notify?'✓ 연인이 답하면 알려주기':'연인 답변 알림 켜기'}</button>`}<button class="secondary" style="width:100%;margin-top:10px" onclick="editQuestion()">내 답 수정</button>`:`<textarea id="qAnswer" class="compose" style="margin-top:12px" placeholder="짧게 적어도 괜찮아요."></textarea><button class="primary" style="margin-top:10px" onclick="saveQuestion()">답변 저장</button>`}</div>`}
routes.balance=()=>{const b=state.balance;return `${pagebar('오늘의 밸런스')}<div class="section compact"><h1 style="font-size:29px;letter-spacing:-1px;margin:4px 0 6px">여행은 어떤 쪽?</h1><div class="section-sub">내가 고르기 전에는 연인의 답을 보여주지 않아요.</div></div><div class="section compact">${!b.my?`<div class="choice-wrap"><button class="choice-card" onclick="chooseBalance('short')"><img src="${IMG.park}"><div class="choice-copy"><b>자주 짧게 여행</b><p>가볍게, 자주, 부담 없이</p></div></button><button class="choice-card" onclick="chooseBalance('long')"><img src="${IMG.night}"><div class="choice-copy"><b>몰아서 길게 여행</b><p>한 번 갈 때 제대로 오래</p></div></button></div><div class="locked-note" style="margin-top:12px">연인도 참여했어요 👀 먼저 내 답을 골라주세요.</div>`:`<div class="feed-card"><div class="feed-pad"><div class="feed-kicker">결과</div><div class="feed-title">${b.my===b.partner?'둘의 선택이 같아요':'이번에는 의견이 갈렸어요'}</div><div class="mini-grid" style="margin-top:14px"><div class="mini-feed"><strong>나</strong><p>${b.my==='short'?'자주 짧게 여행':'몰아서 길게 여행'}</p></div><div class="mini-feed"><strong>연인</strong><p>${b.partner==='short'?'자주 짧게 여행':'몰아서 길게 여행'}</p></div></div><div class="feed-desc" style="margin-top:12px">선택은 오늘 기록으로 남고, 취향 학습에 한 번만 반영돼요.</div></div></div>`}</div>`}
routes.month=()=>{const rec=state.records.filter(r=>r.date.startsWith('2026-09'));const total=rec.reduce((a,r)=>a+r.cost,0),hrs=rec.reduce((a,r)=>a+r.hours,0),photos=rec.reduce((a,r)=>a+r.photos,0),rating=rec.length?(rec.reduce((a,r)=>a+r.rating,0)/rec.length).toFixed(1):'-';return `${pagebar('이번 달 기록',`<button class="iconbtn" onclick="navigate('addRecord')">${icon('plus')}</button>`)}<div class="section compact"><div class="month-hero"><div class="eyebrow">9월의 우리</div><h1 style="font-size:28px;margin:4px 0 0">${rec.length?`${rec.length}번 만나 ${Math.round(hrs)}시간 함께`:'이번 달 첫 기록을 남겨보세요'}</h1><div class="month-grid"><div class="month-stat"><span>총 사용</span><b>${money(total)}</b></div><div class="month-stat"><span>평균 만족도</span><b>${rating}</b></div><div class="month-stat"><span>사진</span><b>${photos}장</b></div><div class="month-stat"><span>평균 데이트</span><b>${rec.length?(hrs/rec.length).toFixed(1):0}h</b></div></div></div></div><div class="section compact"><div class="row-between"><h2 class="section-title">날짜별 기록</h2><button class="textbtn" onclick="navigate('addRecord')">기록 추가</button></div>${rec.length?rec.map(r=>recordHTML(r)).join(''):`<div class="feed-card" style="margin-top:12px"><div class="feed-pad"><div class="feed-desc">아직 9월 기록이 없어요. 데이트가 끝나면 자동으로 추가되고, 직접 추가할 수도 있어요.</div></div></div>`}</div>`}
routes.record=({id})=>{const r=state.records.find(x=>x.id===id);if(!r)return '';return `${pagebar('데이트 기록')}<div class="section compact"><div class="feed-card"><img class="memory-img" src="${IMG.memory}"><div class="feed-pad"><div class="feed-kicker">${esc(r.date)}</div><div class="feed-title">${esc(r.title)}</div><div class="record-meta"><span>${money(r.cost)}</span><span>${r.hours}시간</span><span>만족도 ${r.rating}</span><span>사진 ${r.photos}장</span></div><div class="feed-desc" style="margin-top:13px">${esc(r.memo)}</div></div></div><div class="field" style="margin-top:12px"><div class="field-label">그날 방문</div><div class="chips">${r.places.map(x=>`<span class="chip on">${esc(x)}</span>`).join('')}</div></div></div>`}
routes.addRecord=()=>`${pagebar('기록 추가')}<div class="section compact"><div class="field"><div class="field-label">날짜</div><input id="recDate" class="input" type="date" value="${today()}"></div><div class="field"><div class="field-label">제목</div><input id="recTitle" class="input" placeholder="예: 성수에서 느긋하게"></div><div class="field-row"><div class="field"><div class="field-label">실제 사용금액</div><input id="recCost" class="input" type="number" min="0" value="80000"></div><div class="field"><div class="field-label">사진 수</div><input id="recPhotos" class="input" type="number" min="0" value="0"></div></div><div class="field"><div class="field-label">한 줄 기록</div><textarea id="recMemo" class="compose" style="min-height:95px" placeholder="오늘 기억하고 싶은 것"></textarea></div><button class="primary" onclick="addRecord()">기록 저장</button></div>`
routes.records=()=>`${pagebar('지난 데이트')}<div class="section compact">${state.records.map(recordHTML).join('')}</div>`
routes.wishlist=()=>`${pagebar('위시리스트')}<div class="section compact">${state.wishlist.map(w=>`<div class="result-card"><div class="result-img" style="height:180px"><img src="${w.img}"></div><div class="result-body"><div class="result-title">${esc(w.name)}</div><div class="result-reason">${esc(w.area)} · 다음 코스 추천에 참고 중</div></div></div>`).join('')}</div>`
routes.dates=()=>{const live=state.live&&state.live.status!=='ended'?state.live:null;return `${topHome().replace('모먼트','데이트')}<div class="section compact">${live?`<div class="live-resume"><div class="tag">진행 중</div><h3>${esc(live.title)}</h3><p>${esc(live.currentLabel||'')}</p><button class="resume-btn" onclick="resumeLive()">이어서 하기</button></div>`:''}<div class="row-between" style="margin-top:${live?'20px':'0'}"><h2 class="section-title">예정된 데이트</h2><button class="textbtn" onclick="navigate('planner')">새로 만들기</button></div>${state.confirmed.length?state.confirmed.map(c=>{const p=findPlan(c.planId);return p?`<button class="record" style="width:100%;border:0;text-align:left" onclick="navigate('course',{id:'${p.id}'})"><b>${esc(p.title)}</b><p>${esc(c.date)} · ${esc(c.time)} · ${money(p.totalCost)}</p></button>`:''}).join(''):`<div class="feed-card" style="margin-top:12px"><div class="feed-pad"><div class="feed-desc">아직 확정한 데이트가 없어요.</div></div></div>`}<div class="row-between" style="margin-top:24px"><h2 class="section-title">고민 중</h2></div>${state.savedCandidates.length?state.savedCandidates.map(s=>`<button class="record" style="width:100%;border:0;text-align:left" onclick="navigate('course',{id:'${s.planId}'})"><b>${esc(s.title)}</b><p>후보로 저장됨 · ${money(s.totalCost)}</p></button>`).join(''):`<div class="section-sub" style="margin-top:10px">마음에 드는 코스를 저장해두면 여기에 모여요.</div>`}<div class="row-between" style="margin-top:24px"><h2 class="section-title">지난 데이트</h2><button class="textbtn" onclick="navigate('records')">전체</button></div>${state.records.slice(0,2).map(recordHTML).join('')}</div>`}
routes.lounge=()=>{const cats=['전체','데이트 추천','연애 고민','선물·기념일','맛집·장소','장거리'],posts=state.communityCategory==='전체'?state.posts:state.posts.filter(p=>p.cat===state.communityCategory);return `<div class="lounge-top"><h1>커플 라운지</h1><p>익명으로 편하게. 연애 연차와 상황이 보이니 맥락은 더 잘 보여요.</p></div><div class="category-scroll">${cats.map(x=>`<button class="chip ${state.communityCategory===x?'on':''}" onclick="state.communityCategory='${x}';save();render()">${x}</button>`).join('')}</div>${posts.length?posts.map(p=>postHTML(p)).join(''):`<div class="section compact"><div class="feed-card"><div class="feed-pad"><div class="feed-desc">아직 이 카테고리 글이 없어요. 첫 글을 남겨보세요.</div></div></div></div>`}<button class="fab" onclick="navigate('compose')">＋</button>`}
routes.post=({id})=>{const p=state.posts.find(x=>x.id===id);return `${pagebar('라운지')}<div class="section compact"><div class="post-card" style="margin:0"><div class="badge-row"><span class="c-badge">${esc(p.badge)}</span><span class="c-badge">${esc(p.region)}</span></div><h3 style="font-size:20px">${esc(p.title)}</h3><p style="font-size:12px">${esc(p.body)}</p><div class="post-foot"><button class="textbtn" onclick="likePost('${p.id}')">♡ 공감 ${p.likes}</button><span>댓글 ${p.comments.length}</span></div></div><div style="margin-top:18px"><h2 class="section-title" style="font-size:18px">댓글</h2><div class="feed-card" style="margin-top:10px"><div class="feed-pad">${p.comments.length?p.comments.map(c=>`<div class="comment"><b>${esc(c.who)}</b><p>${esc(c.text)}</p></div>`).join(''):`<div class="feed-desc">첫 댓글을 남겨보세요.</div>`}</div></div><textarea id="commentText" class="compose" style="min-height:78px;margin-top:10px" placeholder="익명으로 댓글 남기기"></textarea><button class="secondary" style="width:100%;margin-top:8px" onclick="addComment('${p.id}')">댓글 등록</button></div></div>`}
routes.compose=()=>`${pagebar('글쓰기')}<div class="section compact"><div class="field"><div class="field-label">카테고리</div><select id="postCat" class="input"><option>데이트 추천</option><option>연애 고민</option><option>선물·기념일</option><option>맛집·장소</option><option>장거리</option></select></div><div class="field"><div class="field-label">제목</div><input id="postTitle" class="input" placeholder="무슨 이야기를 나누고 싶나요?"></div><textarea id="postBody" class="compose" placeholder="내용을 적어주세요. 개인을 특정할 수 있는 정보는 피해주세요."></textarea><div class="locked-note" style="margin-top:10px">작성자 표시는 “${relationship()} · ${state.profile.region}”처럼 익명 칭호로 보여요.</div><button class="primary" style="margin-top:12px" onclick="submitPost()">등록하기</button></div>`
routes.us=()=>`${topHome().replace('모먼트','우리')}<div class="section compact"><div class="feed-card"><div class="feed-pad"><div class="feed-kicker">우리의 시간</div><div class="feed-title">${relationship()}</div><div class="feed-desc">다음 500일까지 ${Math.max(0,500-daysTogether())}일 · 함께 쌓인 기록 ${state.records.length}개</div></div></div></div><div class="section"><h2 class="section-title">오늘</h2><div class="mini-grid" style="margin-top:12px"><button class="mini-feed" style="border:0;text-align:left" onclick="navigate('taste')"><strong>취향</strong><p>${state.taste.choice?'오늘 선택 완료':'10초면 끝나요'}</p></button><button class="mini-feed" style="border:0;text-align:left" onclick="navigate('question')"><strong>질문</strong><p>${state.question.my?'내 답 저장됨':'오늘 하나 남기기'}</p></button><button class="mini-feed" style="border:0;text-align:left" onclick="navigate('balance')"><strong>밸런스</strong><p>${state.balance.my?'결과 보기':'서로 고르기'}</p></button><button class="mini-feed" style="border:0;text-align:left" onclick="navigate('month')"><strong>이번 달</strong><p>기록과 소비 보기</p></button></div></div><div class="section"><div class="feed-card"><img class="memory-img" src="${IMG.memory}"><div class="feed-pad"><div class="feed-kicker">랜덤 추억</div><div class="feed-title">말없이 오래 걸었던 날</div><div class="feed-desc">가끔은 계획보다 이미 함께한 시간이 더 오래 머물게 해요.</div><button class="feed-action" onclick="navigate('records')">추억 더 보기</button></div></div></div><div class="section"><div class="row-between"><h2 class="section-title">위시리스트</h2><button class="textbtn" onclick="navigate('wishlist')">전체</button></div><div class="chips" style="margin-top:12px">${state.wishlist.map(w=>`<span class="chip">${esc(w.name)}</span>`).join('')}</div></div>`
routes.profile=()=>`${pagebar('설정')}<div class="section compact"><div class="field"><div class="field-label">내 이름</div><input id="pfMe" class="input" value="${esc(state.profile.me)}"></div><div class="field"><div class="field-label">연인 이름</div><input id="pfPartner" class="input" value="${esc(state.profile.partner)}"></div><div class="field"><div class="field-label">연애 시작일</div><input id="pfStart" class="input" type="date" value="${state.profile.coupleStart}"></div><div class="field"><div class="field-label">내 집 기준 주소</div><input id="pfHomeMe" class="input" value="${esc(state.profile.homeMe)}"></div><div class="field"><div class="field-label">연인 집 기준 주소</div><input id="pfHomePartner" class="input" value="${esc(state.profile.homePartner)}"></div><div class="field"><div class="field-label">기본 데이트 예산</div><input id="pfBudget" class="input" type="number" min="0" value="${state.profile.budget}"></div><div class="field"><div class="field-label">기본 귀가시간</div><input id="pfReturn" class="input" type="time" value="${state.profile.returnTime}"></div><button class="primary" onclick="saveProfile()">저장</button></div>`
function daysTogether(){const a=new Date(state.profile.coupleStart+'T00:00:00'),b=new Date();return Math.max(1,Math.floor((b-a)/86400000)+1)}
function recordHTML(r){return `<button class="record" style="width:100%;border:0;text-align:left" onclick="navigate('record',{id:'${r.id}'})"><b>${esc(r.date.slice(5).replace('-','.'))} · ${esc(r.title)}</b><p>${money(r.cost)} · ${r.hours}시간 · 만족도 ${r.rating}</p><div class="record-meta">${r.places.map(x=>`<span>${esc(x)}</span>`).join('')}</div></button>`}
function postHTML(p){return `<button class="post-card" style="width:calc(100% - 36px);border:0;text-align:left" onclick="navigate('post',{id:'${p.id}'})"><div class="badge-row"><span class="c-badge">${esc(p.badge)}</span><span class="c-badge">${esc(p.region)}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><div class="post-foot"><span>공감 ${p.likes}</span><span>댓글 ${p.comments.length}</span></div></button>`}
function transportLabel(v){return {public:'대중교통',taxi:'택시',car:'자차',walk:'도보',auto:'자동 선택'}[v]||v}
function setPlanOpt(key,val,el){state.planner[key]=val;save();const parent=el.parentElement;parent.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
function openHomeSetup(type){const app=document.getElementById('app');const a=type==='area';app.insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>${a?'어디에서 만나요?':'몇 시에 만나요?'}</h3><p>${a?'지역만 바꾸면 홈에서 바로 코스를 만들 수 있어요.':'오늘 만나는 시간만 빠르게 바꿔요.'}</p>${a?['성수','건대','강남'].map(x=>`<button class="sheet-option ${state.planner.area===x?'on':''}" onclick="state.planner.area='${x}';save();document.querySelector('.sheet-wrap').remove();render()"><div><b>${x}</b><span>${AREA[x].region} 기준</span></div><div>›</div></button>`).join(''):['17:30','18:30','19:30','20:30'].map(x=>`<button class="sheet-option ${state.planner.time===x?'on':''}" onclick="state.planner.time='${x}';save();document.querySelector('.sheet-wrap').remove();render()"><div><b>${x}</b><span>오늘</span></div><div>›</div></button>`).join('')}</div></div>`)}
function quickGenerate(mode){state.planner.date=today();if(mode==='now3'){state.planner.time=nowHM();state.planner.duration=3;state.planner.energy='easy'}else if(mode==='tonight'){state.planner.time='18:30';state.planner.duration=4;state.planner.energy='easy'}else{state.planner.duration=5}save();generatePlans();navigate('results')}
function generateFromPlanner(){const d=document.getElementById('planDate').value,t=document.getElementById('planTime').value,a=document.getElementById('planArea').value,ret=document.getElementById('returnTime');if(!d||!t||!a){toast('날짜, 시간, 지역을 확인해주세요.');return}state.planner.date=d;state.planner.time=t;state.planner.area=a;if(ret)state.planner.returnTime=ret.value;save();generatePlans();navigate('results')}
function generatePlans(){const p=state.planner,a=AREA[p.area],pool=a.pool.slice();const variants=[{type:'best',title:`${p.area}에서 천천히, 둘에게 맞게`,reason:'이동을 줄이고 체험·카페·식사를 균형 있게 섞었어요.'},{type:'value',title:`예산은 가볍게, 만족도는 높게`,reason:'무료·저비용 구간을 섞고 이동비도 줄였어요.'},{type:'new',title:`오늘은 평소보다 조금 다르게`,reason:'평소보다 체험 비중을 높이고 새로운 장소를 넣었어요.'}];state.plans=variants.map((v,i)=>buildPlan(v,i,p,pool));state.selectedPlanId=state.plans[0].id;save()}
function buildPlan(v,i,p,pool){let selected;if(v.type==='value')selected=[pool[0],pool[2]||pool[1],pool[4]||pool[3]].filter(Boolean);else if(v.type==='new')selected=[pool[0],pool[5]||pool[2],pool[3]||pool[1],pool[4]||pool[2]].filter(Boolean);else selected=[pool[0],pool[1],pool[3]||pool[2],pool[4]||pool[5]].filter(Boolean);selected=selected.map(x=>({...x}));if(p.duration<=3)selected=selected.slice(0,3);if(p.energy==='easy')selected=selected.slice(0,3);const rebuild=()=>{const ss=[];for(let j=0;j<selected.length-1;j++)ss.push(makeSegment(selected[j],selected[j+1],p.transport,j,p.area));return ss};let segs=rebuild();let total=()=>selected.reduce((a,x)=>a+x.price,0)+segs.reduce((a,x)=>a+x.cost,0);while(total()>p.budget&&selected.length>2){let cut=selected.length-1;if(selected[cut].price===0&&selected.length>2)cut=selected.length-2;selected.splice(cut,1);segs=rebuild()}if(total()>p.budget){const cheap=pool.map(x=>({...x})).sort((a,b)=>a.price-b.price);selected=[cheap[0],cheap.find(x=>x.id!==cheap[0].id)].filter(Boolean);segs=rebuild()}let totalCost=total();let start=hmToMin(p.time),timeline=[],cursor=start;selected.forEach((pl,j)=>{timeline.push({time:minutesToHM(cursor),placeId:pl.id});cursor+=pl.dur;if(segs[j])cursor+=segs[j].durationMin});const travel=segs.reduce((a,x)=>a+x.durationMin,0),hours=(cursor-start)/60;const ret=makeReturn(selected[selected.length-1],p.returnTime,p.area);return {id:'pl_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,5),type:v.type,title:v.title,reason:v.reason,config:{date:p.date||today(),time:p.time,area:p.area,returnTime:p.returnTime,budget:p.budget,energy:p.energy,transport:p.transport},why:[`${p.area} 안에서 이동이 길어지지 않게 구성했어요.`,`2인 ${money(p.budget)} 예산을 기준으로 조합했어요.`,p.energy==='easy'?'오늘은 체류를 길게, 장소 수는 적게 잡았어요.':'식사·활동·휴식을 한쪽에 치우치지 않게 섞었어요.'],cover:selected[1]?.img||selected[0].img,places:selected,segments:segs,timeline,totalCost,travelMin:travel,totalHours:hours,return:ret,returnLeave:ret.leave}}
function makeSegment(from,to,mode,idx=0,area=state.planner.area){let m=mode==='auto'?(idx%3===0?'walk':idx%3===1?'public':'public'):mode;const seed=hash(from.id+to.id),dist=800+(seed%3600);if(m==='walk'&&dist>1800)m='public';if(m==='public'){const bus=seed%2===0;const d=14+(seed%18),cost=3100;return {mode:'public',durationMin:d,cost,distance:dist,summary:`대중교통 ${d}분 · 2인 ${money(cost)}`,steps:[{type:'walk',title:`${AREA[area].station} ${AREA[area].exit}까지 걷기`,to:`${AREA[area].station} ${AREA[area].exit}`,duration:5+(seed%4),address:`${area}역 인근`},bus?{type:'bus',title:`${2016+(seed%3)}번 버스`,line:String(2016+(seed%3)),from:`${area}역 정류장`,to:`${to.name} 인근`,stopId:'04'+String(120+seed%60),duration:9+(seed%7),stops:5+(seed%4),exit:'하차 후 횡단보도 방향',tip:'내리는 문 가까운 쪽 권장'}:{type:'subway',title:'지하철 이동',line:'2',from:AREA[area].station,to:`${to.name.split(' ')[0]} 인근역`,direction:'내선순환 · 신도림 방면',platform:'2번 승강장',duration:10+(seed%8),stops:4+(seed%4),exit:'3번 출구',tip:'빠른 하차 5-2칸'},{type:'walk',title:`출구에서 ${to.name}까지 걷기`,to:to.name,duration:4+(seed%5),address:to.address}]}}
 if(m==='taxi'){const d=10+(seed%12),base=7000+Math.round(dist*1.8);return {mode:'taxi',durationMin:d,cost:base,distance:dist,costLow:base-1000,costHigh:base+2500,traffic:seed%3===0?'약간 혼잡':'보통',summary:`택시 ${d}분 · 약 ${money(base)}`,steps:[]}}
 if(m==='car'){const d=11+(seed%13),fuel=Math.round((dist/1000/state.profile.car.eff)*state.profile.car.fuel),parking=3000+(seed%4)*1000;return {mode:'car',durationMin:d,cost:fuel+parking,distance:dist,fuelCost:fuel,parkingCost:parking,parkingName:`${to.name} 인근 공영주차장`,parkingAddress:to.address,walkAfter:3+(seed%4),spaces:8+(seed%15),summary:`자차 ${d}분 · 유류+주차 ${money(fuel+parking)}`,steps:[]}}
 const d=Math.max(4,Math.round(dist/75));return {mode:'walk',durationMin:d,cost:0,distance:dist,summary:`도보 ${d}분`,steps:[{type:'walk',title:`${to.name}까지 걷기`,to:to.name,duration:d,address:to.address}]}}
function makeReturn(last,returnTime,area){const base=hash(last.id)%12;const me=32+base,partner=38+(base%9);const leave=minutesToHM(hmToMin(returnTime)-Math.max(me,partner)-8);return {leave,me:{duration:me,lastTrain:'여유 31분',arrive:returnTime,summary:`${last.name} → 지하철 → 내 집`,steps:[{type:'walk',title:'가까운 역까지 걷기',detail:'도보 6분 · 430m'},{type:'subway',title:`${AREA[area].station}에서 이동`,detail:'막차 전 여유 31분 · 환승 1회'},{type:'walk',title:'역에서 집까지 걷기',detail:'도보 7분'}]},partner:{duration:partner,lastTrain:'여유 18분',arrive:returnTime,summary:`${last.name} → 버스 → 연인 집`,steps:[{type:'walk',title:'정류장까지 걷기',detail:'도보 5분 · 360m'},{type:'bus',title:'간선버스 이용',detail:'7정거장 · 막차 여유 18분'},{type:'walk',title:'정류장에서 집까지',detail:'도보 8분'}]}}}
function timelineHTML(p){return p.places.map((pl,i)=>`<div class="place-item"><div class="time-col">${p.timeline[i]?.time||''}</div><div class="place-main"><div class="place-photo"><img src="${pl.img}"></div><div class="place-name">${esc(pl.name)}</div><div class="place-address">${esc(pl.address)} · ${pl.cat} · 약 ${money(pl.price)}</div><div class="place-actions"><button class="smallbtn" onclick="copyText('${esc(pl.address)}')">주소 복사</button><button class="smallbtn" onclick="toast('장소 상세 목업을 열었어요')">장소 정보</button></div></div></div>${i<p.segments.length?`<div class="segment"><div class="segment-head"><div><b>${esc(p.segments[i].summary)}</b><span> · 다음 장소까지</span></div><button onclick="changeTransport('${p.id}',${i})">이동 바꾸기</button></div></div>`:''}`).join('')}
function findPlan(id){return state.plans.find(x=>x.id===id)||state.confirmed.map(x=>x.plan).find(x=>x?.id===id)||state.savedCandidates.map(x=>x.plan).find(x=>x?.id===id)}
function openPlan(id){state.selectedPlanId=id;save();navigate('course',{id})}
function saveCandidate(id){const p=findPlan(id);if(!state.savedCandidates.some(x=>x.planId===id))state.savedCandidates.push({planId:id,title:p.title,totalCost:p.totalCost,plan:structuredClone(p)});save();toast('고민 중 코스에 저장했어요')}
function confirmPlan(id){const p=findPlan(id);let c=state.confirmed.find(x=>x.planId===id);if(!c)state.confirmed.push({planId:id,date:p.config?.date||today(),time:p.config?.time||state.planner.time,plan:structuredClone(p),status:'confirmed'});save();render();toast('데이트를 확정했어요')}
function changeTransport(planId,segIndex){const p=findPlan(planId),s=p.segments[segIndex],app=document.getElementById('app');app.insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>이 구간만 바꾸기</h3><p>확정된 코스라면 실제 데이트 시작에도 그대로 반영돼요.</p>${['walk','public','taxi','car'].map(m=>`<button class="sheet-option ${s.mode===m?'on':''}" onclick="applyTransport('${planId}',${segIndex},'${m}')"><div><b>${transportLabel(m)}</b><span>${m==='taxi'?'호출은 외부 택시 앱에서':m==='car'?'주소·주차·내비 연결':'이동시간과 비용 재계산'}</span></div><div>›</div></button>`).join('')}</div></div>`)}
function applyTransport(planId,segIndex,m){let p=findPlan(planId);const ns=makeSegment(p.places[segIndex],p.places[segIndex+1],m,segIndex,p.config?.area||state.planner.area);p.segments[segIndex]=ns;recalcPlan(p);const c=state.confirmed.find(x=>x.planId===planId);if(c)c.plan=structuredClone(p);const sv=state.savedCandidates.find(x=>x.planId===planId);if(sv)sv.plan=structuredClone(p);save();document.querySelector('.sheet-wrap')?.remove();render();toast(`${transportLabel(m)}으로 바꿨어요`)}
function recalcPlan(p){const cfg=p.config||state.planner;p.totalCost=p.places.reduce((a,x)=>a+x.price,0)+p.segments.reduce((a,x)=>a+x.cost,0);p.travelMin=p.segments.reduce((a,x)=>a+x.durationMin,0);let cursor=hmToMin(cfg.time),start=cursor;p.timeline=[];p.places.forEach((pl,i)=>{p.timeline.push({time:minutesToHM(cursor),placeId:pl.id});cursor+=pl.dur;if(p.segments[i])cursor+=p.segments[i].durationMin});p.totalHours=(cursor-start)/60;p.return=makeReturn(p.places.at(-1),cfg.returnTime,cfg.area);p.returnLeave=p.return.leave}
function startLive(planId){const p=findPlan(planId),existing=state.live&&state.live.planId===planId&&state.live.status!=='ended';if(existing){navigate('live');return}state.live={planId,title:p.title,status:'active',stage:'at',placeIndex:0,segmentIndex:0,currentStep:0,startedAt:Date.now(),currentLabel:p.places[0].name};save();navigate('live')}

function liveAt(p,L){const pl=p.places[L.placeIndex],next=p.places[L.placeIndex+1];return `<div class="live-head"><div><div class="live-title">데이트 진행 중</div><div class="live-status">현재 ${esc(pl.name)}</div></div><button class="iconbtn" onclick="liveExitSheet()">${icon('more')}</button></div><div class="progress"><i style="width:${Math.round((L.placeIndex/p.places.length)*100)}%"></i></div><div class="live-card"><div class="live-kicker">지금</div><h2>${esc(pl.name)}</h2><p>현재 일정 · ${esc(pl.cat)}</p><div class="live-bigtime">${pl.dur}분</div><p>추천 체류시간. 실제로 더 오래 있어도 다음 일정이 무너지지 않는지 계속 계산해요.</p>${next?`<div class="next-address"><div class="lab">다음 목적지 주소 · 출발 전에 미리 확인</div><b>${esc(next.name)}</b><p>${esc(next.address)}</p><div class="address-actions"><button onclick="copyText('${esc(next.address)}')">주소 복사</button><button onclick="openMapApp('kakao','${esc(next.address)}')">지도에서 보기</button></div></div>`:''}</div>${next?`<div class="section compact"><button class="primary" onclick="departNext()">다음 장소로 출발</button></div>`:`<div class="section compact"><button class="primary" onclick="finishDate()">데이트 마무리</button></div>`}`}
function liveMoving(p,L,s){const dest=p.places[L.segmentIndex+1];return `<div class="live-head"><div><div class="live-title">${transportLabel(s.mode)} 이동 중</div><div class="live-status">${esc(dest.name)}로 가는 중</div></div><button class="iconbtn" onclick="liveExitSheet()">${icon('more')}</button></div><div class="progress"><i style="width:${Math.round(((L.segmentIndex+.45)/p.places.length)*100)}%"></i></div><div class="live-card"><div class="route-summary"><div><div class="live-kicker">최종 목적지</div><strong>${esc(dest.name)}</strong><em>${esc(dest.address)}</em></div><button class="smallbtn" onclick="copyText('${esc(dest.address)}')">복사</button></div><div class="next-address"><div class="lab">목적지 주소 · 이동 중에도 계속 확인 가능</div><b>${esc(dest.address)}</b><div class="address-actions"><button onclick="copyText('${esc(dest.address)}')">주소 복사</button><button onclick="openMapApp('kakao','${esc(dest.address)}')">지도 앱</button></div></div><div style="margin-top:10px"><div class="route-summary"><strong>${esc(s.summary)}</strong><button class="smallbtn" onclick="changeLiveTransport()">지금 바꾸기</button></div>${segmentStepsHTML(p,L,s)}</div></div><div class="section compact"><button class="primary" onclick="arriveNext()">목적지에 도착했어요</button></div>`}
function segmentStepsHTML(p,L,s){const dest=p.places[L.segmentIndex+1];if(s.mode==='public')return s.steps.map((st,i)=>`<button class="route-step ${i===L.currentStep?'active':''}" style="width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left" onclick="openStep('${p.id}',${L.segmentIndex},${i})"><div class="step-num">${i+1}</div><div><b>${esc(st.title)}</b><p>${st.type==='walk'?`${st.duration}분 · 누르면 실시간 도보 길찾기`:`${st.duration}분 · 가장 빠른 ${st.type==='bus'?'버스':'열차'}와 다음 차량 실시간 보기`}</p></div><div class="chev">›</div></button>`).join('');if(s.mode==='taxi')return `<button class="route-step active" style="width:100%;border:0;background:none;text-align:left" onclick="navigate('taxi',{planId:'${p.id}',segIndex:${L.segmentIndex}})"><div class="step-num">1</div><div><b>택시 호출·경로 상세</b><p>예상요금, 소요시간, 목적지 주소, 외부 호출 앱</p></div><div class="chev">›</div></button>`;if(s.mode==='car')return `<button class="route-step active" style="width:100%;border:0;background:none;text-align:left" onclick="navigate('car',{planId:'${p.id}',segIndex:${L.segmentIndex}})"><div class="step-num">1</div><div><b>자차 길찾기 상세</b><p>목적지 주소, 유류비, 주차, 지도앱 연결</p></div><div class="chev">›</div></button>`;return `<button class="route-step active" style="width:100%;border:0;background:none;text-align:left" onclick="navigate('walkNav',{planId:'${p.id}',segIndex:${L.segmentIndex},stepIndex:0})"><div class="step-num">1</div><div><b>${esc(dest.name)}까지 걷기</b><p>${s.durationMin}분 · 실시간 도보 길찾기</p></div><div class="chev">›</div></button>`}
function departNext(){const p=findPlan(state.live.planId);if(state.live.placeIndex>=p.places.length-1)return;state.live.stage='moving';state.live.segmentIndex=state.live.placeIndex;state.live.currentStep=0;state.live.currentLabel=p.places[state.live.placeIndex+1].name;save();render()}
function arriveNext(){const p=findPlan(state.live.planId);state.live.placeIndex=Math.min(p.places.length-1,state.live.segmentIndex+1);state.live.stage='at';state.live.currentStep=0;state.live.currentLabel=p.places[state.live.placeIndex].name;save();render()}
function changeLiveTransport(){changeTransport(state.live.planId,state.live.segmentIndex)}
function liveExitSheet(){const app=document.getElementById('app');app.insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>데이트를 잠시 나갈까요?</h3><p>잠시 나가면 현재 장소·이동 단계·바꾼 교통수단을 그대로 저장합니다.</p><button class="sheet-option" onclick="pauseLive()"><div><b>잠시 나가기</b><span>홈에서 “이어서 하기”로 복귀</span></div><div>›</div></button><button class="sheet-option" onclick="document.querySelector('.sheet-wrap').remove()"><div><b>계속 진행</b><span>지금 화면 유지</span></div><div>›</div></button><button class="sheet-option" onclick="cancelLive()"><div><b style="color:#b33847">데이트 종료</b><span>진행 기록을 정리하고 종료</span></div><div>›</div></button></div></div>`)}
function pauseLive(){save();switchTab('home');toast('진행 상태를 저장했어요')}
function cancelLive(){state.live.status='ended';save();switchTab('home');toast('데이트 진행을 종료했어요')}

function editQuestion(){state.question.my=null;save();render()}
function chooseBalance(v){if(state.balance.my)return;state.balance.my=v;save();render()}
function addRecord(){const d=document.getElementById('recDate').value,t=document.getElementById('recTitle').value.trim(),c=Math.max(0,Number(document.getElementById('recCost').value)||0),ph=Math.max(0,Number(document.getElementById('recPhotos').value)||0),m=document.getElementById('recMemo').value.trim();if(!d||!t){toast('날짜와 제목을 확인해주세요');return}state.records.unshift({id:'r_'+Date.now(),date:d,title:t,cost:c,hours:4,rating:4.8,photos:ph,places:['직접 기록'],memo:m||'기억하고 싶은 데이트'});save();goBack();toast('기록을 추가했어요')}
function likePost(id){const p=state.posts.find(x=>x.id===id),i=state.likedPosts.indexOf(id);if(i>=0){state.likedPosts.splice(i,1);p.likes=Math.max(0,p.likes-1)}else{state.likedPosts.push(id);p.likes++}save();render()}
function addComment(id){const v=document.getElementById('commentText').value.trim();if(!v)return;state.posts.find(x=>x.id===id).comments.push({who:`${relationship()} · ${state.profile.region}`,text:v});save();render()}
function submitPost(){const t=document.getElementById('postTitle').value.trim(),b=document.getElementById('postBody').value.trim();if(!t||!b){toast('제목과 내용을 적어주세요');return}state.posts.unshift({id:'p_'+Date.now(),cat:document.getElementById('postCat').value,badge:relationship(),region:state.profile.region,title:t,body:b,likes:0,comments:[]});save();switchTab('lounge');toast('라운지에 글을 올렸어요')}
function saveProfile(){state.profile.me=document.getElementById('pfMe').value.trim()||state.profile.me;state.profile.partner=document.getElementById('pfPartner').value.trim()||state.profile.partner;state.profile.coupleStart=document.getElementById('pfStart').value||state.profile.coupleStart;state.profile.homeMe=document.getElementById('pfHomeMe').value.trim()||state.profile.homeMe;state.profile.homePartner=document.getElementById('pfHomePartner').value.trim()||state.profile.homePartner;state.profile.budget=Math.max(0,Number(document.getElementById('pfBudget').value)||state.profile.budget);state.profile.returnTime=document.getElementById('pfReturn').value||state.profile.returnTime;state.planner.budget=state.profile.budget;state.planner.returnTime=state.profile.returnTime;save();goBack();toast('설정을 저장했어요')}
function regenerate(){generatePlans();render();toast('다른 조합으로 다시 골랐어요')}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast('주소를 복사했어요')).catch(()=>toast('복사할 주소: '+t))}
function openMapApp(type,address){const q=encodeURIComponent(address);const urls={kakao:`https://map.kakao.com/?q=${q}`,naver:`https://map.naver.com/v5/search/${q}`,tmap:`https://www.tmap.co.kr/search?searchKeyword=${q}`};window.open(urls[type]||urls.kakao,'_blank')}
function openTaxiApp(type,address){copyText(address);setTimeout(()=>openMapApp('kakao',address),150)}
function mapSVG(kind){return `<svg viewBox="0 0 450 315" preserveAspectRatio="none"><rect width="450" height="315" fill="#ebe7e0"/><g stroke="#d8d2ca" stroke-width="13" fill="none"><path d="M-20 75 C90 20 170 125 280 70 S430 80 480 30"/><path d="M40 330 C70 230 155 235 220 165 S330 65 470 120"/><path d="M-20 210 C80 180 115 250 205 225 S330 170 470 210"/></g><g stroke="#fff" stroke-width="8" fill="none"><path d="M-20 75 C90 20 170 125 280 70 S430 80 480 30"/><path d="M40 330 C70 230 155 235 220 165 S330 65 470 120"/><path d="M-20 210 C80 180 115 250 205 225 S330 170 470 210"/></g><path d="M65 250 C115 205 145 240 205 192 S300 110 370 85" stroke="${kind==='car'?'#4b67c8':'#ff5f73'}" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="10 7"/><circle id="userDot" cx="80" cy="238" r="10" fill="#fff" stroke="#2676ff" stroke-width="5"/><circle cx="370" cy="85" r="11" fill="#171614"/><circle cx="370" cy="85" r="4" fill="#fff"/></svg>`}
function afterRender(route,params){if(route==='walkNav'||route==='returnWalk'){let sec=0;const id=setInterval(()=>{sec++;const dot=document.getElementById('userDot');if(dot){const x=80+Math.min(250,sec*3.5),y=238-Math.min(140,sec*2);dot.setAttribute('cx',x);dot.setAttribute('cy',y)}const remain=Math.max(60,420-sec*6),dist=document.getElementById('walkDist'),wt=document.getElementById('walkTime'),wr=document.getElementById('walkRemain'),ins=document.getElementById('walkInstruction');if(dist)dist.textContent=remain+'m';if(wt)wt.textContent=Math.max(1,Math.ceil(remain/75))+'분';if(wr)wr.textContent=Math.max(1,Math.ceil(remain/75))+'분 남음';if(ins)ins.textContent=sec<12?'80m 직진 후 오른쪽':sec<26?'50m 앞 횡단보도 건너기':'목적지가 오른쪽에 있어요';},1000);timers.push(id)}if(route==='transit'||route==='returnTransit'){let locSec=0;const locId=setInterval(()=>{locSec++;const v=document.getElementById('vehicleLoc');if(v){v.textContent=locSec<20?'현재 2정거장 전 · 이동 중':locSec<40?'현재 1정거장 전 · 곧 진입':'현재 역 접근 중'}} ,1000);timers.push(locId);document.querySelectorAll('[data-countdown]').forEach(el=>{let n=Number(el.dataset.countdown);const tick=()=>{n=Math.max(0,n-1);el.textContent=`${Math.floor(n/60)}분 ${String(n%60).padStart(2,'0')}초`;if(n===0)el.textContent='곧 도착'};const id=setInterval(tick,1000);timers.push(id)})}}
render();
</script>
</body>
</html>
