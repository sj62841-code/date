function v28StayAlertText(rem){if(rem<=0)return '추천 체류시간이 지났어요. 다음 코스로 이동하는 걸 추천해요.';if(rem<=5)return '약 5분 남았어요. 슬슬 정리하고 다음 코스로 이동하면 좋아요.';if(rem<=10)return '약 10분 남았어요. 다음 코스로 이동할 준비를 해도 좋아요.';return ''}
function liveAt(p,L){if(!L.placeArrivedAt){L.placeArrivedAt=Date.now();save()}const pl=p.places[L.placeIndex],next=p.places[L.placeIndex+1],info=v28StayInfo(p,L),photos=(L.photos||[]).filter(x=>x.placeIndex===L.placeIndex);return `<div class="live-head"><div><div class="live-title">데이트 진행 중</div><div class="live-status">현재 ${esc(pl.name)}</div></div><button class="iconbtn" onclick="liveExitSheet()">${icon('more')}</button></div><div class="progress"><i style="width:${Math.round(((L.placeIndex+.2)/p.places.length)*100)}%"></i></div><div class="live-card"><div class="live-kicker">지금 여기</div><h2>${esc(pl.name)}</h2><p>${esc(pl.cat)} · 편하게 즐기다가 시간이 바뀌면 아래에서 조정하세요.</p><div class="v28-stay"><div class="v28-stay-top"><div><div class="v28-stay-label">추천 체류시간</div><div class="v28-stay-time" id="v28StayRemain">${v28FormatRemain(info.remainingSec)}</div><div class="v28-stay-depart" id="v28StayDepart">추천 출발 ${info.departAt} · 기본 ${pl.dur}분${info.autoCut?` · 지연 반영 -${info.autoCut}분`:''}${info.manual?` · 직접 ${info.manual>0?'+':''}${info.manual}분`:''}</div></div></div><div class="v28-stay-progress"><i id="v28StayBar" style="width:${info.pct}%"></i></div><div class="v28-alert ${info.remaining<=10?'show':''}" id="v28StayAlert">${v28StayAlertText(info.remaining)}</div><div class="v28-stay-actions"><button class="v28-soft-btn" onclick="adjustStay(10)">10분 더 있을래요</button><button class="v28-soft-btn" onclick="adjustStay(-10)">10분 일찍 갈래요</button></div>${next?`<button class="v28-next-btn" onclick="departNext()">다음 장소로 출발</button>`:`<button class="v28-next-btn" onclick="finishDate()">데이트 마무리</button>`}</div><div class="v28-memory-box"><div class="v28-memory-head"><b>지금 추억 남기기</b><span>${(L.photos||[]).length}장 저장됨</span></div><button class="v28-photo-btn" onclick="document.getElementById('livePhotoInput').click()">사진 찍기 또는 사진 추가</button><input id="livePhotoInput" type="file" accept="image/*" capture="environment" hidden onchange="handleLivePhoto(event)">${photos.length?`<div class="v28-photo-strip">${photos.slice(-5).map(x=>`<img src="${x.data}" alt="데이트 사진">`).join('')}</div>`:''}</div>${next?`<div class="next-address"><div class="lab">다음 목적지 · 출발 전에 미리 확인</div><b>${esc(next.name)}</b><p>${esc(next.address)}</p><div class="address-actions"><button onclick="copyText('${esc(next.address)}')">주소 복사</button><button onclick="openMapApp('kakao','${esc(next.address)}')">지도에서 보기</button></div></div>`:''}</div>`}
function handleLivePhoto(ev){const file=ev.target.files?.[0];if(!file)return;if(file.size>12*1024*1024){toast('사진이 너무 커요. 12MB 이하 사진을 골라주세요.');return}const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=720,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const data=c.toDataURL('image/jpeg',.68);state.live.photos=state.live.photos||[];if(state.live.photos.length>=10)state.live.photos.shift();state.live.photos.push({id:'ph_'+Date.now(),data,placeIndex:state.live.placeIndex,placeName:state.live.currentLabel,capturedAt:Date.now()});save();render();toast('사진을 오늘 추억에 저장했어요')};img.src=fr.result};fr.readAsDataURL(file)}
routes.live=()=>{const L=state.live;if(!L||L.status==='ended')return `${pagebar('데이트 진행')}<div class="section">진행 중인 데이트가 없어요.</div>`;const p=findPlan(L.planId);if(!p)return '';if(L.stage==='to_first'){if(!L.firstSegment){L.firstSegment=makeFirstSegment(p,p.config?.transport||'auto');save()}return liveMoving(p,L,L.firstSegment)}if(L.stage==='moving')return liveMoving(p,L,p.segments[L.segmentIndex]);return liveAt(p,L)};

finishDate=function(){const p=findPlan(state.live.planId),photos=Array.isArray(state.live.photos)?state.live.photos:[];const rec={id:'r_'+Date.now(),date:p.config?.date||today(),title:p.title,cost:p.totalCost,hours:Number(p.totalHours.toFixed(1)),rating:4.8,photos:photos.length,photoMemories:photos.map(x=>({...x})),places:p.places.map(x=>x.cat),memo:'',messages:{me:'',partner:''}};state.records.unshift(rec);state.v13.lastRecordId=rec.id;state.live.status='ended';save();nav=[{route:'dateWrap',params:{id:rec.id}}];render()};
routes.dateWrap=({id})=>{const r=state.records.find(x=>x.id===id);if(!r)return '';const pics=r.photoMemories||[];return `${pagebar('데이트 마무리')}<div class="wrap-hero"><div class="check">✓</div><h1>오늘도 잘 놀았어요.</h1><div class="section-sub">기록은 자동으로 저장했어요. 마지막으로 서로에게 한마디만 남겨볼까요?</div><div class="wrap-summary"><div class="wrap-stat"><span>함께한 시간</span><b>${r.hours}시간</b></div><div class="wrap-stat"><span>예상 사용</span><b>${money(r.cost)}</b></div><div class="wrap-stat"><span>장소</span><b>${r.places.length}곳</b></div></div>${pics.length?`<div class="planner-row" style="margin-top:20px"><label>오늘 남긴 사진 · ${pics.length}장</label><div class="v28-wrap-photos">${pics.map(x=>`<img src="${x.data}" alt="데이트 추억">`).join('')}</div></div>`:`<div class="locked-note" style="margin-top:18px">오늘은 데이트 중에 사진을 따로 남기지 않았어요. 사진 수를 직접 입력할 필요는 없어요.</div>`}<div class="v28-message-pair"><div class="section-sub">서로에게 하고 싶은 말</div><label>${esc(state.profile.me)} → ${esc(state.profile.partner)}</label><textarea id="wrapMeMsg" class="compose" style="min-height:88px" placeholder="오늘 좋았던 것, 고마웠던 것, 다음에 하고 싶은 말을 남겨보세요.">${esc(r.messages?.me||'')}</textarea><label>${esc(state.profile.partner)} → ${esc(state.profile.me)}</label><textarea id="wrapPartnerMsg" class="compose" style="min-height:88px" placeholder="연인이 직접 적어도 좋아요.">${esc(r.messages?.partner||'')}</textarea></div><button class="primary" style="margin-top:18px" onclick="saveDateWrap('${r.id}')">오늘 데이트 기록 마치기</button><button class="textbtn" style="width:100%;margin-top:7px" onclick="switchTab('home')">나중에 남길게요</button></div>`};
saveDateWrap=function(id){const r=state.records.find(x=>x.id===id);if(!r)return;r.messages={me:document.getElementById('wrapMeMsg')?.value.trim()||'',partner:document.getElementById('wrapPartnerMsg')?.value.trim()||''};if(!r.memo)r.memo=r.messages.me||'오늘 데이트를 함께했어요.';r.photos=(r.photoMemories||[]).length;save();switchTab('home');toast('오늘 기록을 저장했어요')};
routes.record=({id})=>{const r=state.records.find(x=>x.id===id);if(!r)return '';const pics=r.photoMemories||[];return `${pagebar('데이트 기록')}<div class="section compact"><div class="feed-card">${pics[0]?`<img class="memory-img" src="${pics[0].data}">`:`<img class="memory-img" src="${IMG.memory}">`}<div class="feed-pad"><div class="feed-kicker">${esc(r.date)}</div><div class="feed-title">${esc(r.title)}</div><div class="record-meta"><span>${money(r.cost)}</span><span>${r.hours}시간</span><span>만족도 ${r.rating}</span>${pics.length?`<span>사진 ${pics.length}장</span>`:''}</div>${r.memo?`<div class="feed-desc" style="margin-top:13px">${esc(r.memo)}</div>`:''}</div></div>${pics.length?`<div class="v28-wrap-photos" style="margin-top:12px">${pics.map(x=>`<img src="${x.data}">`).join('')}</div>`:''}${r.messages?.me||r.messages?.partner?`<div class="v28-message-pair"><div class="section-title" style="font-size:17px">서로에게 남긴 말</div>${r.messages.me?`<div class="answer-box" style="margin-top:10px"><div class="answer-label">${esc(state.profile.me)} → ${esc(state.profile.partner)}</div><div class="answer-text">${esc(r.messages.me)}</div></div>`:''}${r.messages.partner?`<div class="answer-box" style="margin-top:10px"><div class="answer-label">${esc(state.profile.partner)} → ${esc(state.profile.me)}</div><div class="answer-text">${esc(r.messages.partner)}</div></div>`:''}</div>`:''}<button class="secondary" style="width:100%;margin-top:14px" onclick="navigate('dateWrap',{id:'${r.id}'})">${r.messages?.me||r.messages?.partner?'서로에게 남긴 말 수정':'서로에게 한마디 남기기'}</button><div class="field" style="margin-top:14px"><div class="field-label">그날 방문</div><div class="chips">${r.places.map(x=>`<span class="chip on">${esc(x)}</span>`).join('')}</div></div></div>`};

function v28CalendarEvents(){const confirmed=state.confirmed.map(c=>{const p=findPlan(c.planId);return p?{id:'c_'+c.planId,type:'plan',date:c.date,time:c.time,title:p.title,area:p.config?.area||'',planId:p.id}:null}).filter(Boolean);const manual=state.v28.calendarDates.map(x=>({...x,type:'manual'}));return [...confirmed,...manual]}
function v28MonthShift(delta){let [y,m]=state.v28.calendarMonth.split('-').map(Number);m+=delta;if(m<1){y--;m=12}if(m>12){y++;m=1}state.v28.calendarMonth=`${y}-${String(m).padStart(2,'0')}`;state.v28.selectedDate=`${state.v28.calendarMonth}-01`;save();render()}
function v28SelectDate(date){state.v28.selectedDate=date;save();render()}
function v28CalendarGrid(){const [y,m]=state.v28.calendarMonth.split('-').map(Number),first=new Date(y,m-1,1),start=new Date(y,m-1,1-first.getDay()),events=v28CalendarEvents();let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,same=d.getMonth()===m-1,dayEv=events.filter(e=>e.date===ds),hasPast=dayEv.some(e=>!v28IsFuture(e.date,e.time));html+=`<button class="v28-day ${same?'':'muted'} ${ds===today()?'today':''} ${ds===state.v28.selectedDate?'selected':''}" onclick="v28SelectDate('${ds}')"><span>${d.getDate()}</span><span class="v28-dot-row">${dayEv.slice(0,3).map(()=>`<i class="v28-dot ${hasPast?'past':''}"></i>`).join('')}</span></button>`}return html}
function v28SelectedEventsHTML(){const date=state.v28.selectedDate,ev=v28CalendarEvents().filter(e=>e.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));if(!ev.length)return `<div class="v14-empty">이날 잡힌 데이트가 없어요.<br>아래 ‘일정 추가’로 약속만 먼저 적어둘 수 있어요.</div>`;return ev.map(e=>`<button class="v28-event" onclick="${e.type==='plan'?`navigate('course',{id:'${e.planId}'})`:`openDateEventSheet('${date}','${e.id}')`}"><b>${esc(e.time||'시간 미정')} · ${esc(e.title)}</b><span>${esc(e.area||'지역 미정')}</span><span class="state">${v28IsFuture(e.date,e.time)?'예정':'지난 일정'}</span></button>`).join('')}
function openDateEventSheet(date=state.v28.selectedDate,id=''){const old=state.v28.calendarDates.find(x=>x.id===id),v=old||{title:'우리 데이트',date,time:'18:30',area:state.planner.area,note:''};document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet v22-sheet"><div class="grab"></div><h3>${old?'데이트 일정 수정':'데이트 일정 추가'}</h3><p class="intro">코스를 아직 안 짰어도 약속 날짜부터 캘린더에 적어둘 수 있어요.</p><div class="v28-sheet-field"><label>무슨 약속이에요?</label><input id="v28EventTitle" class="input" value="${esc(v.title)}" placeholder="예: 영화 보고 저녁 먹기"></div><div class="v28-sheet-field"><label>날짜와 시간</label><div class="v22-sheet-row"><input id="v28EventDate" class="input" type="date" value="${v.date}"><input id="v28EventTime" class="input" type="time" value="${v.time}"></div></div><div class="v28-sheet-field"><label>지역</label><input id="v28EventArea" class="input" value="${esc(v.area)}" placeholder="예: 수원 인계동"></div><div class="v28-sheet-field"><label>메모 · 선택</label><textarea id="v28EventNote" class="compose" style="min-height:72px" placeholder="예약 시간, 만나기로 한 곳 등">${esc(v.note||'')}</textarea></div><div class="v22-sheet-actions"><button class="v22-sheet-main" onclick="saveDateEvent('${id}')">${old?'수정 저장':'일정 추가'}</button>${old?`<button class="v22-instant" onclick="deleteDateEvent('${id}')">이 일정 삭제</button>`:''}</div></div></div>`)}
function saveDateEvent(id=''){const title=document.getElementById('v28EventTitle')?.value.trim(),date=document.getElementById('v28EventDate')?.value,time=document.getElementById('v28EventTime')?.value,area=document.getElementById('v28EventArea')?.value.trim(),note=document.getElementById('v28EventNote')?.value.trim();if(!title||!date||!time){toast('약속 이름, 날짜, 시간을 확인해주세요.');return}if(id){const x=state.v28.calendarDates.find(x=>x.id===id);Object.assign(x,{title,date,time,area,note})}else state.v28.calendarDates.push({id:'d_'+Date.now(),title,date,time,area,note});state.v28.selectedDate=date;state.v28.calendarMonth=date.slice(0,7);save();document.querySelector('.sheet-wrap')?.remove();render();toast('데이트 일정을 저장했어요')}

routes.dates=()=>{const live=state.live&&state.live.status!=='ended'?state.live:null,[y,m]=state.v28.calendarMonth.split('-').map(Number),future=v28CalendarEvents().filter(e=>v28IsFuture(e.date,e.time)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4);return `${topHome().replace('모먼트','데이트')}${live?`<div class="v14-live"><small>진행 중</small><h3>${esc(live.title)}</h3><p>${esc(live.currentLabel||'')}</p><button onclick="resumeLive()">이어서 하기</button></div>`:''}<div class="v28-calendar-wrap"><div class="v28-cal-head"><div class="v28-cal-title">${y}년 ${m}월</div><div class="v28-cal-nav"><button onclick="v28MonthShift(-1)">‹</button><button onclick="v28MonthShift(1)">›</button></div></div><div class="v28-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="v28-calendar">${v28CalendarGrid()}</div><div class="v28-calendar-actions"><div><b>${v28FmtDate(state.v28.selectedDate)}</b><div class="v28-help">날짜를 누르면 그날 약속을 바로 확인할 수 있어요.</div></div><button class="v28-add-date" onclick="openDateEventSheet('${state.v28.selectedDate}')">+ 일정 추가</button></div><div class="v28-day-events">${v28SelectedEventsHTML()}</div><div class="v28-upcoming-head"><h2>다가오는 데이트</h2><span>지난 시간의 약속은 여기서 자동으로 빠져요.</span></div>${future.length?future.map(e=>`<button class="v28-event" onclick="${e.type==='plan'?`navigate('course',{id:'${e.planId}'})`:`openDateEventSheet('${e.date}','${e.id}')`}"><b>${v28FmtDate(e.date)} · ${esc(e.time)}</b><span>${esc(e.title)}${e.area?` · ${esc(e.area)}`:''}</span></button>`).join(''):`<div class="v14-empty">앞으로 잡힌 데이트가 없어요.<br>캘린더에서 날짜를 고르고 일정을 추가해보세요.</div>`}<div class="v28-upcoming-head"><h2>코스 고민 중</h2><span>${state.savedCandidates.length}개</span></div>${state.savedCandidates.slice(0,3).map(s=>`<button class="v28-event" onclick="navigate('course',{id:'${s.planId}'})"><b>${esc(s.title)}</b><span>아직 날짜를 확정하지 않은 후보 코스</span></button>`).join('')||'<div class="v14-empty">저장해둔 후보 코스가 없어요.</div>'}</div>`};

function openAnniversarySheet(id=''){const old=state.v28.anniversaries.find(x=>x.id===id),v=old||{name:'',date:today(),yearly:true};document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet v22-sheet"><div class="grab"></div><h3>${old?'기념일 수정':'기념일 추가'}</h3><p class="intro">생일, 처음 여행 간 날처럼 둘만 아는 날도 추가할 수 있어요.</p><div class="v28-sheet-field"><label>기념일 이름</label><input id="v28AnnivName" class="input" value="${esc(v.name)}" placeholder="예: 연인 생일"></div><div class="v28-sheet-field"><label>날짜</label><input id="v28AnnivDate" class="input" type="date" value="${v.date}"></div><div class="v28-sheet-field"><label><input id="v28AnnivYearly" type="checkbox" ${v.yearly?'checked':''}> 매년 반복되는 기념일이에요</label></div><div class="v22-sheet-actions"><button class="v22-sheet-main" onclick="saveAnniversary('${id}')">${old?'수정 저장':'기념일 추가'}</button>${old?`<button class="v22-instant" onclick="deleteAnniversary('${id}')">기념일 삭제</button>`:''}</div></div></div>`)}

function deleteAnniversary(id){state.v28.anniversaries=state.v28.anniversaries.filter(x=>x.id!==id);save();document.querySelector('.sheet-wrap')?.remove();render();toast('기념일을 삭제했어요')}
routes.anniversaries=()=>{const next=v28NextAnniversary(),auto=v28AutoMilestones(6),custom=state.v28.anniversaries.map(v28CustomAnnivNext).sort((a,b)=>a.date.localeCompare(b.date));return `${pagebar('우리 기념일',`<button class="iconbtn" onclick="openAnniversarySheet()">${icon('plus')}</button>`)}<div class="v28-anniv-hero"><div class="eyebrow">${relationship()}</div><h1>우리에게 중요한 날</h1><div class="section-sub">100일·200일·300일은 자동으로 계산하고, 둘만의 기념일은 직접 추가할 수 있어요.</div></div><div class="v28-anniv-next"><small>가장 가까운 기념일</small><h2>${esc(next.name)}</h2><p>${v28FmtDate(next.date)} · ${next.daysLeft===0?'오늘이에요':`D-${next.daysLeft}`}</p></div><div class="v28-anniv-list"><div class="row-between"><div class="section-title" style="font-size:18px">자동으로 계산되는 날</div></div>${auto.map(x=>`<div class="v28-anniv-row"><div><b>${esc(x.name)}</b><span>${v28FmtDate(x.date)}</span></div><em>D-${x.daysLeft}</em></div>`).join('')}<div class="row-between" style="margin-top:30px"><div class="section-title" style="font-size:18px">둘만의 기념일</div><button class="v14-link" onclick="openAnniversarySheet()">+ 추가</button></div>${custom.length?custom.map(x=>`<button class="v28-anniv-row" style="width:100%;border-left:0;border-right:0;border-top:0;background:#fff;text-align:left" onclick="openAnniversarySheet('${x.id}')"><div><b>${esc(x.name)}</b><span>${v28FmtDate(x.date)} · ${x.yearly?'매년 반복':'한 번만'}</span></div><em>${x.daysLeft===0?'오늘':`D-${x.daysLeft}`}</em></button>`).join(''):`<div class="v14-empty">직접 추가한 기념일은 아직 없어요.</div>`}</div>`};

routes.home=()=>{const live=state.live&&state.live.status!=='ended'?state.live:null,trend=state.posts.filter(p=>!state.hiddenPosts.includes(p.id)).sort((x,y)=>y.likes-x.likes).slice(0,2),next=v28NextCalendarEvent(),recent=v14RecordSummary(),ann=v28NextAnniversary();return `${topHome()}${live?`<div class="v14-live"><small>진행 중인 데이트</small><h3>${esc(live.title)}</h3><p>${live.stage==='to_first'?'첫 장소로 이동 중':live.stage==='moving'?'다음 장소로 이동 중':live.stage==='at'?`${esc(live.currentLabel||'')}에서 데이트 중`:'잠시 멈춰 있어요'}</p><button onclick="resumeLive()">이어서 하기</button></div>`:''}<div class="v22-home"><div class="v22-primary-wrap"><button class="v22-primary" onclick="openV22Composer()" aria-label="데이트 코스 짜기"><span class="label">데이트 코스 짜기</span><span class="arrow">›</span></button></div><section class="v14-section"><div class="v14-section-head"><div><div class="v14-section-title">오늘의 우리</div><div class="v14-section-desc">완료하면 다음 놀이가 나오고, 좌우로 직접 넘길 수도 있어요.</div></div><button class="v14-link" onclick="switchTab('us')">우리 탭</button></div>${v28DailyCarousel()}</section><section class="v14-section"><div class="v14-section-head"><div><div class="v14-section-title">다가오는 것</div><div class="v14-section-desc">약속과 기념일을 놓치지 않게.</div></div></div><div class="v14-upcoming">${next?`<button class="v14-up-row" onclick="${next.type==='plan'?`navigate('course',{id:'${next.planId}'})`:`openCalendarDate('${next.date}')`}"><div class="left"><b>다음 데이트</b><span>${v28FmtDate(next.date)} · ${esc(next.time)}</span></div><div class="value">${esc(next.title)} ›</div></button>`:`<button class="v14-up-row" onclick="switchTab('dates')"><div class="left"><b>다음 데이트</b><span>앞으로 잡힌 데이트가 없어요.</span></div><div class="value">캘린더 ›</div></button>`}<button class="v14-up-row" onclick="navigate('anniversaries')"><div class="left"><b>다음 기념일</b><span>${v28FmtDate(ann.date)}</span></div><div class="v28-home-anniv-value">${esc(ann.name)} · ${ann.daysLeft===0?'오늘':`D-${ann.daysLeft}`} ›</div></button><button class="v14-up-row" onclick="navigate('wishlist')"><div class="left"><b>같이 가고 싶은 곳</b><span>다음 추천에서 우선 참고해요.</span></div><div class="value">${state.wishlist.length}곳 ›</div></button></div></section><section class="v14-section"><div class="v14-section-head"><div><div class="v14-section-title">우리의 최근</div><div class="v14-section-desc">지난 데이트를 짧게 다시 봐요.</div></div><button class="v14-link" onclick="navigate('records')">전체 기록</button></div>${recent?`<button style="width:100%;border:0;background:#fff;text-align:left;padding:0" onclick="navigate('record',{id:'${recent.id}'})"><div class="v14-memory"><img src="${recent.photoMemories?.[0]?.data||IMG.memory}"><div><b>${esc(recent.title)}</b><p>${esc(recent.date)} · ${money(recent.cost)}${recent.photos?` · 사진 ${recent.photos}장`:''}<br>${esc(recent.memo||'')}</p></div></div></button>`:`<div class="v14-empty">아직 기록이 없어요. 데이트를 마치면 여기에 쌓여요.</div>`}</section>${trend.length?`<section class="v14-section" style="padding-bottom:54px"><div class="v14-section-head"><div><div class="v14-section-title">요즘 커플들은</div><div class="v14-section-desc">라운지에서 반응이 많은 이야기만 가볍게.</div></div><button class="v14-link" onclick="switchTab('lounge')">라운지</button></div><div class="v14-lounge-lines">${trend.map(p=>`<button class="v14-lounge-row" onclick="navigate('post',{id:'${p.id}'})"><div class="meta">${esc(p.badge)} · ${esc(p.region)}</div><b>${esc(p.title)}</b><div class="stats">공감 ${p.likes} · 댓글 ${p.comments.length}</div></button>`).join('')}</div></section>`:''}</div>`};

routes.us=()=>{const d=daysTogether(),sec=state.v14.usSection;let body='';if(sec==='today'){body=`${v28DailyCarousel()}<div class="v14-us-menu" style="margin-top:24px"><button onclick="navigate('anniversaries')"><div><b>우리 기념일</b><span>100일 단위 자동 계산 · 직접 추가</span></div><div>›</div></button></div>`}else if(sec==='memories'){body=`${state.records.slice(0,4).map(r=>`<button class="v14-list-row" onclick="navigate('record',{id:'${r.id}'})"><b>${esc(r.title)}</b><span>${esc(r.date)}${r.photos?` · 사진 ${r.photos}장`:''} · ${money(r.cost)}</span></button>`).join('')||'<div class="v14-empty">기록이 아직 없어요.</div>'}<button class="v14-link" style="margin-top:14px" onclick="navigate('records')">전체 기록 보기</button>`}else if(sec==='plans'){body=`<div class="v14-us-menu"><button onclick="navigate('anniversaries')"><div><b>우리 기념일</b><span>${v14NextMilestone()}</span></div><div>›</div></button><button onclick="navigate('wishlist')"><div><b>같이 가고 싶은 곳</b><span>${state.wishlist.length}곳 저장됨</span></div><div>›</div></button><button onclick="switchTab('dates')"><div><b>데이트 캘린더</b><span>약속 날짜를 직접 추가하고 확인해요.</span></div><div>›</div></button></div>`}else{body=`<div class="v14-us-menu"><button onclick="navigate('taste')"><div><b>선호하는 분위기</b><span>10초 선택에서 계속 학습해요.</span></div><div>›</div></button><button onclick="navigate('balance')"><div><b>둘의 선택 패턴</b><span>오늘의 밸런스 결과를 모아봐요.</span></div><div>›</div></button><button onclick="navigate('question')"><div><b>우리의 답변</b><span>질문에 남긴 대화를 다시 봐요.</span></div><div>›</div></button></div>`}return `${topHome().replace('모먼트','우리')}<div class="v14-us-hero"><div class="eyebrow">우리의 시간</div><h1>${relationship()}</h1><p>D+${d} · 기록 ${state.records.length}개 · 저장한 곳 ${state.wishlist.length}곳</p></div><div class="v14-tabs"><button class="v14-tab ${sec==='today'?'on':''}" onclick="setV14UsSection('today')">오늘</button><button class="v14-tab ${sec==='memories'?'on':''}" onclick="setV14UsSection('memories')">추억</button><button class="v14-tab ${sec==='plans'?'on':''}" onclick="setV14UsSection('plans')">계획</button><button class="v14-tab ${sec==='taste'?'on':''}" onclick="setV14UsSection('taste')">취향</button></div><div class="v14-panel">${body}</div>`};

const v27AfterRender=afterRender;
afterRender=function(route,params){v27AfterRender(route,params);if(route==='live'&&state.live?.stage==='at'){const update=()=>{const p=findPlan(state.live.planId);if(!p||state.live.stage!=='at')return;const info=v28StayInfo(p,state.live),remain=document.getElementById('v28StayRemain'),dep=document.getElementById('v28StayDepart'),bar=document.getElementById('v28StayBar'),alert=document.getElementById('v28StayAlert');if(remain)remain.textContent=v28FormatRemain(info.remainingSec);if(dep)dep.textContent=`추천 출발 ${info.departAt} · 기본 ${info.pl.dur}분${info.autoCut?` · 지연 반영 -${info.autoCut}분`:''}${info.manual?` · 직접 ${info.manual>0?'+':''}${info.manual}분`:''}`;if(bar)bar.style.width=info.pct+'%';if(alert){const txt=v28StayAlertText(info.remaining);alert.textContent=txt;alert.classList.toggle('show',!!txt)}const key=String(state.live.placeIndex),alerts=state.live.stayAlerts||(state.live.stayAlerts={});if(info.remaining<=10&&!alerts[key+':10']){alerts[key+':10']=true;save();toast('약 10분 남았어요. 다음 코스로 이동 준비를 해도 좋아요.')}if(info.remaining<=5&&!alerts[key+':5']){alerts[key+':5']=true;save();toast('약 5분 남았어요. 슬슬 다음 장소로 이동하면 좋아요.')}};update();const id=setInterval(update,1000);timers.push(id)}document.querySelectorAll('[data-daily-carousel]').forEach(el=>{let sx=0;el.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX},{passive:true});el.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)v28MoveDaily(dx<0?1:-1)},{passive:true})})};




/* v28.1 usability audit fixes */
function v28NormalizeDailyIndex(){state.v28.dailyIndex=Math.max(0,Math.min(2,Number(state.v28.dailyIndex)||0));return state.v28.dailyIndex}
function v28StayInfo(p,L){const pl=p.places[L.placeIndex],key=String(L.placeIndex),adj=Number(L.stayAdjustments?.[key]||0),total=Math.max(10,pl.dur+adj),arrived=L.placeArrivedAt||Date.now(),elapsedSec=Math.max(0,Math.floor((Date.now()-arrived)/1000)),totalSec=total*60,remainingSec=totalSec-elapsedSec,remaining=Math.ceil(remainingSec/60),departAt=minutesToHM(hmToMin(nowHM())+Math.max(0,Math.ceil(remainingSec/60)));return {pl,total,elapsedSec,totalSec,remainingSec,remaining,departAt,pct:Math.max(0,Math.min(100,remainingSec/totalSec*100))}}
function v28FormatRemain(sec){if(sec<=0)return '이동 추천';const m=Math.floor(sec/60),s=Math.max(0,sec%60);return m>0?`${m}분 ${String(s).padStart(2,'0')}초 남음`:`${s}초 남음`}
routes.addRecord=()=>`${pagebar('기록 추가')}<div class="section compact"><div class="field"><div class="field-label">날짜</div><input id="recDate" class="input" type="date" value="${today()}"></div><div class="field"><div class="field-label">제목</div><input id="recTitle" class="input" placeholder="예: 동네에서 영화 보고 산책"></div><div class="field"><div class="field-label">실제 사용금액</div><input id="recCost" class="input" type="number" min="0" value="80000"></div><div class="field"><div class="field-label">기억하고 싶은 말</div><textarea id="recMemo" class="compose" style="min-height:95px" placeholder="오늘 좋았던 점이나 기억하고 싶은 일을 적어보세요."></textarea></div><div class="v28-help">사진은 숫자를 직접 적지 않아요. 데이트 진행 중 ‘사진 찍기 또는 사진 추가’로 남긴 사진만 자동 기록돼요.</div><button class="primary" style="margin-top:14px" onclick="addRecord()">기록 저장</button></div>`;
addRecord=function(){const d=document.getElementById('recDate')?.value,t=document.getElementById('recTitle')?.value.trim(),c=Math.max(0,Number(document.getElementById('recCost')?.value)||0),m=document.getElementById('recMemo')?.value.trim();if(!d||!t){toast('날짜와 제목을 확인해주세요');return}state.records.unshift({id:'r_'+Date.now(),date:d,title:t,cost:c,hours:4,rating:4.8,photos:0,photoMemories:[],places:['직접 기록'],memo:m||'기억하고 싶은 데이트',messages:{me:'',partner:''}});save();goBack();toast('기록을 추가했어요')};
routes.month=()=>{const key=monthKey(),rec=state.records.filter(r=>r.date.startsWith(key)),total=rec.reduce((a,r)=>a+r.cost,0),hrs=rec.reduce((a,r)=>a+r.hours,0),photos=rec.reduce((a,r)=>a+(r.photoMemories?.length||0),0),rating=rec.length?(rec.reduce((a,r)=>a+r.rating,0)/rec.length).toFixed(1):'-';return `${pagebar(`${monthLabel()} 기록`,`<button class="iconbtn" onclick="navigate('addRecord')">${icon('plus')}</button>`)}<div class="section compact"><div class="month-hero"><div class="eyebrow">${monthLabel()}의 우리</div><h1 style="font-size:28px;margin:4px 0 0">${rec.length?`${rec.length}번 만나 ${Math.round(hrs)}시간 함께`:'이번 달 첫 기록을 남겨보세요'}</h1><div class="month-grid"><div class="month-stat"><span>총 사용</span><b>${money(total)}</b></div><div class="month-stat"><span>평균 만족도</span><b>${rating}</b></div><div class="month-stat"><span>남긴 추억 사진</span><b>${photos}장</b></div><div class="month-stat"><span>평균 데이트</span><b>${rec.length?(hrs/rec.length).toFixed(1):0}h</b></div></div></div></div><div class="section compact"><div class="row-between"><h2 class="section-title">날짜별 기록</h2><button class="textbtn" onclick="navigate('addRecord')">+ 기록</button></div>${rec.length?rec.map(r=>recordHTML(r)).join(''):`<div class="section-sub" style="margin-top:12px">데이트를 마치면 자동으로 기록되고, 직접 추가할 수도 있어요.</div>`}</div>`};
state.records.forEach(r=>{if(!Array.isArray(r.photoMemories)||!r.photoMemories.length)r.photos=0;else r.photos=r.photoMemories.length});save();



/* v28.2 schedule-aware stay + next calendar event */
function v28PlannedArrivalOffset(p,L){let mins=Number(L.firstSegment?.durationMin||0);for(let i=0;i<L.placeIndex;i++){mins+=Number(p.places[i]?.dur||0);mins+=Number(p.segments[i]?.durationMin||0)}return mins}
function v28StayInfo(p,L){const pl=p.places[L.placeIndex],key=String(L.placeIndex),manual=Number(L.stayAdjustments?.[key]||0),plannedArrival=v28PlannedArrivalOffset(p,L),actualArrival=Math.max(0,Math.floor(((L.placeArrivedAt||Date.now())-L.startedAt)/60000)),late=Math.max(0,actualArrival-plannedArrival),autoBase=Math.max(15,pl.dur-late),total=Math.max(10,autoBase+manual),arrived=L.placeArrivedAt||Date.now(),elapsedSec=Math.max(0,Math.floor((Date.now()-arrived)/1000)),totalSec=total*60,remainingSec=totalSec-elapsedSec,remaining=Math.ceil(remainingSec/60),departAt=minutesToHM(hmToMin(nowHM())+Math.max(0,Math.ceil(remainingSec/60)));return {pl,total,elapsedSec,totalSec,remainingSec,remaining,departAt,pct:Math.max(0,Math.min(100,remainingSec/totalSec*100)),late,autoCut:Math.max(0,pl.dur-autoBase),manual}}
function v28NextCalendarEvent(){return v28CalendarEvents().filter(e=>v28IsFuture(e.date,e.time)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0]||null}



/* v28.3 small usability follow-ups */
function openCalendarDate(date){state.v28.selectedDate=date;state.v28.calendarMonth=date.slice(0,7);save();switchTab('dates')}

ensureNationwideArea(state.planner.area);

if(!state.v13.onboarded)nav=[{route:'onboarding',params:{}}];
render();
</script>
