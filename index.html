function makeTaxi(from,to,d){const wait=3,ride=Math.max(6,Math.round(d*3.1)),fare=Math.round((4800+Math.max(0,d-1.6)*1100)/100)*100;return {id:uid('seg'),from:from.name,to:to.name,mode:'택시',duration:wait+ride+1,cost:fare,costType:'shared',distance:d,steps:[{kind:'walk',title:'픽업 지점으로 이동',text:`${from.name} 정문 앞 큰길 · 약 90m`,etaText:'1분'},{kind:'taxi',title:'택시 도착 예정',text:`현재 주변 차량 3대 · 예상요금 ${formatWon(fare)}`,etaAt:Date.now()+165000,frequency:0},{kind:'car',title:`${to.name}까지 이동`,text:`${d.toFixed(1)}km · ${ride}분 · 현재 교통 보통`,etaText:`약 ${ride}분`}]} }
function carLocationBefore(plan,index,includeOutbound=false){let node=meetingNode(LOCATIONS[plan.locationKey]);const seq=[...plan.outbound,...plan.segments];const upto=includeOutbound?index:plan.outbound.length+index;for(let i=0;i<upto;i++){const s=seq[i];if(s&&s.mode==='자차')node={name:s.to,id:s.to}}return node}
function makeCar(from,to,d,recovery=null){const eff=Math.max(5,Number(state.settings.efficiency)||13),fuelP=Math.max(1000,Number(state.settings.fuel)||1650),fuel=Math.round((d/eff*fuelP)/10)*10,parking=Math.max(2000,Math.round((2500+d*250)/500)*500),drive=Math.max(7,Math.round(d*2.7));const steps=[];let recoveryMin=0;if(recovery&&recovery.name!==from.name){recoveryMin=Math.max(6,Math.round(d*1.6));steps.push({kind:'subway',title:`주차한 차량이 ${recovery.name}에 있어요`,text:`현재 위치에서 차량까지 먼저 이동 · ${recoveryMin}분`,etaText:`${recoveryMin}분`})}steps.push({kind:'car',title:`${to.name}까지 자차 이동`,text:`${d.toFixed(1)}km · 유류비 ${formatWon(fuel)} · 통행료 0원`,etaText:`약 ${drive}분`});steps.push({kind:'pin',title:`${to.name} 인근 제휴 주차장`,text:`예상 주차 ${formatWon(parking)} · B2 여유 · 목적지까지 210m`,etaText:'도보 3분'});return {id:uid('seg'),from:from.name,to:to.name,mode:'자차',duration:recoveryMin+drive+3,cost:fuel+parking,costType:'shared',distance:d,steps}}
function chooseMode(d,index,variant){const pref=state.planner.transportPref;if(pref==='자차')return '자차';if(pref==='택시 위주')return d>.6?'택시':'도보';if(pref==='대중교통')return d<.75?'도보':'대중교통';if(d<.7)return '도보';if(variant==='value')return '대중교통';if(variant==='fresh'&&index%2)return '택시';return index%3===1?'대중교통':'택시'}

function fitToBudget(plan,variant){let guard=0;while(planCost(plan)>state.planner.budget&&guard++<16){const expensive=[...plan.stops].sort((a,b)=>b.cost-a.cost)[0];if(!expensive||expensive.cost===0)break;const L=LOCATIONS[plan.locationKey],used=new Set(plan.stops.map(x=>x.id)),sameCat=L.pool.filter(x=>x.cat===expensive.cat&&x.cost<expensive.cost&&!used.has(x.id)).sort((a,b)=>a.cost-b.cost),anyCheap=L.pool.filter(x=>x.cost<expensive.cost&&!used.has(x.id)).sort((a,b)=>a.cost-b.cost);const alt=sameCat[0]||anyCheap[0];if(alt){const idx=plan.stops.findIndex(x=>x.planStopId===expensive.planStopId);plan.stops[idx]={...clone(alt),planStopId:expensive.planStopId}}else if(plan.stops.length>2){plan.stops.splice(plan.stops.indexOf(expensive),1)}else break;rebuildSegments(plan,variant)}return plan}
function fillDuration(plan,variant){const target=plan.meta?.durationMin||durationTarget(),L=LOCATIONS[plan.locationKey];let guard=0;while(totalDuration(plan)<target-35&&guard++<5){const used=new Set(plan.stops.map(x=>x.id));const candidates=L.pool.filter(x=>!used.has(x.id)&&(!state.planner.weather.includes('비')||!x.outdoor)).sort((a,b)=>a.cost-b.cost);let added=false;for(const c of candidates){const backup=clone({stops:plan.stops,outbound:plan.outbound,segments:plan.segments});plan.stops.push({...clone(c),planStopId:uid('stop')});rebuildSegments(plan,variant,true);if(planCost(plan)<=plan.meta.budget&&totalDuration(plan)<=target+20&&returnSafe(plan)){added=true;break}plan.stops=backup.stops;plan.outbound=backup.outbound;plan.segments=backup.segments}if(!added)break}let remaining=Math.max(0,target-totalDuration(plan));for(const s of plan.stops){if(remaining<=10)break;if(s.fixed)continue;const add=Math.min(20,remaining);s.stay+=add;remaining-=add}return plan}

function reasonsFor(plan,variant){const r=[];if(returnSafe(plan))r.push(`둘 다 귀가 마지노선 전에 도착 · 여유 ${Math.max(0,returnInfo(plan).margin)}분`);else r.push(`귀가 여유가 부족해 마지막 일정을 줄이는 게 좋아요`);if(state.planner.vibes.length)r.push(`${state.planner.vibes.slice(0,2).join('·')} 취향을 우선 반영`);if(state.couple.wish.some(w=>plan.stops.some(s=>s.cat.includes(w.cat))))r.push('둘의 위시리스트와 겹치는 장소를 포함');if(variant==='value')r.push(`2인 총예산 ${formatWon(state.planner.budget)} 안쪽으로 조정`);else if(variant==='fresh')r.push('최근 기록과 겹치지 않는 활동을 더 많이 배치');else r.push(`이동 구간을 ${Math.max(...[...plan.outbound,...plan.segments].map(s=>s.duration))}분 이내로 묶었어요`);return r.slice(0,3)}
function generatePlans(){const variants=['best','value','fresh'];const labels={best:['가장 잘 맞아요','오늘 둘에게 가장 자연스러운 흐름'],value:['가성비','덜 쓰고 오래 머무는 구성'],fresh:['새롭게','평소보다 하나쯤 새로운 선택']};state.plans=variants.map((variant,vi)=>{const L=loc(),p={id:uid('plan'),version:1,variant,locationKey:L.key,meta:{date:state.planner.date,time:state.planner.time,durationMin:state.planner.durationMin,returnBy:state.planner.returnBy,partnerReturnBy:state.settings.partnerReturnBy,meetingMode:state.planner.meetingMode,budget:state.planner.budget},title:`${L.name}에서 ${variant==='value'?'조금 덜 쓰고 오래':'fresh'===variant?'평소보다 새롭게':'천천히 이어지는'} 데이트`,badge:labels[variant][0],subtitle:labels[variant][1],cover:variant==='value'?imgs.cafe:variant==='fresh'?imgs.craft:imgs.hero,stops:choosePlaces(variant),outbound:[],segments:[],why:[],offlineSaved:false,createdAt:Date.now()};rebuildSegments(p,variant);fitToDuration(p,variant);fitToBudget(p,variant);fillDuration(p,variant);p.why=reasonsFor(p,variant);return p});const fits=state.plans.filter(p=>planCost(p)<=state.planner.budget&&returnSafe(p));state.selectedPlanId=(fits[0]||state.plans.sort((a,b)=>planCost(a)-planCost(b))[0]).id;state.viewPlanId=state.selectedPlanId;save();renderResult();show('result')}

function renderHome(){const cp=state.confirmed?.plan;const status=state.confirmed?.status;$('#home').innerHTML=`<div class="topbar"><div class="brand">모먼트 <small>for two</small></div><div class="toolbar"><button class="icon-btn" onclick="notificationsSheet()">${icon('bell')}</button><button class="icon-btn" onclick="profileSheet()">${icon('user')}</button></div></div><div class="home-intro"><span class="eyebrow">데이트를 대신 정리해주는 앱</span><h1>${cp&&status==='confirmed'?'다음 데이트까지,<br>준비는 끝났어요.':'만날 시간만 정하면<br>나머지는 이어서.'}</h1><p>${cp&&status==='confirmed'?`${dateText(cp.meta?.date||state.planner.date)} ${cp.meta?.time||state.planner.time} · ${LOCATIONS[cp.locationKey].name}`:'시간·예산·귀가시간까지 보고 오늘 가능한 코스를 만들어요.'}</p></div><div class="hero" style="background-image:url('${cp?.cover||imgs.hero}')"><div class="hero-top"><span class="glass"><i></i>${cp&&status==='confirmed'?'확정된 데이트':'실시간 데모 모드'}</span><span class="glass">${cp&&status==='confirmed'?LOCATIONS[cp.locationKey].weather:loc().weather}</span></div><div class="hero-copy"><small>${cp&&status==='confirmed'?`${state.confirmed.message}`:`${dateText(state.planner.date)} · ${loc().name}`}</small><h2>${cp&&status==='confirmed'?cp.title:'오늘 코스를 만들어볼까요?'}</h2><p>${cp&&status==='confirmed'?`${cp.stops.length}곳 · ${formatWon(planCost(cp))} · 귀가 여유 ${Math.max(0,returnInfo(cp).margin)}분`:'지역, 시간, 이동수단을 고르면 동선과 비용까지 한 번에 맞춰요.'}</p><div class="hero-actions"><button class="main" onclick="${cp&&status==='confirmed'?'openConfirmed()':'openPlanner()'}">${cp&&status==='confirmed'?'확정 코스 보기':'데이트 만들기'}</button><button class="sub" onclick="quickNow()">${icon('clock')}</button></div></div></div>${state.active?`<div class="section"><div class="card" style="padding:16px;background:#171717;color:#fff"><span class="badge green">진행 중</span><h4 style="margin:9px 0 4px;font-size:16px">데이트를 이어서 볼까요?</h4><p style="font-size:10px;color:#bbb;line-height:1.5;margin:0">${phaseLabel(state.active)} · 진행 상태와 변경한 이동수단이 저장돼 있어요.</p><button class="primary" style="width:100%;margin-top:12px;background:#fff;color:#171717" onclick="renderLive();show('live')">진행 화면 이어가기</button></div></div>`:''}<div class="section"><div class="section-head"><div><h3>빠르게 시작</h3><p>지금 상황만 바꿔도 돼요</p></div></div><div class="quick-row"><button class="quick hot" onclick="quickNow()">지금부터 3시간</button><button class="quick" onclick="quickPreset('value')">7만원 이하</button><button class="quick" onclick="quickPreset('easy')">오늘은 편하게</button><button class="quick" onclick="quickPreset('taxi')">택시 위주</button><button class="quick" onclick="quickPreset('mid')">둘의 중간</button></div></div><div class="section"><div class="section-head"><div><h3>오늘의 10초 취향</h3><p>둘의 선택이 다음 추천 점수에 실제로 반영돼요</p></div></div><div class="card today-card"><div class="today-top"><div><h4>오늘 더 끌리는 건?</h4><p>${state.couple.jointPick?`선택한 취향을 추천에 반영 중이에요.`:'한 번만 골라도 다음 코스가 달라져요.'}</p></div><span class="badge pink">취향 학습</span></div><div class="choice-grid"><button class="choice ${state.couple.jointPick==='activity'?'selected':''}" onclick="jointPick('activity')" style="background-image:url('${imgs.craft}')"><span>새로운 체험</span></button><button class="choice ${state.couple.jointPick==='quiet'?'selected':''}" onclick="jointPick('quiet')" style="background-image:url('${imgs.cafe}')"><span>조용한 공간</span></button></div></div></div>${state.confirmed&&status!=='confirmed'?`<div class="section"><div class="card" style="padding:16px"><div class="today-top"><div><span class="badge ${status==='needs-review'?'pink':'blue'}">${status==='proposed'?'상대 답변 대기':status==='needs-review'?'재확인 필요':'응답 완료'}</span><h4 style="margin:9px 0 4px">${escapeHTML(state.confirmed.plan.title)}</h4><p>${escapeHTML(state.confirmed.message)}</p></div></div><div class="date-actions"><button class="dark" onclick="partnerResponseSheet()">상대 응답 시뮬레이션</button><button class="light" onclick="openConfirmed()">코스 보기</button></div></div></div>`:''}`}
function renderPlanner(){$('#planner').innerHTML=`<div class="pagebar"><div class="pagebar-left"><button class="back" onclick="goBack('home')">${icon('back')}</button><h2>데이트 만들기</h2></div><span class="badge green"><i></i>설정 자동 저장</span></div><div class="planner-intro"><small>필수만 빠르게</small><h1>오늘 상황만 알려주세요.</h1><p>지역을 바꾸면 장소·교통·귀가 계산도 모두 해당 지역으로 바뀌어요.</p></div><div class="form-card"><div class="form-row"><div class="form-icon">${icon('calendar')}</div><div class="form-main"><small>언제</small><b>${dateText(state.planner.date)} · ${state.planner.time}</b></div><button onclick="pickDate()">변경</button></div><div class="form-row"><div class="form-icon">${icon('pin')}</div><div class="form-main"><small>어디서</small><b>${loc().meeting}${state.planner.meetingMode==='중간 지점'?` · A ${loc().myTravel}분 / B ${loc().partnerTravel}분`:''}</b></div><button onclick="pickLocation()">변경</button></div><div class="form-row"><div class="form-icon">${icon('clock')}</div><div class="form-main"><small>얼마나</small><b>${durationLabel(state.planner.durationMin)} · 귀가 ${state.planner.returnBy}</b></div><button onclick="pickDuration()">변경</button></div><div class="form-row"><div class="form-icon">${icon('route')}</div><div class="form-main"><small>기본 이동</small><b>${state.planner.transportPref}</b></div><button onclick="pickTransport()">변경</button></div></div><div class="section"><div class="section-head"><div><h3>오늘 에너지</h3><p>장소 수와 이동량이 달라져요</p></div></div><div class="chips">${['편하게','보통','제대로'].map(x=>`<button class="pill ${state.planner.intensity===x?'on':''}" onclick="setIntensity('${x}')">${x}</button>`).join('')}</div></div><div class="section"><div class="section-head"><div><h3>둘이 쓸 예산</h3><p>교통비도 2인 기준으로 합산해요</p></div></div><div class="budget-row">${[50000,70000,120000,200000].map(v=>`<button class="budget ${state.planner.budget===v?'on':''}" onclick="setBudget(${v})">${v/10000}만원</button>`).join('')}</div></div><div class="section"><div class="section-head"><div><h3>오늘 하고 싶은 것</h3><p>여러 개 골라도 돼요</p></div></div><div class="chips">${['맛집','카페','전시','체험','산책','야경'].map(v=>`<button class="pill ${state.planner.vibes.includes(v)?'on':''}" onclick="toggleVibe('${v}',this)">${v}</button>`).join('')}</div></div><div class="planner-cta"><button class="primary" onclick="generatePlans()">코스 3개 만들기</button></div>`}
function renderResult(){const labels={best:'추천',value:'가성비',fresh:'새롭게'};const p=currentDraft();$('#result').innerHTML=`<div class="pagebar"><div class="pagebar-left"><button class="back" onclick="goBack('planner')">${icon('back')}</button><h2>추천 코스</h2></div><button class="icon-btn" onclick="openPlanner()">${icon('edit')}</button></div><div class="result-head"><small>${dateText(state.planner.date)} · ${loc().name}</small><h1>지금 조건으로 세 가지</h1><p>상세보기만으로는 확정되지 않아요. 후보와 확정을 분리했어요.</p></div><div class="route-tabs">${state.plans.map(x=>`<button class="${p?.id===x.id?'on':''}" onclick="selectPlan('${x.id}')">${labels[x.variant]}</button>`).join('')}</div>${p?planCard(p):'<div class="section">코스를 먼저 만들어주세요.</div>'}`}
function planCard(p){const r=returnInfo(p);return `<div class="plan-card"><div class="plan-cover" style="background-image:url('${p.cover}')"><span class="plan-label badge ${p.variant==='value'?'green':p.variant==='fresh'?'pink':'blue'}">${p.badge}</span><div class="plan-title"><small>${p.subtitle}</small><h2>${p.title}</h2></div></div><div class="plan-body"><div class="plan-metrics"><div class="metric"><small>2인 예상</small><b>${formatWon(planCost(p))}</b></div><div class="metric"><small>전체 시간</small><b>${durationLabel(totalDuration(p))}</b></div><div class="metric"><small>귀가 여유</small><b style="color:${r.margin<0?'#b54450':'inherit'}">${r.margin>=0?`${r.margin}분`:`${Math.abs(r.margin)}분 부족`}</b></div></div><div class="why-list">${p.why.map(x=>`<div class="why"><i>✓</i><span>${x}</span></div>`).join('')}</div><div class="plan-actions"><button class="hold" onclick="holdPlan('${p.id}')">고민 중 보관</button><button class="detail" onclick="openCourse('${p.id}')">상세 보기</button></div></div></div>`}
function renderDates(){const tab=state.dateTab;$('#dates').innerHTML=`<div class="topbar"><div class="brand">데이트</div><button class="icon-btn" onclick="openPlanner()">${icon('plus')}</button></div><div class="segment-tabs">${[['upcoming','예정'],['held','고민 중'],['history','지난 데이트']].map(([k,t])=>`<button class="${tab===k?'on':''}" onclick="setDateTab('${k}')">${t}</button>`).join('')}</div><div id="dateList">${dateListHTML(tab)}</div>`}
function dateListHTML(tab){if(tab==='upcoming'){if(!state.confirmed)return `<div class="section"><div class="card" style="padding:18px"><h3 style="margin:0 0 6px;font-size:16px">확정된 데이트가 없어요</h3><p class="muted" style="font-size:11px;line-height:1.5">추천 코스에서 상대에게 제안하거나 바로 확정할 수 있어요.</p><button class="primary" style="width:100%;margin-top:12px" onclick="openPlanner()">데이트 만들기</button></div></div>`;const c=state.confirmed;return dateCard(c.plan,c.status,c.message,true)}if(tab==='held'){return state.heldPlans.length?state.heldPlans.map(p=>dateCard(p,'held','아직 확정하지 않은 후보',false)).join(''):`<div class="section"><p class="muted">고민 중인 코스가 없어요.</p></div>`}return state.history.length?state.history.map(historyCard).join(''):`<div class="section"><p class="muted">지난 기록이 없어요.</p></div>`}
function dateCard(p,status,msg,isConfirmed){const statusLabel={proposed:'상대 답변 대기','needs-review':'재확인 필요',confirmed:'확정',declined:'다른 코스 요청',held:'후보'}[status]||status;return `<div class="card date-card"><div class="date-card-top"><div><span class="badge ${status==='confirmed'?'green':status==='needs-review'?'pink':status==='proposed'?'blue':'gray'}">${statusLabel}</span><h3>${p.title}</h3><p>${dateText(p.meta?.date||state.planner.date)} ${p.meta?.time||state.planner.time} · ${LOCATIONS[p.locationKey].name}<br>${msg||''}</p></div></div><div class="date-actions"><button class="dark" onclick="openCourse('${p.id}',${isConfirmed})">코스 보기</button>${isConfirmed&&status==='proposed'?`<button class="light" onclick="partnerResponseSheet()">상대 응답</button>`:isConfirmed&&status==='confirmed'?`<button class="light" onclick="startLive('${p.id}')">시작</button>`:`<button class="light" onclick="proposeSheet('${p.id}')">제안</button>`}</div></div>`}
function historyCard(h){return `<div class="record-card" style="margin:10px 18px 0"><img src="${h.img}"><div><small>${monthDay(h.date)} · ${'★'.repeat(h.rating||0)}</small><h4>${escapeHTML(h.title)}</h4><p>${formatWon(h.cost)} · 사진 ${h.photos||0}장 · ${h.location}</p></div></div>`}
function renderCourse(){const p=getPlan(state.viewPlanId);if(!p){goBack('dates');return}const sch=planSchedule(p),returns=locationReturnCards(p);$('#course').innerHTML=`<div class="pagebar"><div class="pagebar-left"><button class="back" onclick="courseBack()">${icon('back')}</button><h2>코스 상세</h2></div><div class="pagebar-actions"><button class="icon-btn" onclick="offlineToggle('${p.id}')">${icon('bookmark')}</button><button class="icon-btn" onclick="courseMoreSheet('${p.id}')">${icon('edit')}</button></div></div><div class="course-summary"><span class="badge ${p.variant==='value'?'green':p.variant==='fresh'?'pink':'blue'}">${p.badge}</span><h1>${p.title}</h1><p>${LOCATIONS[p.locationKey].meeting}에서 만나 첫 장소까지 이동하는 구간부터, 마지막 귀가까지 계산했어요.</p><div class="summary-chips"><span>${formatWon(planCost(p))}</span><span>이동 ${totalMove(p)}분</span><span>${durationLabel(totalDuration(p))}</span><span>v${p.version}</span><span>${p.offlineSaved?'오프라인 저장됨':'온라인'}</span></div></div>${mapHTML(p)}<div class="timeline"><div class="origin-card"><b>${p.meta?.time||state.planner.time} · ${LOCATIONS[p.locationKey].meeting}에서 만남</b><p>${(p.meta?.meetingMode||state.planner.meetingMode)==='중간 지점'?`A ${LOCATIONS[p.locationKey].myTravel}분 / B ${LOCATIONS[p.locationKey].partnerTravel}분 이동으로 균형을 맞췄어요.`:'첫 장소까지 이동시간도 일정에 포함됩니다.'}</p></div>${transportHTML(p,p.outbound[0],'outbound',0,true)}${p.stops.map((s,i)=>`<div class="stop"><div class="stop-main"><img src="${s.img}"><div class="stop-copy"><small>${sch[i].start}–${sch[i].end} · ${s.cat}</small><h3>${s.name}</h3><p>${s.desc}</p><div class="stop-meta"><span>${formatWon(s.cost)}</span><span>${s.stay}분</span><span>${s.reserve}</span></div></div></div></div>${p.segments[i]?transportHTML(p,p.segments[i],'segment',i,true):''}`).join('')}<div class="return-card"><b>마지막 장소에서 각자 귀가</b><p>둘 중 더 촉박한 사람 기준으로 마지막 출발시각을 계산해요.</p><div class="return-grid">${returns.map(x=>`<div class="return-person" style="background:#fff;color:#171717;border:1px solid var(--line)"><small>${x.name} · ${x.home}</small><b>${x.duration}분 · ${x.mode}</b><p>${x.note}<br>늦어도 ${minsToHM(x.latest)} 출발</p></div>`).join('')}</div></div></div>`;$('#courseBottom').innerHTML=`<div class="course-bottom"><button class="save" onclick="proposeSheet('${p.id}')">상대에게 제안</button><button class="start" onclick="startLive('${p.id}')">${state.confirmed?.status==='confirmed'&&state.confirmed.plan.id===p.id?'데이트 시작':'이 코스로 바로 시작'}</button></div>`;startTicker()}
function mapHTML(p){const pts=[{x:10,y:65},...p.stops.map(s=>({x:s.x,y:s.y}))];let roads='';for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx)*180/Math.PI;roads+=`<div class="map-road" style="left:${a.x}%;top:${a.y}%;width:${len}%;transform:rotate(${ang}deg)"></div>`}return `<div class="map-card">${roads}${pts.map((p,i)=>`<div class="map-pin" style="left:calc(${p.x}% - 14px);top:calc(${p.y}% - 24px)"><span>${i===0?'M':i}</span></div>`).join('')}<div class="map-note">만남 → ${p.stops.length}곳 · 총 이동 ${totalMove(p)}분</div></div>`}
function transportHTML(plan,seg,kind,index,editable){return `<div class="transport"><div class="transport-head"><div><b>${kind==='outbound'?'만남 장소 → 첫 장소':`${seg.from} → ${seg.to}`}</b><span>${transportSummary(seg)}</span></div>${editable?`<button onclick="transportSheet('${plan.id}','${kind}',${index})">이동 바꾸기</button>`:''}</div><div class="route-detail">${seg.steps.map(st=>`<div class="route-step"><div class="step-icon">${stepIcon(st.kind)}</div><div><b>${st.title}</b><small>${st.text}</small></div><span class="eta" data-liveeta="1">${etaText(st)}</span></div>`).join('')}</div></div>`}
function renderLive(){const a=state.active;if(!a){goBack('home');return}const p=a.plan,phase=a.phase,idx=a.stopIndex,sch=planSchedule(p);let html=`<div class="live-page"><div class="live-top"><button onclick="exitLive()">${icon('back')}</button><span>${phaseLabel(a)}</span><button onclick="offlineActive()">${icon('bookmark')}</button></div>`;if(phase==='moving'){const seg=a.movingKind==='outbound'?p.outbound[0]:p.segments[a.segmentIndex],to=a.movingKind==='outbound'?p.stops[0]:p.stops[a.segmentIndex+1];html+=`<div class="live-stage" style="background-image:url('${to.img}')"><div class="live-copy"><small>${seg.mode} · ${seg.duration}분 예상</small><h2>${seg.to}로 이동 중</h2><p>이동수단을 바꾸면 시간·비용·다음 일정이 바로 다시 계산돼요.</p></div></div><div class="live-route"><div class="live-route-head"><div><small>현재 이동</small><h3>${transportSummary(seg)}</h3></div><button onclick="liveTransportSheet()">지금 바꾸기</button></div><div class="live-steps">${seg.steps.map((st,k)=>`<div class="live-step"><div class="num">${k+1}</div><div><b>${st.title}</b><span>${st.text}</span></div><div class="eta" data-liveeta="1">${etaText(st)}</div></div>`).join('')}</div></div><div class="live-panel"><div class="live-panel-head"><div><h3>도착 예상 ${addHM(a.phaseBaseTime,seg.duration)}</h3><p>${returnWarningText(p)}</p></div><div class="countdown" data-phasecount="${seg.duration}">${phaseRemainText(seg.duration,a)}</div></div></div><div class="live-actions"><button class="dark" onclick="issueSheet()">상황이 달라졌어요</button><button class="white" onclick="arriveLive()">도착했어요</button></div>`}else if(phase==='staying'){const s=p.stops[idx],remain=phaseRemainText(s.stay,a);html+=`<div class="live-stage" style="background-image:url('${s.img}')"><div class="live-copy"><small>${sch[idx]?.start||state.planner.time} 시작 · ${s.reserve}</small><h2>${s.name}</h2><p>${s.desc}</p></div></div><div class="live-panel"><div class="live-panel-head"><div><h3>${idx===p.stops.length-1?'마지막 일정':'다음 이동 전까지'}</h3><p>${idx===p.stops.length-1?'이후에는 각자 귀가 경로로 이어져요.':`예정 체류 ${s.stay}분 · 최소 ${s.minStay}분은 남겨뒀어요.`}</p></div><div class="countdown" data-phasecount="${s.stay}">${remain}</div></div></div>${returnAlertHTML(p)}<div class="live-actions"><button class="dark" onclick="issueSheet()">상황이 달라졌어요</button><button class="white" onclick="leaveStop()">${idx===p.stops.length-1?'이제 귀가할게요':'다음 장소로 출발'}</button></div>`}else if(phase==='returning'){const cards=locationReturnCards(p);html+=`<div class="live-stage" style="background-image:url('${imgs.night}')"><div class="live-copy"><small>오늘 일정 마무리</small><h2>각자 집까지 안전하게</h2><p>두 사람 귀가시간과 막차를 따로 계산했어요.</p></div></div><div class="live-panel"><h3>귀가 경로</h3><div class="return-grid">${cards.map(x=>`<div class="return-person"><small>${x.name} · ${x.home}</small><b>${x.duration}분</b><p>${x.note}<br>권장 출발 ${minsToHM(x.latest)}</p></div>`).join('')}</div></div><div class="live-actions"><button class="dark" onclick="toast('귀가 경로를 오프라인으로 저장했어요')">경로 저장</button><button class="white" onclick="finishLiveSheet()">데이트 종료</button></div>`}html+=`</div>`;$('#live').innerHTML=html;startTicker()}
function activeElapsedSec(a){return Math.max(0,Math.floor((Date.now()-(a.phaseStartedAt||Date.now()))/1000)+(a.simulatedElapsed||0)*60)}
function phaseRemainText(totalMin,a){const sec=Math.max(0,totalMin*60-activeElapsedSec(a));return `${Math.floor(sec/60)}분 ${pad(sec%60)}초`}
function phaseLabel(a){if(a.phase==='moving')return a.movingKind==='outbound'?'만남 → 첫 장소':`이동 ${a.segmentIndex+1} / ${a.plan.segments.length}`;if(a.phase==='staying')return `일정 ${a.stopIndex+1} / ${a.plan.stops.length}`;return '귀가'}
function returnWarningText(p){const r=returnInfo(p);return r.margin>=0?`현재 계획대로면 귀가 여유 ${r.margin}분`:`현재 계획은 귀가가 ${Math.abs(r.margin)}분 늦어요`}
function returnAlertHTML(p){const r=returnInfo(p);return `<div class="live-alert"><b>${r.margin>=0?'귀가시간 안전':'귀가시간 주의'}</b><p>나 ${minsToHM(r.meLatest)} · 연인 ${minsToHM(r.partnerLatest)}까지 마지막 장소에서 출발 권장. ${r.margin>=0?`현재 ${r.margin}분 여유 있어요.`:'남은 일정을 줄이거나 이동수단을 바꾸는 게 좋아요.'}</p></div>`}
function nextAnnivOccurrence(a){let d=new Date(a.date+'T00:00:00'),now=nowLocal();if(a.repeat==='매년'){d.setFullYear(now.getFullYear());if(d<new Date(dateISO(now)+'T00:00:00'))d.setFullYear(now.getFullYear()+1)}return {date:dateISO(d),name:a.name,type:'manual'}}
function nextRelationshipMilestone(){const start=new Date(state.couple.startDate+'T00:00:00'),now=new Date(dateISO(nowLocal())+'T00:00:00'),days=Math.max(1,Math.floor((now-start)/86400000)+1),next=Math.ceil((days+1)/100)*100,d=new Date(start);d.setDate(d.getDate()+next-1);return {date:dateISO(d),name:`${next}일`,type:'auto'}}
function nextCoupleEvent(){const arr=state.couple.anniversaries.map(nextAnnivOccurrence);arr.push(nextRelationshipMilestone());return arr.sort((a,b)=>a.date.localeCompare(b.date))[0]}
function renderUs(){const days=Math.max(0,Math.floor((new Date(dateISO(nowLocal())+'T00:00:00')-new Date(state.couple.startDate+'T00:00:00'))/86400000)+1),nextAnniv=nextCoupleEvent();const mStats=monthStats();$('#us').innerHTML=`<div class="topbar"><div class="brand">우리</div><div class="toolbar"><button class="icon-btn" onclick="annivSheet()">${icon('calendar')}</button><button class="icon-btn" onclick="wishSheet()">${icon('plus')}</button></div></div><div class="couple-hero"><div class="couple-head"><div class="avatars"><img class="avatar" src="${imgs.couple2}"><img class="avatar" src="${imgs.couple1}"></div><small>${escapeHTML(state.couple.myName)} × ${escapeHTML(state.couple.partnerName)}</small></div><h1>D+${days}</h1><p>${nextAnniv?`다음 기념일 ${dateText(nextAnniv.date)} · ${nextAnniv.name}`:'다가오는 기념일을 추가해보세요.'}</p><div class="mini-cal">${state.couple.anniversaries.slice(0,3).map(a=>`<div><small>${monthDay(a.date)}</small><b>${escapeHTML(a.name).slice(0,6)}</b></div>`).join('')||'<div><small>기념일</small><b>추가하기</b></div>'}</div></div><div class="section"><div class="question-card"><small>오늘의 질문 · 취향에도 반영</small><h3>요즘 둘이 같이 있을 때<br>가장 편한 순간은 언제야?</h3><button onclick="answerSheet()">${state.couple.answer?'내 답 수정하기':'내 답 남기기'}</button>${state.couple.answer?`<p style="font-size:10px;color:var(--sub);line-height:1.5;margin:10px 0 0">나: ${escapeHTML(state.couple.answer)}<br>연인: ${escapeHTML(state.couple.partnerAnswer)}</p>`:''}</div></div><div class="section"><div class="two-grid"><div class="small-card" onclick="balanceSheet()"><small>오늘의 밸런스</small><h4>${state.couple.balance?`${state.couple.balance} 선택`:'맛집 vs 체험'}</h4><p>${state.couple.balance?`연인은 ${state.couple.partnerBalance} 선택`:'둘 다 고르면 공개돼요.'}</p></div><div class="small-card" onclick="memorySheet()"><small>이번 달 기록</small><h4>${mStats.count}회 · ${shortWon(mStats.cost)}</h4><p>평균 만족도 ${mStats.avg||'-'} · 사진 ${mStats.photos}장</p></div></div></div><div class="section"><div class="section-head"><div><h3>가고 싶은 곳</h3><p>${state.couple.wish.length}개 · 추천 점수에 반영</p></div><button class="text-btn" onclick="wishSheet()">추가</button></div><div class="wish-list">${state.couple.wish.map((w,i)=>`<div class="wish"><img src="${[imgs.craft,imgs.park,imgs.night,imgs.cafe][i%4]}"><div><b>${escapeHTML(w.name)}</b><p>${w.cat} · 다음 코스에서 가중치 +22</p></div><button onclick="removeWish('${w.id}')">삭제</button></div>`).join('')}</div></div><div class="section"><div class="section-head"><div><h3>둘의 취향</h3><p>질문·밸런스·데이트 기록이 바뀌면 수치도 달라져요</p></div></div><div class="learning">${prefRow('체험형 데이트',state.couple.prefs.experience)}${prefRow('조용한 공간',state.couple.prefs.quiet)}${prefRow('가성비',state.couple.prefs.value)}${prefRow('긴 이동 허용',state.couple.prefs.travel)}${prefRow('카페 선호',state.couple.prefs.cafe)}</div></div><div class="section"><div class="section-head"><div><h3>최근 데이트</h3><p>기록을 실제 월 통계에 사용해요</p></div></div>${state.history.slice(0,3).map(historyCard).join('')}</div>`}
function prefRow(name,v){return `<div class="learn-row"><span>${name}</span><div class="bar"><i style="width:${Math.max(5,Math.min(100,v))}%"></i></div></div>`}
function monthStats(){const now=nowLocal(),ym=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;const arr=state.history.filter(h=>h.date.startsWith(ym));const cost=arr.reduce((a,h)=>a+h.cost,0),photos=arr.reduce((a,h)=>a+(h.photos||0),0),ratings=arr.filter(h=>Number(h.rating));return {count:arr.length,cost,photos,avg:ratings.length?(ratings.reduce((a,h)=>a+h.rating,0)/ratings.length).toFixed(1):null}}
function renderMy(){$('#my').innerHTML=`<div class="topbar"><div class="brand">마이</div><button class="icon-btn" onclick="profileSheet()">${icon('user')}</button></div><div class="section" style="padding-top:12px"><div class="card" style="padding:17px"><div class="today-top"><div><h4 style="margin:0;font-size:16px">기본 설정</h4><p style="font-size:11px;color:var(--sub);line-height:1.5;margin:5px 0 0">실제 교통 계산이 붙으면 이 값을 그대로 사용해요.</p></div><span class="badge green"><i></i>저장됨</span></div></div></div><div class="settings"><div class="setting" onclick="vehicleSheet()"><b>내 차량</b><span>${escapeHTML(state.settings.vehicle)}</span></div><div class="setting" onclick="homeSheet()"><b>우리 집 / 상대 집</b><span>${escapeHTML(state.settings.myHome)} · ${escapeHTML(state.settings.partnerHome)}</span></div><div class="setting" onclick="monthlySheet()"><b>월 데이트 예산</b><span>${formatWon(state.settings.monthly)}</span></div><div class="setting" onclick="returnSheet()"><b>귀가 마지노선</b><span>나 ${state.settings.myReturnBy} · 연인 ${state.settings.partnerReturnBy}</span></div><div class="setting"><b>오프라인 일정 사본</b><button class="switch ${state.settings.offline?'on':''}" onclick="toggleSetting(event,'offline')"><i></i></button></div><div class="setting"><b>일정·막차 알림</b><button class="switch ${state.settings.notifications?'on':''}" onclick="toggleSetting(event,'notifications')"><i></i></button></div></div><div class="section"><div class="question-card"><small>API 없이 작동하는 완전 목업</small><h3 style="font-size:15px">실시간 값은 목업이지만 일정·상태·비용·이동 계산은 실제로 연결돼요.<br>오프라인은 텍스트 일정 사본을 기기에 저장하는 데모예요.</h3><button onclick="resetApp()">테스트 데이터 초기화</button></div></div>`}
/* navigation helpers */
function openPlanner(){renderPlanner();show('planner')}
function openCourse(id,fromConfirmed=false){state.viewPlanId=id;state.ui.courseFrom=state.tab;save();show('course');renderCourse()}
function openConfirmed(){if(!state.confirmed)return;state.viewPlanId=state.confirmed.plan.id;state.ui.courseFrom=state.tab;save();show('course');renderCourse()}
function courseBack(){const f=state.ui.courseFrom||'dates';if(f==='result'){renderResult();show('result')}else if(f==='home'){renderHome();show('home')}else{renderDates();show('dates')}}
function goBack(fallback){if(history.length>1)history.back();else navTo(fallback)}
function selectPlan(id){state.selectedPlanId=id;state.viewPlanId=id;save();renderResult()}
function setDateTab(t){state.dateTab=t;save();renderDates()}
function quickNow(){const d=roundQuarter(nowLocal());state.planner.date=dateISO(d);state.planner.time=timeHM(d);state.planner.durationMin=180;save();openPlanner();toast('현재 시간 기준 3시간으로 잡았어요')}
function quickPreset(t){if(t==='value')state.planner.budget=70000;if(t==='easy')state.planner.intensity='편하게';if(t==='taxi')state.planner.transportPref='택시 위주';if(t==='mid'){state.planner.meetingMode='중간 지점';state.planner.locationKey='konkuk'}save();openPlanner()}
function jointPick(v){state.couple.jointPick=v;if(v==='activity')state.couple.prefs.experience=Math.min(100,state.couple.prefs.experience+3);if(v==='quiet')state.couple.prefs.quiet=Math.min(100,state.couple.prefs.quiet+3);save();renderHome();toast('다음 추천에 실제로 반영돼요')}
/* planner sheets */
function pickDate(){openSheet('언제 만나요?',`<div class="field"><label>날짜</label><input class="input" type="date" id="dateInput" value="${state.planner.date}"></div><div class="field"><label>만나는 시간</label><input class="input" type="time" id="timeInput" value="${state.planner.time}"></div>`,'저장',()=>{state.planner.date=$('#dateInput').value;state.planner.time=$('#timeInput').value;save();closeSheet();renderPlanner()})}
function pickLocation(){openSheet('어디서 만나요?',`<div class="field"><label>지역</label><select class="input" id="locSelect">${Object.values(LOCATIONS).map(L=>`<option value="${L.key}" ${state.planner.locationKey===L.key?'selected':''}>${L.name}</option>`).join('')}</select></div><div class="option ${state.planner.meetingMode==='지역 지정'?'on':''}" onclick="selectOpt(this)" data-mode="지역 지정"><span class="radio"></span><div><b>선택 지역에서 만나기</b><small>해당 지역 장소와 교통 문구로 모두 바뀝니다.</small></div></div><div class="option ${state.planner.meetingMode==='중간 지점'?'on':''}" onclick="selectOpt(this)" data-mode="중간 지점"><span class="radio"></span><div><b>둘의 중간 지점 자동 계산</b><small>목업에서는 A 37분 / B 40분인 건대입구를 선택합니다.</small></div></div>`,'저장',()=>{const mode=$('.option.on',$('#sheetInner')).dataset.mode;state.planner.meetingMode=mode;state.planner.locationKey=mode==='중간 지점'?'konkuk':$('#locSelect').value;state.planner.weather=loc().weather;save();closeSheet();renderPlanner();toast(mode==='중간 지점'?'이동시간이 비슷한 건대입구로 잡았어요':'지역을 바꿨어요')})}
function pickDuration(){openSheet('데이트 시간',`<div class="field"><label>데이트 길이</label><select class="input" id="durInput"><option value="180" ${state.planner.durationMin===180?'selected':''}>3시간</option><option value="240" ${state.planner.durationMin===240?'selected':''}>4시간</option><option value="420" ${state.planner.durationMin===420?'selected':''}>7시간</option><option value="600" ${state.planner.durationMin===600?'selected':''}>하루 종일</option></select></div><div class="field"><label>기본 귀가 마지노선</label><input class="input" type="time" id="retInput" value="${state.planner.returnBy}"></div>`,'저장',()=>{state.planner.durationMin=Number($('#durInput').value);state.planner.returnBy=$('#retInput').value;save();closeSheet();renderPlanner()})}
function pickTransport(){const modes=['자동 최적화','대중교통','택시 위주','자차'];openSheet('기본 이동 방식',modes.map(m=>`<div class="option ${state.planner.transportPref===m?'on':''}" onclick="selectOpt(this)" data-mode="${m}"><span class="radio"></span><div><b>${m}</b><small>${m==='자동 최적화'?'구간별로 도보·대중교통·택시를 섞어요':m==='대중교통'?'버스·지하철을 우선해요':m==='택시 위주'?'시간을 줄이고 요금을 포함해요':'주차·유류비·차량 위치까지 추적해요'}</small></div></div>`).join(''),'선택',()=>{state.planner.transportPref=$('.option.on',$('#sheetInner')).dataset.mode;save();closeSheet();renderPlanner()})}
function setIntensity(x){state.planner.intensity=x;save();renderPlanner()}function setBudget(v){state.planner.budget=v;save();renderPlanner()}function toggleVibe(v,el){if(state.planner.vibes.includes(v))state.planner.vibes=state.planner.vibes.filter(x=>x!==v);else state.planner.vibes.push(v);save();renderPlanner()}
/* course actions */
function proposeSheet(id){const p=getPlan(id);openSheet('상대에게 제안하기',`<div class="card" style="padding:14px;margin-bottom:12px"><span class="badge blue">v${p.version}</span><h3 style="font-size:17px;margin:8px 0 5px">${p.title}</h3><p style="font-size:10px;color:var(--sub);line-height:1.5;margin:0">${formatWon(planCost(p))} · ${p.stops.length}곳 · ${dateText(p.meta?.date||state.planner.date)} ${p.meta?.time||state.planner.time}</p></div><p style="font-size:11px;color:var(--sub);line-height:1.55">상대는 받은 코스에서 <b>이대로 가자 / 한 곳 수정 / 다른 코스</b> 중 하나로 답할 수 있어요. 아래 버튼은 제안만 보냅니다.</p>`,'이 코스 제안하기',()=>proposePlan(id))}
function partnerResponseSheet(){if(!state.confirmed)return;openSheet('상대 응답 시뮬레이션',`<div class="option" onclick="selectOpt(this)" data-action="accept"><span class="radio"></span><div><b>이대로 가자</b><small>현재 v${state.confirmed.version} 코스를 확정합니다.</small></div></div><div class="option" onclick="selectOpt(this)" data-action="edit"><span class="radio"></span><div><b>한 곳 수정하고 싶어</b><small>재확인 필요 상태로 바뀝니다.</small></div></div><div class="option" onclick="selectOpt(this)" data-action="decline"><span class="radio"></span><div><b>다른 코스 보고 싶어</b><small>확정하지 않고 새 후보를 볼 수 있어요.</small></div></div>`,'응답 반영',()=>{const o=$('.option.on',$('#sheetInner'));if(!o){toast('응답을 하나 골라주세요');return}partnerRespond(o.dataset.action)})}
function courseMoreSheet(id){const p=getPlan(id);openSheet('코스 편집',`<div class="option" onclick="replaceStopSheet('${id}',0)"><span class="radio"></span><div><b>장소 하나 바꾸기</b><small>앞뒤 이동구간도 함께 다시 계산합니다.</small></div></div><div class="option" onclick="closeSheet();optimizePlan(getPlan('${id}'));renderCourse()"><span class="radio"></span><div><b>동선 최적화</b><small>예약 고정 장소는 움직이지 않습니다.</small></div></div>${p._beforeOptimize?`<div class="option" onclick="closeSheet();undoOptimize(getPlan('${id}'))"><span class="radio"></span><div><b>최적화 되돌리기</b><small>바꾸기 전 순서로 복구합니다.</small></div></div>`:''}`,'닫기',closeSheet)}
function replaceStopSheet(id,preIdx=null){const p=getPlan(id);const options=p.stops.map((s,i)=>`<option value="${i}" ${preIdx===i?'selected':''}>${i+1}. ${s.name}</option>`).join('');openSheet('장소 하나 바꾸기',`<div class="field"><label>바꿀 장소</label><select class="input" id="stopIdx">${options}</select></div><div class="field"><label>새 장소</label><select class="input" id="newPlace">${LOCATIONS[p.locationKey].pool.map(x=>`<option value="${x.id}">${x.name} · ${formatWon(x.cost)}</option>`).join('')}</select></div>`,'교체하고 이동 재계산',()=>{const idx=Number($('#stopIdx').value),np=LOCATIONS[p.locationKey].pool.find(x=>x.id===$('#newPlace').value);if(!np)return;replaceStop(p,idx,np);if(state.confirmed?.plan.id===p.id)state.confirmed.plan=clone(p);save();closeSheet();renderCourse();toast('앞뒤 이동시간과 비용까지 다시 계산했어요')})}

function bookingStatusSheet(id){const b=bookingForPlanV10(id);if(!b)return;openSheet('둘 다 확인한 코스',`<div class="card" style="padding:16px"><span class="badge green"><i></i>확정 완료</span><h3 style="font-size:18px;margin:9px 0 5px">${escapeHTML(b.plan.title)}</h3><p style="font-size:11px;color:var(--sub);line-height:1.55;margin:0">${dateText(b.plan.meta.date)} ${b.plan.meta.time} · ${LOCATIONS[b.plan.locationKey].name}<br>${escapeHTML(state.couple.partnerName)}도 이 코스를 확인했어요.</p></div><div class="detail-row"><b>코스 버전</b><span>v${b.plan.version||1}</span></div><div class="detail-row"><b>예상 비용</b><span>${formatWon(planCost(b.plan))}</span></div><div class="detail-row"><b>상태</b><span>수정 시 상대 재확인 필요</span></div>`,'닫기',closeSheet)}
function transportSheet(id,kind,index,fromLive=false){const p=fromLive?state.active.plan:getPlan(id),seg=kind==='outbound'?p.outbound[0]:p.segments[index];const modes=['도보','대중교통','택시','자차'];openSheet('이 구간 이동수단',modes.map(m=>`<div class="option ${seg.mode===m?'on':''}" onclick="selectOpt(this)" data-mode="${m}"><span class="radio"></span><div><b>${m}</b><small>${m==='자차'?'차량이 현재 위치에 없으면 주차 위치까지 회수 경로를 먼저 넣어요.':m==='대중교통'?'역·정류장·실시간 도착 목업까지 다시 생성합니다.':m==='택시'?'픽업 대기와 예상요금을 포함합니다.':'가까운 거리만 추천합니다.'}</small></div></div>`).join(''),'이동수단 변경',()=>{const mode=$('.option.on',$('#sheetInner')).dataset.mode;changeSegmentMode(p,kind,index,mode,!fromLive);if(fromLive){state.active.plan=clone(p);state.active.actualCost=planCost(state.active.plan);state.active.phaseBaseTime=timeHM(nowLocal());state.active.phaseStartedAt=Date.now();state.active.simulatedElapsed=0}else if(state.confirmed?.plan.id===p.id){state.confirmed.plan=clone(p);state.confirmed.status='needs-review';state.confirmed.message='이동수단이 바뀌어 상대 재확인이 필요해요'}save();closeSheet();fromLive?renderLive():renderCourse();toast(`${mode} 기준으로 다시 계산했어요`)})}
function offlineToggle(id){const p=getPlan(id);p.offlineSaved=!p.offlineSaved;if(state.confirmed?.plan.id===id)state.confirmed.plan.offlineSaved=p.offlineSaved;save();renderCourse();toast(p.offlineSaved?'확정 정보와 경로를 오프라인 저장했어요':'오프라인 저장을 해제했어요')}
/* live */
function startLive(id){let p=getPlan(id);if(!p)return;if(!state.confirmed||state.confirmed.plan.id!==id||state.confirmed.status!=='confirmed'){confirmLocally(p);p=state.confirmed.plan}state.active={plan:clone(p),phase:'moving',movingKind:'outbound',segmentIndex:0,stopIndex:0,phaseBaseTime:timeHM(nowLocal()),phaseStartedAt:Date.now(),simulatedElapsed:0,delayMin:0,startedAt:Date.now(),actualCost:planCost(p)};save();renderLive();show('live')}
function arriveLive(){const a=state.active;if(!a)return;if(a.movingKind==='outbound'){a.stopIndex=0}else{a.stopIndex=a.segmentIndex+1}a.phase='staying';a.phaseBaseTime=timeHM(nowLocal());a.phaseStartedAt=Date.now();a.simulatedElapsed=0;save();renderLive()}
function leaveStop(){const a=state.active;if(!a)return;if(a.stopIndex>=a.plan.stops.length-1){a.phase='returning';a.phaseBaseTime=timeHM(nowLocal())}else{a.phase='moving';a.movingKind='segment';a.segmentIndex=a.stopIndex;a.phaseBaseTime=timeHM(nowLocal());a.simulatedElapsed=0}save();renderLive()}

function applyIssue(issue){const a=state.active,p=a.plan;if(issue==='15'||issue==='30'){let need=Number(issue);a.delayMin+=need;for(let i=Math.max(0,a.stopIndex);i<p.stops.length&&need>0;i++){const s=p.stops[i];if(s.fixed)continue;const can=Math.max(0,s.stay-s.minStay),cut=Math.min(can,need);s.stay-=cut;need-=cut}if(need>0){for(let i=p.stops.length-1;i>a.stopIndex&&need>0;i--){if(!p.stops[i].fixed&&p.stops.length>2){need=Math.max(0,need-p.stops[i].stay-(p.segments[i-1]?.duration||0));p.stops.splice(i,1);p.segments.splice(i-1,1)}}}rebuildSegments(p,p.variant,true);toast(`${issue}분 지연을 남은 일정에 반영했어요`)}else if(issue==='wait'){const idx=Math.min(p.stops.length-1,a.phase==='moving'?(a.movingKind==='outbound'?0:a.segmentIndex+1):a.stopIndex);const cur=p.stops[idx],alt=LOCATIONS[p.locationKey].pool.filter(x=>x.cat===cur.cat&&x.id!==cur.id).sort((x,y)=>x.cost-y.cost)[0];if(alt){replaceStop(p,idx,alt,false);toast(`${alt.name}으로 바꿨어요`)}else toast('근처 대체 장소가 없어요')}else if(issue==='rain'){let changed=0;for(let i=a.stopIndex;i<p.stops.length;i++){if(p.stops[i].outdoor){const alt=LOCATIONS[p.locationKey].pool.find(x=>!x.outdoor&&!p.stops.some(s=>s.id===x.id));if(alt){p.stops[i]={...clone(alt),planStopId:p.stops[i].planStopId};changed++}}}rebuildSegments(p,p.variant,true);toast(changed?`야외 ${changed}곳을 실내로 바꿨어요`:'남은 일정은 이미 실내예요')}a.plan=p;a.actualCost=planCost(p);save()}

/* ===== v9 reliability overrides ===== */
const V9_DAY=1440;
function isValidDateISO(v){return /^\d{4}-\d{2}-\d{2}$/.test(v)&&!Number.isNaN(Date.parse(v+'T00:00:00+09:00'))}
function isValidHM(v){if(!/^\d{2}:\d{2}$/.test(v))return false;const [h,m]=v.split(':').map(Number);return h>=0&&h<24&&m>=0&&m<60}
function dateTimeMin(date,hm){if(!isValidDateISO(date)||!isValidHM(hm))return NaN;return Date.parse(`${date}T${hm}:00+09:00`)/60000}
function clockDeadlineMin(date,hm,startMin){let x=dateTimeMin(date,hm);if(!Number.isFinite(x))return NaN;while(x<startMin)x+=V9_DAY;return x}
function serviceTimeMin(date,hm,startMin){let x=dateTimeMin(date,hm);if(!Number.isFinite(x))return NaN;const h=Number(hm.split(':')[0]),startClock=((startMin%V9_DAY)+V9_DAY)%V9_DAY;if(h<5&&startClock>=12*60)x+=V9_DAY;return x}
function clockTextAbs(abs,startAbs){const day=Math.floor(abs/V9_DAY)-Math.floor(startAbs/V9_DAY);return `${day>0?'다음날 ':''}${minsToHM(abs)}`}
function hashText(s=''){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function mockHomeDuration(locationKey,home,person){const L=LOCATIONS[locationKey]||LOCATIONS.seongsu,base=person==='me'?L.returnMe:L.returnPartner;return Math.max(18,base+(hashText(home)%15)-7)}
function ensureV9State(){
 state.version=9;state.upcomingDates=Array.isArray(state.upcomingDates)?state.upcomingDates:[];
 state.couple.answerSignal=state.couple.answerSignal||{quiet:0,cafe:0,experience:0};state.couple.balanceSignal=state.couple.balanceSignal||state.couple.balance||'';state.couple.jointPickSignal=state.couple.jointPickSignal||state.couple.jointPick||'';
 if(state.confirmed&&!state.confirmed.bookingId){state.confirmed.bookingId=uid('booking');if(!state.upcomingDates.some(b=>b.bookingId===state.confirmed.bookingId||b.plan?.id===state.confirmed.plan?.id))state.upcomingDates.push(clone(state.confirmed))}
 for(const h of state.history||[]){if(h.cost<0)h.cost=0;if(h.photos<0)h.photos=0}
 state.settings.myReturnBy=isValidHM(state.settings.myReturnBy)?state.settings.myReturnBy:'23:20';state.settings.partnerReturnBy=isValidHM(state.settings.partnerReturnBy)?state.settings.partnerReturnBy:'23:10';
 if(!isValidDateISO(state.planner.date))state.planner.date=dateISO(nowLocal());if(!isValidHM(state.planner.time))state.planner.time=timeHM(roundQuarter(nowLocal()));if(!isValidHM(state.planner.returnBy))state.planner.returnBy=state.settings.myReturnBy;
 state.planner.weather=(LOCATIONS[state.planner.locationKey]||LOCATIONS.seongsu).weather;

ass="quick-row"><button class="quick hot" onclick="quickNow()">지금부터 3시간</button><button class="quick" onclick="quickPreset('value')">7만원 이하</button><button class="quick" onclick="quickPreset('easy')">오늘은 편하게</button><button class="quick" onclick="quickPreset('taxi')">택시 위주</button><button class="quick" onclick="quickPreset('mid')">둘의 중간</button></div></div><div class="section"><div class="section-head"><div><h3>오늘의 10초 취향</h3><p>선택을 바꿔도 점수가 중복으로 쌓이지 않아요</p></div></div><div class="card today-card"><div class="today-top"><div><h4>오늘 더 끌리는 건?</h4><p>${state.couple.jointPick?'선택한 취향을 추천에 반영 중이에요.':'한 번만 골라도 다음 코스가 달라져요.'}</p></div><span class="badge pink">취향 학습</span></div><div class="choice-grid"><button class="choice ${state.couple.jointPick==='activity'?'selected':''}" onclick="jointPick('activity')" style="background-image:url('${imgs.craft}')"><span>새로운 체험</span></button><button class="choice ${state.couple.jointPick==='quiet'?'selected':''}" onclick="jointPick('quiet')" style="background-image:url('${imgs.cafe}')"><span>조용한 공간</span></button></div></div></div>${state.upcomingDates.filter(x=>['proposed','needs-review'].includes(x.status)).slice(0,2).map(x=>`<div class="section"><div class="card" style="padding:16px"><span class="badge ${x.status==='needs-review'?'pink':'blue'}">${x.status==='proposed'?'상대 답변 대기':'재확인 필요'}</span><h4 style="margin:9px 0 4px">${escapeHTML(x.plan.title)}</h4><p>${escapeHTML(x.message)}</p><div class="date-actions"><button class="dark" onclick="state.confirmed=clone(state.upcomingDates.find(b=>b.bookingId==='${x.bookingId}'));save();partnerResponseSheet()">상대 응답</button><button class="light" onclick="openBooking('${x.bookingId}')">코스 보기</button></div></div></div>`).join('')}`}
function quickPreset(t){if(t==='value')state.planner.budget=70000;if(t==='easy')state.planner.intensity='편하게';if(t==='taxi')state.planner.transportPref='택시 위주';if(t==='mid'){state.planner.meetingMode='중간 지점';state.planner.locationKey='konkuk';state.planner.weather=LOCATIONS.konkuk.weather}save();openPlanner()}
function jointPick(v){const old=state.couple.jointPickSignal||'';if(old===v){state.couple.jointPick=v;save();renderHome();return}if(old==='activity')state.couple.prefs.experience=Math.max(0,state.couple.prefs.experience-3);if(old==='quiet')state.couple.prefs.quiet=Math.max(0,state.couple.prefs.quiet-3);if(v==='activity')state.couple.prefs.experience=Math.min(100,state.couple.prefs.experience+3);if(v==='quiet')state.couple.prefs.quiet=Math.min(100,state.couple.prefs.quiet+3);state.couple.jointPick=v;state.couple.jointPickSignal=v;save();renderHome();toast('다음 추천에 반영했어요')}
function pickDate(){openSheet('언제 만나요?',`<div class="field"><label>날짜</label><input class="input" type="date" id="dateInput" value="${state.planner.date}"></div><div class="field"><label>만나는 시간</label><input class="input" type="time" id="timeInput" value="${state.planner.time}"></div>`,'저장',()=>{const d=$('#dateInput').value,t=$('#timeInput').value;if(!isValidDateISO(d)||!isValidHM(t)){toast('날짜와 시간을 모두 입력해주세요');return}state.planner.date=d;state.planner.time=t;save();closeSheet();renderPlanner()})}
function pickDuration(){openSheet('데이트 시간',`<div class="field"><label>데이트 길이</label><select class="input" id="durInput"><option value="180" ${state.planner.durationMin===180?'selected':''}>3시간</option><option value="240" ${state.planner.durationMin===240?'selected':''}>4시간</option><option value="420" ${state.planner.durationMin===420?'selected':''}>7시간</option><option value="600" ${state.planner.durationMin===600?'selected':''}>하루 종일</option></select></div><div class="field"><label>내 귀가 마지노선</label><input class="input" type="time" id="retInput" value="${state.planner.returnBy}"></div><div class="field"><label>상대 귀가 마지노선</label><input class="input" type="time" id="partnerRetInput" value="${state.settings.partnerReturnBy}"></div>`,'저장',()=>{const ret=$('#retInput').value,prt=$('#partnerRetInput').value;if(!isValidHM(ret)||!isValidHM(prt)){toast('귀가시간을 모두 입력해주세요');return}state.planner.durationMin=Number($('#durInput').value);state.planner.returnBy=ret;state.settings.partnerReturnBy=prt;save();closeSheet();renderPlanner()})}
function replaceStopSheet(id,preIdx=null){const p=getPlan(id);if(!p)return;const options=p.stops.map((s,i)=>`<option value="${i}" ${preIdx===i?'selected':''}>${i+1}. ${s.name}</option>`).join('');const used=new Set(p.stops.map(s=>s.id));const candidates=LOCATIONS[p.locationKey].pool.filter(x=>!used.has(x.id));openSheet('장소 하나 바꾸기',`<div class="field"><label>바꿀 장소</label><select class="input" id="stopIdx">${options}</select></div><div class="field"><label>새 장소</label><select class="input" id="newPlace">${candidates.map(x=>`<option value="${x.id}">${x.name} · ${formatWon(x.cost)}</option>`).join('')}</select></div>${candidates.length?'':'<p class="muted">중복되지 않는 대체 장소가 없어요.</p>'}`,'교체하고 이동 재계산',()=>{const idx=Number($('#stopIdx').value),np=LOCATIONS[p.locationKey].pool.find(x=>x.id===$('#newPlace').value);if(!np){toast('다른 장소를 선택해주세요');return}replaceStop(p,idx,np);normalizePlanV9(p);const b=bookingForPlan(p.id);if(b){b.plan=clone(p);upsertBooking(b);state.confirmed=clone(b)}save();closeSheet();renderCourse();toast('앞뒤 이동시간과 비용까지 다시 계산했어요')})}
function nextAnnivOccurrence(a){const today0=new Date(dateISO(nowLocal())+'T00:00:00+09:00');let d=new Date(a.date+'T00:00:00+09:00');if(a.repeat==='매년'){d=new Date(`${today0.getFullYear()}-${a.date.slice(5)}T00:00:00+09:00`);if(d<today0)d=new Date(`${today0.getFullYear()+1}-${a.date.slice(5)}T00:00:00+09:00`)}else if(d<today0)return null;return {date:dateISO(d),name:a.name,type:'manual'}}
function nextCoupleEvent(){const arr=state.couple.anniversaries.map(nextAnnivOccurrence).filter(Boolean);const rel=nextRelationshipMilestone();if(rel)arr.push(rel);return arr.sort((a,b)=>a.date.localeCompare(b.date))[0]||null}
function signalFromAnswer(v){return {quiet:/조용|쉬|편/.test(v)?2:0,cafe:/카페|커피/.test(v)?2:0,experience:/체험|공방|전시/.test(v)?2:0}}
function answerSheet(){openSheet('오늘의 질문',`<div class="field"><label>내 답</label><textarea class="input" id="answerInput" style="height:100px;padding-top:13px;resize:none" placeholder="편하게 적어주세요">${escapeHTML(state.couple.answer)}</textarea></div><p style="font-size:10px;color:var(--sub);line-height:1.5">답변을 수정하면 이전 답변의 취향 보정치를 먼저 되돌린 뒤 새 답변만 반영해요.</p>`,'답 저장',()=>{const v=$('#answerInput').value.trim(),old=state.couple.answerSignal||{quiet:0,cafe:0,experience:0},nw=signalFromAnswer(v);state.couple.prefs.quiet=Math.max(0,Math.min(100,state.couple.prefs.quiet-old.quiet+nw.quiet));state.couple.prefs.cafe=Math.max(0,Math.min(100,state.couple.prefs.cafe-old.cafe+nw.cafe));state.couple.prefs.experience=Math.max(0,Math.min(100,state.couple.prefs.experience-old.experience+nw.experience));state.couple.answer=v;state.couple.answerSignal=nw;save();closeSheet();renderUs();toast('답변과 취향을 저장했어요')})}
function balanceSheet(){openSheet('오늘의 밸런스',`<div class="option ${state.couple.balance==='맛집'?'on':''}" onclick="selectOpt(this)" data-value="맛집"><span class="radio"></span><div><b>맛집</b><small>먹는 데 예산을 더 쓰기</small></div></div><div class="option ${state.couple.balance==='체험'?'on':''}" onclick="selectOpt(this)" data-value="체험"><span class="radio"></span><div><b>체험</b><small>새로운 걸 같이 해보기</small></div></div>`,'선택',()=>{const o=$('.option.on',$('#sheetInner'));if(!o){toast('하나를 골라주세요');return}const old=state.couple.balanceSignal||'';if(old==='체험')state.couple.prefs.experience=Math.max(0,state.couple.prefs.experience-2);state.couple.balance=o.dataset.value;if(state.couple.balance==='체험')state.couple.prefs.experience=Math.min(100,state.couple.prefs.experience+2);state.couple.balanceSignal=state.couple.balance;save();closeSheet();renderUs();toast(`연인은 ${state.couple.partnerBalance}를 골랐어요`)})}
function historyCard(h){return `<div class="record-card" style="margin:10px 18px 0;cursor:pointer" onclick="historySheet('${h.id}')"><img src="${h.img}"><div><small>${monthDay(h.date)} · ${'★'.repeat(h.rating||0)}</small><h4>${escapeHTML(h.title)}</h4><p>${formatWon(h.cost)} · 사진 ${h.photos||0}장 · ${escapeHTML(h.location)}</p></div></div>`}
function historySheet(id){const h=state.history.find(x=>x.id===id);if(!h)return;const plan=h.planSnapshot;openSheet('지난 데이트',`<div class="card" style="overflow:hidden;margin-bottom:12px"><img src="${h.img}" style="width:100%;height:150px;object-fit:cover"><div style="padding:14px"><small>${h.date} · ${h.rating?`${h.rating}/5`:'평점 없음'}</small><h3 style="margin:6px 0">${escapeHTML(h.title)}</h3><p class="muted">${formatWon(h.cost)} · 사진 ${h.photos||0}장 · ${escapeHTML(h.location)}</p></div></div>${plan?`<div class="field"><label>당시 코스</label><div class="card" style="padding:12px">${plan.stops.map((s,i)=>`<div style="padding:6px 0;border-bottom:${i<plan.stops.length-1?'1px solid var(--line)':'0'}"><b style="font-size:11px">${i+1}. ${s.name}</b><p class="muted" style="margin:3px 0 0;font-size:9px">${s.cat} · ${formatWon(s.cost)}</p></div>`).join('')}</div></div>`:'<p class="muted">직접 추가한 기록이라 상세 코스는 없어요.</p>'}`,'닫기',closeSheet)}
function memorySheet(){openSheet('추억 하나 남기기',`<div class="field"><label>오늘의 한 줄</label><textarea class="input" id="memLine" style="height:90px;padding-top:13px" placeholder="예: 오래 걸었는데 하나도 안 힘들었던 날"></textarea></div><div class="field"><label>날짜</label><input class="input" type="date" id="memDate" value="${dateISO(nowLocal())}"></div><div class="field"><label>사용 금액</label><input class="input" type="number" min="0" id="memCost" value="65000"></div><div class="field"><label>사진 수</label><input class="input" type="number" min="0" id="memPhotos" value="8"></div>`,'기록 추가',()=>{const d=$('#memDate').value,c=Number($('#memCost').value),ph=Number($('#memPhotos').value);if(!isValidDateISO(d)||!Number.isFinite(c)||c<0||!Number.isFinite(ph)||ph<0){toast('날짜·금액·사진 수를 확인해주세요');return}state.history.unshift({id:uid('hist'),title:$('#memLine').value.trim()||'둘이 오래 웃었던 날',date:d,rating:0,cost:Math.round(c),photos:Math.round(ph),location:'직접 기록',img:imgs.hero});save();closeSheet();renderUs();toast('추억을 기록했어요')})}
function homeSheet(){openSheet('집 위치',`<div class="field"><label>내 집</label><input class="input" id="myHome" value="${escapeHTML(state.settings.myHome)}"></div><div class="field"><label>상대 집</label><input class="input" id="partnerHome" value="${escapeHTML(state.settings.partnerHome)}"></div><p class="muted" style="font-size:10px">목업에서는 입력 문자열에 따라 귀가시간이 ±몇 분 달라져 실제 주소 변경 효과를 확인할 수 있어요.</p>`,'저장',()=>{const a=$('#myHome').value.trim(),b=$('#partnerHome').value.trim();if(!a||!b){toast('두 집 위치를 모두 입력해주세요');return}state.settings.myHome=a;state.settings.partnerHome=b;save();closeSheet();renderMy();renderHome();toast('집 위치와 귀가시간 계산을 갱신했어요')})}
function vehicleSheet(){openSheet('내 차량',`<div class="field"><label>차량</label><input class="input" id="vehicleInput" value="${escapeHTML(state.settings.vehicle)}"></div><div class="field"><label>실연비 (km/L)</label><input class="input" type="number" min="1" max="50" step="0.1" id="effInput" value="${state.settings.efficiency}"></div><div class="field"><label>현재 유가 (원/L)</label><input class="input" type="number" min="500" max="5000" id="fuelInput" value="${state.settings.fuel}"></div>`,'저장',()=>{const eff=Number($('#effInput').value),fuel=Number($('#fuelInput').value);if(!Number.isFinite(eff)||eff<1||eff>50||!Number.isFinite(fuel)||fuel<500||fuel>5000){toast('연비와 유가 값을 확인해주세요');return}state.settings.vehicle=$('#vehicleInput').value.trim()||'내 차';state.settings.efficiency=eff;state.settings.fuel=fuel;refreshAllCarCosts();save();closeSheet();renderMy();toast('모든 자차 구간 비용을 다시 계산했어요')})}
function monthlySheet(){openSheet('월 데이트 예산',`<div class="field"><label>2인 총예산</label><input class="input" type="number" min="10000" id="monthlyInput" value="${state.settings.monthly}"></div>`,'저장',()=>{const v=Number($('#monthlyInput').value);if(!Number.isFinite(v)||v<10000){toast('월 예산을 1만원 이상 입력해주세요');return}state.settings.monthly=Math.round(v);save();closeSheet();renderMy()})}
function returnSheet(){openSheet('귀가 마지노선',`<div class="field"><label>내가 집에 도착할 시간</label><input class="input" type="time" id="myRet" value="${state.settings.myReturnBy}"></div><div class="field"><label>상대가 집에 도착할 시간</label><input class="input" type="time" id="ptRet" value="${state.settings.partnerReturnBy}"></div>`,'저장',()=>{const a=$('#myRet').value,b=$('#ptRet').value;if(!isValidHM(a)||!isValidHM(b)){toast('귀가시간을 모두 입력해주세요');return}state.settings.myReturnBy=a;state.settings.partnerReturnBy=b;state.planner.returnBy=a;for(const bk of state.upcomingDates){bk.plan.meta.returnBy=a;bk.plan.meta.partnerReturnBy=b;normalizePlanV9(bk.plan)}save();closeSheet();renderMy();renderHome();toast('두 사람 귀가시간을 다시 계산했어요')})}
function nextRelationshipMilestone(){if(!isValidDateISO(state.couple.startDate))return null;const start=new Date(state.couple.startDate+'T00:00:00+09:00'),now=new Date(dateISO(nowLocal())+'T00:00:00+09:00');if(start>now)return {date:state.couple.startDate,name:'연애 시작일',type:'auto'};const days=Math.max(1,Math.floor((now-start)/86400000)+1),next=Math.ceil((days+1)/100)*100,d=new Date(start);d.setDate(d.getDate()+next-1);return {date:dateISO(d),name:`${next}일`,type:'auto'}}
function profileSheet(){openSheet('프로필',`<div class="field"><label>내 이름</label><input class="input" id="myName" value="${escapeHTML(state.couple.myName)}"></div><div class="field"><label>상대 이름</label><input class="input" id="ptName" value="${escapeHTML(state.couple.partnerName)}"></div><div class="field"><label>연애 시작일</label><input class="input" type="date" id="startDate" value="${state.couple.startDate}"></div>`,'저장',()=>{const d=$('#startDate').value;if(!isValidDateISO(d)){toast('연애 시작일을 확인해주세요');return}state.couple.myName=$('#myName').value.trim()||'나';state.couple.partnerName=$('#ptName').value.trim()||'연인';state.couple.startDate=d;save();closeSheet();renderMy();renderUs();toast('프로필을 저장했어요')})}
function makeCar(from,to,d,recovery=null){const eff=Math.max(5,Number(state.settings.efficiency)||13),fuelP=Math.max(1000,Number(state.settings.fuel)||1650),fuel=Math.round((d/eff*fuelP)/10)*10,parking=Math.max(2000,Math.round((2500+d*250)/500)*500),drive=Math.max(7,Math.round(d*2.7)),steps=[];let recoveryMin=0,recoveryCost=0;if(recovery&&recovery.name!==from.name){const rd=dist(from,recovery);recoveryMin=Math.max(5,Math.round(rd*5.2));recoveryCost=3100;steps.push({kind:'subway',title:`주차한 차량이 ${recovery.name}에 있어요`,text:`현재 위치 → 차량 ${rd.toFixed(1)}km · 대중교통 2인 ${formatWon(recoveryCost)}`,etaText:`${recoveryMin}분`})}steps.push({kind:'car',title:`${to.name}까지 자차 이동`,text:`${d.toFixed(1)}km · 유류비 ${formatWon(fuel)} · 통행료 0원`,etaText:`약 ${drive}분`});steps.push({kind:'pin',title:`${to.name} 인근 주차장`,text:`예상 주차 ${formatWon(parking)} · 목적지까지 210m`,etaText:'도보 3분'});return {id:uid('seg'),from:from.name,to:to.name,mode:'자차',duration:recoveryMin+drive+3,cost:recoveryCost+fuel+parking,costType:'shared',distance:d,steps,recoveryDistance:recovery?dist(from,recovery):0}}

function routeFromHash(){const h=(location.hash||'').replace('#','');const valid=['home','planner','result','dates','course','live','us','my'];let id=valid.includes(h)?h:(state.active?'home':'home');if(id==='course'&&!state.viewPlanId)id='dates';if(id==='live'&&!state.active)id='home';state.ui.navStack=[];renderPage(id);show(id,false)}
function primaryConfirmedBooking(){const list=(state.upcomingDates||[]).filter(b=>b.status==='confirmed').sort((a,b)=>(a.plan.meta?.date||'').localeCompare(b.plan.meta?.date||'')||(a.plan.meta?.time||'').localeCompare(b.plan.meta?.time||''));return list[0]||((state.confirmed?.status==='confirmed')?state.confirmed:null)}
function bookingForPlanV10(id){return (state.upcomingDates||[]).find(b=>b.plan?.id===id)||((state.confirmed?.plan?.id===id)?state.confirmed:null)}
function currentCoursePlan(id){if(state.active?.plan?.id===id)return state.active.plan;const b=bookingForPlanV10(id);if(b)return b.plan;return state.heldPlans.find(p=>p.id===id)||state.plans.find(p=>p.id===id)||getPlan(id)}
function syncCoursePlan(p,reason='코스가 수정됐어요'){if(!p)return;const active=state.active?.plan?.id===p.id;if(active){state.active.plan=clone(p);state.active.actualCost=planCost(state.active.plan)}let b=(state.upcomingDates||[]).find(x=>x.plan?.id===p.id);if(b){b.plan=clone(p);if(!active&&['confirmed','proposed'].includes(b.status)){b.status='needs-review';b.message=reason;b.version=p.version}state.confirmed=clone(b)}else if(state.confirmed?.plan?.id===p.id){state.confirmed.plan=clone(p);if(!active&&['confirmed','proposed'].includes(state.confirmed.status)){state.confirmed.status='needs-review';state.confirmed.message=reason}upsertBooking(state.confirmed)}save()}
function stopAddress(stop,locationKey){const base={seongsu:'서울 성동구 연무장길',konkuk:'서울 광진구 아차산로',gangnam:'서울 강남구 강남대로'}[locationKey]||'서울특별시';const n=(String(stop?.name||'목적지').split('').reduce((a,c)=>a+c.charCodeAt(0),0)%78)+12;return `${base} ${n}`}
function mockLatLng(node,locationKey){const base={seongsu:[37.5446,127.0558],konkuk:[37.5404,127.0692],gangnam:[37.4979,127.0276]}[locationKey]||[37.55,127.04];const x=Number(node?.x||50),y=Number(node?.y||50);return {lat:base[0]+(50-y)*.00022,lng:base[1]+(x-50)*.00024}}
function copyText(t){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>toast('주소를 복사했어요')).catch(()=>fallbackCopy(t));else fallbackCopy(t)}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('주소를 복사했어요')}catch(e){toast(t)}ta.remove()}
function openNavApp(app,name,node,locationKey){const c=mockLatLng(node,locationKey),n=encodeURIComponent(name);let url='';if(app==='naver')url=`nmap://route/car?dlat=${c.lat}&dlng=${c.lng}&dname=${n}&appname=moment.demo`;if(app==='kakao')url=`kakaomap://route?ep=${c.lat},${c.lng}&by=CAR`;if(app==='tmap')url=`tmap://route?goalx=${c.lng}&goaly=${c.lat}&goalname=${n}`;try{location.href=url;setTimeout(()=>{if(document.visibilityState==='visible')window.open(app==='kakao'?`https://map.kakao.com/link/search/${n}`:app==='naver'?`https://map.naver.com/p/search/${n}`:'https://www.tmap.co.kr/','_blank')},700)}catch(e){toast('지도 앱을 열 수 없어요')}}
function stepMinutes(st,seg){const m=(st.etaText||st.text||'').match(/(\d+)분/);if(m)return Math.max(1,Number(m[1]));if(['bus','subway','car','taxi'].includes(st.kind))return Math.max(4,Math.round(seg.duration*.65));return Math.max(2,Math.round(seg.duration/Math.max(1,seg.steps.length)))}
function stepDistanceM(st,seg){const m=String(st.text||'').match(/(\d{2,5})m/);return m?Number(m[1]):Math.round((seg.distance||.4)*1000/Math.max(1,seg.steps.length))}
function segmentAt(plan,kind,index){return kind==='outbound'?plan.outbound[0]:plan.segments[index]}
function openRouteStep(planId,kind,index,stepIndex,scope='course'){state.ui.routeCtx={type:'step',planId,kind,index,stepIndex,scope,openedAt:Date.now()};save();renderRouteDetail();show('routeDetail',true)}
function openReturnDetail(planId,personIndex=0,scope='course'){state.ui.routeCtx={type:'return',planId,personIndex,scope,openedAt:Date.now()};save();renderRouteDetail();show('routeDetail',true)}
function routePlan(){if(state.ui.routeCtx?.scope==='live'&&state.active)return state.active.plan;return currentCoursePlan(state.ui.routeCtx?.planId)}
function routeProgress(){const ctx=state.ui.routeCtx,p=routePlan();if(!ctx||!p)return .28;if(ctx.type==='return')return Math.max(.14,Math.min(.82,(Date.now()-(ctx.openedAt||Date.now()))/240000+.16));const seg=segmentAt(p,ctx.kind,ctx.index),st=seg?.steps?.[ctx.stepIndex];if(!seg||!st)return .2;if(st.kind==='walk'&&ctx.scope==='live'){const stepSec=Math.max(60,stepMinutes(st,seg)*60),elapsed=(Date.now()-(ctx.openedAt||Date.now()))/1000;return Math.max(0,Math.min(.96,elapsed/stepSec))}if(ctx.scope==='live'&&state.active?.phase==='moving'){const elapsed=activeElapsedSec(state.active),total=Math.max(1,(seg?.duration||1)*60);return Math.max(.08,Math.min(.92,elapsed/total))}return Math.max(.12,Math.min(.88,(Date.now()-(ctx.openedAt||Date.now()))/60000/Math.max(2,stepMinutes(st,seg))))}
function mapMarkup(labelA,labelB){return `<div class="nav-map"><span class="gps-chip">● 위치 업데이트 중 · GPS ±6m</span><div class="nav-route-line"></div><div class="nav-origin">출발</div><div class="nav-current" data-route-current style="--progress:${Math.round(routeProgress()*72+10)}%">●</div><div class="nav-dest">도착</div></div>`}
function transitLiveInfo(st){const now=Date.now(),first=st.etaAt||now+150000,freq=(st.frequency||330)*1000;let t1=first;while(t1<now-10000)t1+=freq;const s1=Math.max(0,Math.floor((t1-now)/1000)),s2=Math.max(0,Math.floor((t1+freq-now)/1000));const pos=s1>180?'3정거장 전':s1>110?'2정거장 전':s1>50?'1정거장 전':'진입 중';return {s1,s2,pos}}

function detailBack(){if(state.ui.detailParent){state.ui.detail=clone(state.ui.detailParent);state.ui.detailParent=null;save();renderDetail();show('detail',false);return}appBack('us')}
function applyAnswerPreference(oldV,newV){const sig=v=>({quiet:/조용|쉬|편/.test(v),cafe:/카페|커피/.test(v),experience:/체험|공방|전시/.test(v)}),o=sig(oldV||''),n=sig(newV||'');for(const [k,field] of [['quiet','quiet'],['cafe','cafe'],['experience','experience']]){if(o[k])state.couple.prefs[field]=Math.max(0,state.couple.prefs[field]-2);if(n[k])state.couple.prefs[field]=Math.min(100,state.couple.prefs[field]+2)}}
function saveQuestionAnswer(){const v=$('#detailAnswer')?.value.trim();if(!v){toast('답변을 적어주세요');return}applyAnswerPreference(state.couple.answer,v);state.couple.answer=v;state.couple.answerLocked=true;state.couple.answerDate=dateISO(nowLocal());save();renderDetail();renderUs();toast('오늘 답변을 확정했어요')}
function unlockAnswer(){openSheet('답변을 수정할까요?',`<p style="font-size:11px;color:var(--sub);line-height:1.6">기존 답변에서 반영된 취향 가중치도 함께 다시 계산해요.</p>`,'수정하기',()=>{state.couple.answerLocked=false;save();closeSheet();renderDetail()})}
function selectBalance(v){if(state.couple.balanceLocked){toast('오늘 밸런스 선택은 이미 확정됐어요');return}state.couple.balance=v;state.couple.balanceLocked=true;state.couple.balanceDate=dateISO(nowLocal());if(v==='체험')state.couple.prefs.experience=Math.min(100,state.couple.prefs.experience+2);state.couple.balanceSignal=v;save();renderDetail();renderUs();toast('선택을 확정했어요')}
function togglePartnerNotify(){state.couple.partnerNotify=!state.couple.partnerNotify;save();renderDetail();toast(state.couple.partnerNotify?'상대 선택 완료 시 알려드릴게요':'알림을 끄었어요')}
function renderDetail(){ensureDailyLocks();const d=state.ui.detail||{type:'month'};let html=`<div class="pagebar"><div class="pagebar-left"><button class="back" onclick="detailBack()">${icon('back')}</button><h2>${d.type==='question'?'오늘의 질문':d.type==='balance'?'오늘의 밸런스':d.type==='month'?'이번 달 기록':'지난 데이트'}</h2></div></div>`;if(d.type==='question'){html+=`<div class="detail-hero"><small>오늘의 질문 · 둘 다 답하면 더 재밌어요</small><h1>요즘 둘이 같이 있을 때<br>가장 편한 순간은 언제야?</h1><p>답변은 둘만 볼 수 있고, 일부 키워드는 다음 데이트 취향에 가볍게 반영돼요.</p></div><div class="detail-card"><h3>내 답변</h3>${state.couple.answerLocked?`<div class="locked-choice"><b>${escapeHTML(state.couple.answer)}</b><span>확정됨</span></div><button class="sub-action" style="margin-top:10px" onclick="unlockAnswer()">답변 수정</button>`:`<textarea class="input" id="detailAnswer" style="height:100px;padding:13px;resize:none" placeholder="편하게 적어주세요">${escapeHTML(state.couple.answer)}</textarea><button class="primary" style="width:100%;margin-top:10px" onclick="saveQuestionAnswer()">답변 확정</button>`}</div><div class="detail-card"><h3>${escapeHTML(state.couple.partnerName)}의 답변</h3>${state.couple.partnerAnswer?`<div class="locked-choice"><b>${escapeHTML(state.couple.partnerAnswer)}</b><span>답변 완료</span></div>`:`<p>아직 답변을 기다리고 있어요.</p><button class="sub-action" style="margin-top:10px" onclick="togglePartnerNotify()">${state.couple.partnerNotify?'답변 알림 켜짐':'답변 완료 알림 받기'}</button>`}</div><div class="detail-card"><h3>추천에는 이렇게 반영돼요</h3><p>‘조용’, ‘카페’, ‘체험’처럼 데이트 성향과 연결되는 표현만 작은 가중치로 사용하고, 답변 내용 자체를 공개 추천에 사용하지 않는 구조예요.</p></div>`}else if(d.type==='balance'){const partner=state.couple.partnerBalance;html+=`<div class="detail-hero"><small>오늘의 밸런스</small><h1>맛있는 걸 제대로 먹기<br>vs 새로운 걸 같이 해보기</h1><p>한 번 선택하면 오늘은 바꿀 수 없어요. 둘의 선택이 모두 끝나면 결과가 공개돼요.</p></div><div class="detail-card"><h3>내 선택</h3>${state.couple.balanceLocked?`<div class="locked-choice"><b>${state.couple.balance}</b><span>선택 완료</span></div>`:`<div class="choice-grid"><button class="sub-action" style="height:80px" onclick="selectBalance('맛집')">맛집</button><button class="sub-action" style="height:80px" onclick="selectBalance('체험')">체험</button></div>`}</div><div class="detail-card"><h3>${escapeHTML(state.couple.partnerName)}의 선택</h3>${partner?`<div class="locked-choice"><b>${partner}</b><span>선택 완료</span></div><p style="margin-top:10px">${state.couple.balance&&state.couple.balance===partner?'오늘은 둘의 취향이 딱 맞았어요.':'서로 다른 선택도 다음 코스에서 균형 있게 섞어볼게요.'}</p>`:`<p>아직 선택 대기 중이에요. 선택이 끝나면 푸시 알림을 받을 수 있어요.</p><button class="sub-action" style="margin-top:10px" onclick="togglePartnerNotify()">${state.couple.partnerNotify?'선택 완료 알림 켜짐':'푸시 알림 받기'}</button>`}</div>`}else if(d.type==='month'){const m=monthStats(),arr=state.history.filter(h=>h.date.startsWith(dateISO(nowLocal()).slice(0,7))),max=Math.max(1,...arr.map(h=>h.cost));html+=`<div class="detail-hero"><small>${Number(dateISO(nowLocal()).slice(5,7))}월의 우리</small><h1>${m.count}번 만나고<br>${formatWon(m.cost)} 썼어요</h1><p>평균 만족도 ${m.avg||'-'} · 사진 ${m.photos}장</p></div><div class="detail-card"><h3>이번 달 한눈에</h3><div class="arrival-grid"><div class="arrival-box"><small>데이트</small><b>${m.count}회</b></div><div class="arrival-box"><small>평균 1회</small><b>${m.count?formatWon(Math.round(m.cost/m.count)):formatWon(0)}</b></div></div><div class="monthly-bars">${[.35,.55,.42,.8,.62,.28,.48].map((x,i)=>`<i style="height:${Math.round(x*100)}%"></i>`).join('')}</div></div><div class="detail-card"><h3>상세 기록</h3>${arr.length?arr.map(h=>`<div class="detail-row" onclick="openHistoryDetail('${h.id}')" style="cursor:pointer"><b>${monthDay(h.date)} · ${escapeHTML(h.title)}</b><span>${formatWon(h.cost)}<br>사진 ${h.photos||0}장</span></div>`).join(''):'<p>이번 달 기록이 아직 없어요.</p>'}</div><div class="sticky-detail-action"><button onclick="memorySheet()">기록 추가하기</button></div>`}else{const h=state.history.find(x=>x.id===d.id);if(!h){html+='<div class="detail-card"><p>기록을 찾을 수 없어요.</p></div>'}else{const p=h.planSnapshot;html+=`<div class="detail-hero" style="background:linear-gradient(rgba(20,20,20,.34),rgba(20,20,20,.78)),url('${h.img}') center/cover"><small>${h.date} · ${h.rating?`${h.rating}/5`:'평점 없음'}</small><h1>${escapeHTML(h.title)}</h1><p>${escapeHTML(h.location)} · ${formatWon(h.cost)} · 사진 ${h.photos||0}장</p></div><div class="detail-card"><h3>그날 기록</h3><div class="detail-row"><b>실제 사용 금액</b><span>${formatWon(h.cost)}</span></div><div class="detail-row"><b>사진</b><span>${h.photos||0}장</span></div><div class="detail-row"><b>만족도</b><span>${h.rating?`${h.rating}/5`:'기록 없음'}</span></div></div>${p?`<div class="detail-card"><h3>당시 코스</h3>${p.stops.map((s,i)=>`<div class="detail-row"><b>${i+1}. ${escapeHTML(s.name)}</b><span>${s.cat}<br>${formatWon(s.cost)}</span></div>`).join('')}</div>`:''}`}}$('#detail').innerHTML=html}
function renderUs(){ensureDailyLocks();const days=Math.max(0,Math.floor((dateObj(dateISO(nowLocal()))-dateObj(state.couple.startDate))/86400000)+1),nextAnniv=nextCoupleEvent(),m=monthStats();$('#us').innerHTML=`<div class="topbar"><div class="brand">우리</div><div class="toolbar"><button class="icon-btn" onclick="annivSheet()">${icon('calendar')}</button><button class="icon-btn" onclick="wishSheet()">${icon('plus')}</button></div></div><div class="couple-hero"><div class="couple-head"><div class="avatars"><img class="avatar" src="${imgs.couple2}"><img class="avatar" src="${imgs.couple1}"></div><small>${escapeHTML(state.couple.myName)} × ${escapeHTML(state.couple.partnerName)}</small></div><h1>D+${days}</h1><p>${nextAnniv?`다음 기념일 ${dateText(nextAnniv.date)} · ${nextAnniv.name}`:'다가오는 기념일을 추가해보세요.'}</p></div><div class="section"><div class="question-card" onclick="openQuestionDetail()" style="cursor:pointer"><small>오늘의 질문 ${state.couple.answerLocked?'· 답변 완료':''}</small><h3>요즘 둘이 같이 있을 때<br>가장 편한 순간은 언제야?</h3><button onclick="event.stopPropagation();openQuestionDetail()">${state.couple.answerLocked?'답변 보기':'답변하기'}</button></div></div><div class="section"><div class="two-grid"><div class="small-card" onclick="openBalanceDetail()"><small>오늘의 밸런스</small><h4>${state.couple.balanceLocked?`${state.couple.balance} 선택 완료`:'맛집 vs 체험'}</h4><p>${state.couple.balanceLocked?`연인: ${state.couple.partnerBalance||'선택 대기 중'}`:'한 번 고르면 오늘은 잠겨요.'}</p></div><div class="small-card" onclick="openMonthDetail()"><small>이번 달 기록</small><h4>${m.count}회 · ${shortWon(m.cost)}</h4><p>누르면 지출·날짜·추억을 상세히 볼 수 있어요.</p></div></div></div><div class="section"><div class="section-head"><div><h3>가고 싶은 곳</h3><p>${state.couple.wish.length}개 · 다음 코스에 반영</p></div><button class="text-btn" onclick="wishSheet()">추가</button></div><div class="wish-list">${state.couple.wish.map((w,i)=>`<div class="wish"><img src="${[imgs.craft,imgs.park,imgs.night,imgs.cafe][i%4]}"><div><b>${escapeHTML(w.name)}</b><p>${w.cat} · 추천 가중치 적용</p></div><button onclick="removeWish('${w.id}')">삭제</button></div>`).join('')}</div></div><div class="section"><div class="section-head"><div><h3>최근 데이트</h3><p>눌러서 그날 코스와 실제 기록을 다시 볼 수 있어요</p></div></div>${state.history.slice(0,4).map(h=>`<div class="record-card" style="margin:10px 0 0;cursor:pointer" onclick="openHistoryDetail('${h.id}')"><img src="${h.img}"><div><small>${monthDay(h.date)} · ${'★'.repeat(h.rating||0)}</small><h4>${escapeHTML(h.title)}</h4><p>${formatWon(h.cost)} · 사진 ${h.photos||0}장 · ${escapeHTML(h.location)}</p></div></div>`).join('')}</div>`}
function historyCard(h){return `<div class="record-card" style="margin:10px 20px 0;cursor:pointer" onclick="openHistoryDetail('${h.id}')"><img src="${h.img}"><div><small>${monthDay(h.date)} · ${'★'.repeat(h.rating||0)}</small><h4>${escapeHTML(h.title)}</h4><p>${formatWon(h.cost)} · 사진 ${h.photos||0}장 · ${escapeHTML(h.location)}</p></div></div>`}
function dateCard(p,status,msg,isConfirmed){const statusLabel={proposed:'상대 답변 대기','needs-review':'재확인 필요',confirmed:'확정',declined:'다른 코스 요청',held:'후보'}[status]||status,activeSame=state.active?.plan?.id===p.id;return `<div class="card date-card"><div class="date-card-top"><div><span class="badge ${status==='confirmed'?'green':status==='needs-review'?'pink':status==='proposed'?'blue':'gray'}">${activeSame?'진행 중':statusLabel}</span><h3>${p.title}</h3><p>${dateText(p.meta?.date||state.planner.date)} ${p.meta?.time||state.planner.time} · ${LOCATIONS[p.locationKey].name}<br>${msg||''}</p></div></div><div class="date-actions"><button class="dark" onclick="openCourse('${p.id}',${isConfirmed})">코스 보기</button>${activeSame?`<button class="light" onclick="renderLive();show('live',true)">이어가기</button>`:isConfirmed&&status==='proposed'?`<button class="light" onclick="partnerResponseSheet()">상대 응답</button>`:isConfirmed&&status==='confirmed'?`<button class="light" onclick="startLive('${p.id}')">시작</button>`:`<button class="light" onclick="proposeSheet('${p.id}')">제안</button>`}</div></div>`}
function startTicker(){clearInterval(ticker);ticker=setInterval(()=>{if(state.tab==='course')$$('[data-liveeta="1"]',$('#course')).forEach((el,i)=>{const p=currentCoursePlan(state.viewPlanId),steps=p?[...p.outbound,...p.segments].flatMap(s=>s.steps):[],st=steps[i];if(st)el.textContent=etaText(st)});if(state.tab==='live'){renderLiveEtaOnly();renderPhaseClockOnly()}if(state.tab==='routeDetail')updateRouteDetailRealtime()},1000)}

function renderNav(){const tabs=[['home','home','홈'],['dates','route','데이트'],['us','heart','우리'],['my','user','마이']];$('#nav').innerHTML=tabs.map(([id,ic,t])=>`<button class="nav-btn ${state.tab===id?'on':''}" onclick="navTo('${id}')">${icon(ic)}<span>${t}</span></button>`).join('');$('#nav').style.display=['live','course','planner','result','routeDetail','detail'].includes(state.tab)?'none':'grid'}
function dateCardV9(b){const p=b.plan,statusLabel={proposed:'상대 답변 대기','needs-review':'재확인 필요',confirmed:'확정'}[b.status]||b.status,activeSame=state.active?.bookingId===b.bookingId||state.active?.plan?.id===p.id;return `<div class="card date-card"><div class="date-card-top"><div><span class="badge ${activeSame?'green':b.status==='confirmed'?'green':b.status==='needs-review'?'pink':'blue'}">${activeSame?'진행 중':statusLabel}</span><h3>${p.title}</h3><p>${dateText(p.meta.date)} ${p.meta.time} · ${LOCATIONS[p.locationKey].name}<br>${escapeHTML(b.message||'')}</p></div></div><div class="date-actions"><button class="dark" onclick="openBooking('${b.bookingId}')">코스 보기</button>${activeSame?`<button class="light" onclick="renderLive();show('live',true)">이어가기</button>`:b.status==='proposed'||b.status==='needs-review'?`<button class="light" onclick="state.confirmed=clone(state.upcomingDates.find(x=>x.bookingId==='${b.bookingId}'));save();partnerResponseSheet()">상대 응답</button>`:`<button class="light" onclick="startLive('${p.id}')">시작</button>`}</div></div>`}

function resetApp(){try{localStorage.removeItem('moment-v10');localStorage.removeItem('moment-v9');localStorage.removeItem('moment-v8')}catch(e){}state=clone(DEFAULT);ensureV9State();ensureDailyLocks();state.version=10;state.ui.navStack=[];save();toast('테스트 데이터를 초기화했어요');setTimeout(()=>location.reload(),350)}

function memorySheet(){openSheet('기록 추가',`<div class="field"><label>한 줄 기록</label><textarea class="input" id="memLine" style="height:92px;padding:13px;resize:none" placeholder="예: 비 왔는데 오히려 더 좋았던 날"></textarea></div><div class="field"><label>날짜</label><input class="input" type="date" id="memDate" value="${dateISO(nowLocal())}"></div><div class="field"><label>사용 금액</label><input class="input" type="number" min="0" id="memCost" value="65000"></div><div class="field"><label>사진 수</label><input class="input" type="number" min="0" id="memPhotos" value="8"></div>`,'기록 추가',()=>{const d=$('#memDate').value,c=Number($('#memCost').value),ph=Number($('#memPhotos').value),line=$('#memLine').value.trim();if(!isValidDateISO(d)||!Number.isFinite(c)||c<0||!Number.isFinite(ph)||ph<0){toast('날짜·금액·사진 수를 확인해주세요');return}state.history.unshift({id:uid('hist'),title:line||'둘이 오래 웃었던 날',date:d,rating:0,cost:Math.round(c),photos:Math.round(ph),location:'직접 기록',img:imgs.hero});save();closeSheet();renderUs();if(state.tab==='detail'&&state.ui.detail?.type==='month')renderDetail();toast('이번 달 기록에 추가했어요')})}
/* ===== end v10 ===== */

renderNav();renderHome();renderPlanner();if(state.plans.length)renderResult();renderDates();renderUs();renderMy();routeFromHash();
</script>
</body>
</html>
