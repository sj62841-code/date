function resetDaily(){const d=today();if(state.taste.date!==d)state.taste={date:d,choice:null};if(state.balance.date!==d)state.balance={date:d,my:null,partner:'short',notify:true};if(state.question.date!==d)state.question={date:d,my:null,partner:null,notify:true};save()}
function render(){clearTimers();resetDaily();const {route,params}=current();let out='';try{out=routes[route]?routes[route](params):routes.home()}catch(e){console.error(e);out=`${pagebar('오류')}<div class="section"><div class="feed-card"><div class="feed-pad"><b>화면을 불러오지 못했어요.</b><p class="feed-desc">${esc(e.message)}</p><button class="feed-action" onclick="switchTab('home')">홈으로</button></div></div></div>`}document.getElementById('app').innerHTML=shell(out,route)+`<div class="toast"></div>`;afterRender(route,params)}

  <div class="section"><div class="row-between"><div><h2 class="section-title">라운지에서 지금</h2><div class="section-sub">비슷한 연차의 커플들이 나누는 이야기.</div></div><button class="textbtn" onclick="switchTab('lounge')">더 보기</button></div><div class="lounge-preview" style="margin-top:12px">${state.posts.slice(0,2).map(p=>`<button class="post-row" style="width:100%;border-left:0;border-right:0;border-top:0;text-align:left;background:none" onclick="navigate('post',{id:'${p.id}'})"><div class="post-meta">${esc(p.badge)} · ${esc(p.region)}</div><b>${esc(p.title)}</b><div class="post-stats">공감 ${p.likes} · 댓글 ${p.comments.length}</div></button>`).join('')}</div></div>
  <div class="section"><div class="feed-card"><img class="memory-img" src="${IMG.memory}"><div class="feed-pad"><div class="feed-kicker">1년 전 오늘</div><div class="feed-title">그때는 목적지보다 같이 걷는 게 더 좋았던 날</div><div class="feed-desc">오래된 사진과 기록을 가끔 다시 꺼내보면 앱을 열 이유가 하나 더 생겨요.</div><button class="feed-action" onclick="navigate('records')">우리 기록 보기</button></div></div></div>

};
routes.planner=()=>{const p=state.planner;return `${pagebar('데이트 만들기')}<div class="section compact"><h1 style="font-size:31px;letter-spacing:-1.2px;line-height:1.1;margin:4px 0 8px">언제, 어디서 만나는지만<br>알려주세요.</h1><div class="section-sub">나머지는 평소 두 사람 취향과 설정을 기본값으로 사용해요.</div></div><div class="section compact"><div class="field"><div class="field-label">언제 만나요?</div><div class="field-row"><input class="input" id="planDate" type="date" value="${p.date||today()}"><input class="input" id="planTime" type="time" value="${p.time}"></div></div><div class="field"><div class="field-label">어디쯤에서 만나요?</div><select class="input" id="planArea"><option ${p.area==='성수'?'selected':''}>성수</option><option ${p.area==='건대'?'selected':''}>건대</option><option ${p.area==='강남'?'selected':''}>강남</option></select><div class="field-note">나중에는 두 사람 출발지 기준 중간지점도 자동 계산해요.</div></div><div class="field"><div class="field-label">평소 설정으로 진행</div><div class="field-value">2인 ${money(p.budget)} · ${p.transport==='auto'?'이동 자동 선택':transportLabel(p.transport)}</div><div class="field-note">귀가 ${p.returnTime} · 데이트 강도 ${p.energy==='easy'?'편하게':p.energy==='active'?'제대로':'보통'}</div><button class="optional" onclick="document.getElementById('advanced').classList.toggle('hidden')">오늘만 조건 바꾸기 <span>＋</span></button><div id="advanced" class="hidden"><div class="field-label">예산</div><div class="chips" id="budgetChips">${[50000,70000,100000,150000,200000].map(v=>`<button class="chip ${p.budget===v?'on':''}" onclick="setPlanOpt('budget',${v},this)">${money(v)}</button>`).join('')}</div><div class="field-label" style="margin-top:15px">이동</div><div class="chips">${[['auto','알아서'],['public','대중교통'],['taxi','택시'],['car','자차']].map(([v,l])=>`<button class="chip ${p.transport===v?'on':''}" onclick="setPlanOpt('transport','${v}',this)">${l}</button>`).join('')}</div><div class="field-label" style="margin-top:15px">오늘 컨디션</div><div class="chips">${[['easy','편하게'],['normal','보통'],['active','제대로']].map(([v,l])=>`<button class="chip ${p.energy===v?'on':''}" onclick="setPlanOpt('energy','${v}',this)">${l}</button>`).join('')}</div><div class="field-label" style="margin-top:15px">귀가 마지노선</div><input class="input" id="returnTime" type="time" value="${p.returnTime}"></div></div></div><div style="height:96px"></div><div class="cta-fixed"><button class="primary" onclick="generateFromPlanner()">코스 짜줘</button></div>`}
routes.results=()=>{return `${pagebar('추천 코스',`<button class="iconbtn" onclick="regenerate()">↻</button>`)}<div class="section compact"><h1 style="font-size:30px;letter-spacing:-1.1px;margin:4px 0 5px">세 가지로 골라봤어요.</h1><div class="section-sub">다 고를 필요 없어요. 제일 마음 가는 것 하나만 보면 돼요.</div></div><div class="section compact">${state.plans.map((p,i)=>`<div class="result-card"><div class="result-img"><img src="${p.cover}"><div class="result-badge">${['가장 잘 맞음','가성비','평소와 다르게'][i]||'추천'}</div></div><div class="result-body"><div class="result-title">${esc(p.title)}</div><div class="result-reason">${esc(p.reason)}</div><div class="result-meta"><span class="meta-pill">${p.totalHours.toFixed(1)}시간</span><span class="meta-pill">2인 약 ${money(p.totalCost)}</span><span class="meta-pill">이동 ${p.travelMin}분</span></div><button class="result-button" onclick="openPlan('${p.id}')">코스 상세보기</button></div></div>`).join('')}</div>`}
routes.course=({id})=>{const p=findPlan(id);if(!p)return `${pagebar('코스')}<div class="section">코스를 찾지 못했어요.</div>`;const confirmed=state.confirmed.find(x=>x.planId===p.id);const live=state.live&&state.live.planId===p.id&&state.live.status!=='ended';const action=live?`<button class="primary" onclick="resumeLive()">데이트 이어가기</button>`:confirmed?`<button class="primary" onclick="startLive('${p.id}')">데이트 시작</button>`:`<div class="course-action-grid"><button class="secondary" onclick="saveCandidate('${p.id}')">고민 중 저장</button><button class="primary" onclick="confirmPlan('${p.id}')">이 코스로 확정</button></div>`;return `${pagebar('코스 상세')}<div class="course-cover"><img src="${p.cover}"><div class="cover-copy"><h1>${esc(p.title)}</h1><p>${p.totalHours.toFixed(1)}시간 · 2인 약 ${money(p.totalCost)} · ${esc(p.config?.area||state.planner.area)}</p></div></div><div class="why"><b>이 코스를 추천한 이유</b><ul>${p.why.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="course-action-inline">${action}</div><div class="timeline">${timelineHTML(p)}</div><div class="section"><div class="field"><div class="field-label">귀가 체크</div><div class="field-value">${p.returnLeave}까지 마지막 장소에서 출발 권장</div><div class="field-note">내 집까지 ${p.return.me.duration}분 · 연인 집까지 ${p.return.partner.duration}분 · 두 사람 중 더 촉박한 쪽 기준</div><button class="smallbtn" style="margin-top:10px" onclick="navigate('return',{planId:'${p.id}'})">귀가 경로 자세히</button></div></div>`}
routes.live=()=>{const L=state.live;if(!L||L.status==='ended')return `${pagebar('데이트 진행')}<div class="section">진행 중인 데이트가 없어요.</div>`;const p=findPlan(L.planId);if(!p)return '';if(L.stage==='to_first'){if(!L.firstSegment){L.firstSegment=makeFirstSegment(p,p.config?.transport||'auto');save()}return liveMoving(p,L,L.firstSegment)}if(L.stage==='moving')return liveMoving(p,L,p.segments[L.segmentIndex]);return liveAt(p,L)}
routes.walkNav=({planId,segIndex,stepIndex,returnWho})=>{const ctx=getSegmentContext(planId,segIndex,returnWho),step=ctx?.segment?.steps?.[stepIndex];if(!step)return `${pagebar('도보 길찾기')}<div class="section">경로를 찾지 못했어요.</div>`;return `${pagebar('도보 길찾기',`<button class="iconbtn" onclick="copyText('${esc(step.to||ctx.destination.address)}')">${icon('copy')}</button>`)}<div class="map">${mapSVG('walk')}<div class="map-ui"><div class="map-pill">GPS 정확도 4m</div><div class="map-pill" id="walkRemain">${step.duration||6}분 남음</div></div><div class="map-bottom"><strong>${esc(step.to||ctx.destination.name)}</strong><p>${esc(step.address||ctx.destination.address)} · 현재 위치에서 경로를 계속 갱신해요.</p></div></div><div class="nav-instruction"><div class="instruction-main" id="walkInstruction">80m 직진 후 오른쪽</div><div class="instruction-sub">화면을 켜둔 동안 현재 위치 기준으로 다음 안내가 바뀝니다.</div><div class="nav-stats"><div class="stat"><span>남은 거리</span><b id="walkDist">420m</b></div><div class="stat"><span>남은 시간</span><b id="walkTime">${step.duration||6}분</b></div><div class="stat"><span>도착 예정</span><b>${minutesToHM(hmToMin(nowHM())+(step.duration||6))}</b></div></div></div>`}
routes.transit=({planId,segIndex,stepIndex,returnWho})=>{const ctx=getSegmentContext(planId,segIndex,returnWho),step=ctx?.segment?.steps?.[stepIndex];if(!step)return `${pagebar('대중교통')}<div class="section">정보를 찾지 못했어요.</div>`;const bus=step.type==='bus';const lineName=bus?`${esc(step.line)}번`:`${esc(step.lineName||step.line||'지하철')}`;const options=bus?(step.routes||[step.line]):[];return `${pagebar(bus?'버스 상세':'지하철 상세')}<div class="section compact"><div class="transit-hero"><div class="transit-route-title"><div class="line-dot">${bus?'BUS':esc(step.line||'철')}</div><div><h2>${esc(step.from)} → ${esc(step.to)}</h2><p>${bus?`${lineName} 추천 · ${esc(step.direction||'목적지 방면')}`:`${lineName} · ${esc(step.direction||'목적지 방면')}`}</p></div></div><div class="transit-guide">${bus?`<div class="transit-guide-row"><div class="k">타는 정류장</div><div class="v">${esc(step.from)}<small>정류장 번호 ${esc(step.stopId||'-')} · ${esc(step.boarding||'승강 위치 확인')}</small></div></div><div class="transit-guide-row"><div class="k">방향</div><div class="v">${esc(step.direction||'목적지 방면')}<small>반대편 정류장으로 가지 않도록 방면을 확인하세요.</small></div></div><div class="transit-guide-row"><div class="k">탈 수 있는 버스</div><div class="v"><div class="bus-options">${options.map(n=>`<span class="bus-option ${String(n)===String(step.line)?'recommended':''}">${esc(String(n))}${String(n)===String(step.line)?' · 추천':''}</span>`).join('')}</div><small>먼저 오는 차량을 타도 같은 하차 정류장으로 가는 노선만 표시해요.</small></div></div><div class="transit-guide-row"><div class="k">내리는 정류장</div><div class="v">${esc(step.to)}<small>${esc(step.stops||0)}정거장 · 약 ${esc(step.duration)}분 · ${esc(step.exit||'하차 후 목적지 방향')}</small></div></div>`:`<div class="transit-guide-row"><div class="k">타는 역</div><div class="v">${esc(step.from)} · ${lineName}<small>${esc(step.platform||'승강장 확인')}</small></div></div><div class="transit-guide-row"><div class="k">타는 방향</div><div class="v">${esc(step.direction||'목적지 방면')}<small>${esc(step.trainFor||'해당 방면 열차 탑승')}</small></div></div><div class="transit-guide-row"><div class="k">내리는 역</div><div class="v">${esc(step.to)}<small>${esc(step.stops||0)}정거장 · 약 ${esc(step.duration)}분</small></div></div><div class="transit-guide-row"><div class="k">빠른 하차</div><div class="v">${esc(step.tip||'추천 승차 위치 확인')}<small>${esc(step.exit||'가까운 출구')}로 나가면 다음 장소까지 가장 짧아요.</small></div></div>`}</div><div class="transit-arrivals"><div class="transit-arrival"><div><b>${bus?`${lineName} · 가장 빠른 버스`:`${lineName} · 가장 빠른 열차`}</b><p id="vehicleLoc">${esc(step.vehicleLoc||'현재 2정거장 전')} · ${esc(step.crowd||'혼잡 보통')}</p></div><div class="countdown" data-countdown="${step.arrivalSec||112}">1분 52초</div></div><div class="transit-arrival"><div><b>${bus?'다음 버스':'다음 열차'}</b><p>${esc(step.nextVehicleLoc||'현재 5정거장 전')}</p></div><div class="countdown" data-countdown="${step.nextArrivalSec||368}">6분 08초</div></div></div><div class="transit-note">현재 프로토타입은 교통 정보를 시뮬레이션해요. 실제 출시에서는 지역 교통 API로 정류장·승강장·실시간 도착·운행변경 정보를 자동 갱신합니다.</div></div></div>`}

routes.car=({planId,segIndex,returnWho})=>{const ctx=getSegmentContext(planId,segIndex,returnWho),s=ctx.segment;return `${pagebar('자차 길찾기')}<div class="map">${mapSVG('car')}<div class="map-bottom"><strong>${esc(ctx.destination.name)}</strong><p>${esc(ctx.destination.address)}</p></div></div><div class="section compact"><div class="field"><div class="field-label">목적지 주소</div><div class="field-value">${esc(ctx.destination.name)}</div><div class="field-note">${esc(ctx.destination.address)}</div><div class="address-actions"><button onclick="copyText('${esc(ctx.destination.address)}')">주소 복사</button><button onclick="openMapApp('kakao','${esc(ctx.destination.address)}')">카카오맵</button><button onclick="openMapApp('tmap','${esc(ctx.destination.address)}')">T map</button><button onclick="openMapApp('naver','${esc(ctx.destination.address)}')">네이버지도</button></div></div><div class="nav-stats"><div class="stat"><span>예상 시간</span><b>${s.durationMin}분</b></div><div class="stat"><span>유류비</span><b>${money(s.fuelCost||0)}</b></div><div class="stat"><span>주차 예상</span><b>${money(s.parkingCost||0)}</b></div></div><div class="field" style="margin-top:10px"><div class="field-label">추천 주차</div><div class="field-value">${esc(s.parkingName||'목적지 인근 공영주차장')}</div><div class="field-note">${esc(s.parkingAddress||ctx.destination.address)} · 주차 후 도보 ${s.walkAfter||4}분 · 예상 빈자리 ${s.spaces||12}대</div></div></div>`}
routes.return=({planId})=>{const p=findPlan(planId);return `${pagebar('귀가 경로')}<div class="section compact"><h1 style="font-size:28px;letter-spacing:-1px;margin:4px 0 7px">둘 다 무리 없이 집까지.</h1><div class="section-sub">마지막 장소에서 각자 집까지 따로 계산해요.</div></div>${['me','partner'].map(w=>{const r=p.return[w],name=w==='me'?state.profile.me:state.profile.partner;return `<div class="section compact"><div class="feed-card"><div class="feed-pad"><div class="feed-kicker">${esc(name)} 귀가</div><div class="feed-title">${r.duration}분 · ${r.lastTrain} 막차 여유</div><div class="feed-desc">${esc(r.summary)}</div><button class="feed-action" onclick="navigate('returnDetail',{planId:'${p.id}',who:'${w}'})">경로 상세보기</button></div></div></div>`}).join('')}`}
routes.returnDetail=({planId,who})=>{const p=findPlan(planId),r=p.return[who],name=who==='me'?state.profile.me:state.profile.partner;return `${pagebar(`${name} 귀가`)}<div class="section compact"><div class="field"><div class="field-label">권장 출발</div><div class="field-value">${p.returnLeave}</div><div class="field-note">막차 ${r.lastTrain} · 집 도착 예상 ${r.arrive}</div><div class="next-address"><div class="lab">귀가 최종 목적지</div><b>${who==='me'?esc(state.profile.homeMe):esc(state.profile.homePartner)}</b><div class="address-actions"><button onclick="copyText('${who==='me'?esc(state.profile.homeMe):esc(state.profile.homePartner)}')">주소 복사</button></div></div></div><div class="live-card" style="margin:12px 18px">${r.steps.map((s,i)=>`<button class="route-step" style="width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left" onclick="openReturnStep('${planId}','${who}',${i})"><div class="step-num">${i+1}</div><div><b>${esc(s.title)}</b><p>${esc(s.detail)}</p></div><div class="chev">›</div></button>`).join('')}</div></div>`}
routes.taste=()=>{const c=state.taste.choice;return `${pagebar('오늘의 10초 취향')}<div class="section compact"><h1 style="font-size:30px;letter-spacing:-1.1px;margin:4px 0 7px">오늘은 어디가 더 끌려?</h1><div class="section-sub">한 번 고르면 오늘 추천에 반영돼요.</div></div><div class="section compact"><div class="choice-wrap"><button class="choice-card ${c==='quiet'?'selected':c?'dim':''}" onclick="chooseTaste('quiet')"><img src="${IMG.cafe1}"><div class="choice-copy"><b>조용한 골목 카페</b><p>작고 조용한 공간, 오래 앉아 대화하기</p>${c==='quiet'?'<div class="choice-check">✓ 오늘은 이쪽</div>':''}</div></button><button class="choice-card ${c==='rooftop'?'selected':c?'dim':''}" onclick="chooseTaste('rooftop')"><img src="${IMG.cafe2}"><div class="choice-copy"><b>대형 루프탑 카페</b><p>뷰, 사진, 공간 자체를 즐기는 쪽</p>${c==='rooftop'?'<div class="choice-check">✓ 오늘은 이쪽</div>':''}</div></button></div>${c?`<div class="locked-note" style="margin-top:12px">오늘 선택이 저장됐어요. 다음 데이트 코스에 반영합니다.</div><button class="secondary" style="width:100%;margin-top:10px" onclick="changeTaste()">선택 변경</button>`:''}</div>`}
routes.question=()=>{const q='우리 처음 만났을 때 내가 어떤 사람 같았어?';return `${pagebar('오늘의 질문')}<div class="section compact"><div class="feed-card"><div class="feed-pad"><div class="feed-kicker">오늘의 질문</div><div class="feed-title">${q}</div><div class="feed-desc">두 사람 모두 답하면 서로의 답이 공개돼요.</div></div></div>${state.question.my?`<div class="answer-box" style="margin-top:12px"><div class="answer-label">내 답</div><div class="answer-text">${esc(state.question.my)}</div></div>${state.question.partner?`<div class="answer-box" style="margin-top:10px"><div class="answer-label">연인의 답</div><div class="answer-text">${esc(state.question.partner)}</div></div>`:`<div class="locked-note" style="margin-top:10px">연인의 답을 기다리고 있어요.</div><button class="secondary" style="width:100%;margin-top:8px" onclick="state.question.notify=!state.question.notify;save();render()">${state.question.notify?'✓ 연인이 답하면 알려주기':'연인 답변 알림 켜기'}</button>`}<button class="secondary" style="width:100%;margin-top:10px" onclick="editQuestion()">내 답 수정</button>`:`<textarea id="qAnswer" class="compose" style="margin-top:12px" placeholder="짧게 적어도 괜찮아요."></textarea><button class="primary" style="margin-top:10px" onclick="saveQuestion()">답변 저장</button>`}</div>`}
routes.balance=()=>{const b=state.balance;return `${pagebar('오늘의 밸런스')}<div class="section compact"><h1 style="font-size:29px;letter-spacing:-1px;margin:4px 0 6px">여행은 어떤 쪽?</h1><div class="section-sub">내가 고르기 전에는 연인의 답을 보여주지 않아요.</div></div><div class="section compact">${!b.my?`<div class="choice-wrap"><button class="choice-card" onclick="chooseBalance('short')"><img src="${IMG.park}"><div class="choice-copy"><b>자주 짧게 여행</b><p>가볍게, 자주, 부담 없이</p></div></button><button class="choice-card" onclick="chooseBalance('long')"><img src="${IMG.night}"><div class="choice-copy"><b>몰아서 길게 여행</b><p>한 번 갈 때 제대로 오래</p></div></button></div><div class="locked-note" style="margin-top:12px">연인도 참여했어요 👀 먼저 내 답을 골라주세요.</div>`:`<div class="feed-card"><div class="feed-pad"><div class="feed-kicker">결과</div><div class="feed-title">${b.my===b.partner?'둘의 선택이 같아요':'이번에는 의견이 갈렸어요'}</div><div class="mini-grid" style="margin-top:14px"><div class="mini-feed"><strong>나</strong><p>${b.my==='short'?'자주 짧게 여행':'몰아서 길게 여행'}</p></div><div class="mini-feed"><strong>연인</strong><p>${b.partner==='short'?'자주 짧게 여행':'몰아서 길게 여행'}</p></div></div><div class="feed-desc" style="margin-top:12px">선택은 오늘 기록으로 남고, 취향 학습에 한 번만 반영돼요.</div></div></div>`}</div>`}
routes.month=()=>{const rec=state.records.filter(r=>r.date.startsWith('2026-09'));const total=rec.reduce((a,r)=>a+r.cost,0),hrs=rec.reduce((a,r)=>a+r.hours,0),photos=rec.reduce((a,r)=>a+r.photos,0),rating=rec.length?(rec.reduce((a,r)=>a+r.rating,0)/rec.length).toFixed(1):'-';return `${pagebar('이번 달 기록',`<button class="iconbtn" onclick="navigate('addRecord')">${icon('plus')}</button>`)}<div class="section compact"><div class="month-hero"><div class="eyebrow">9월의 우리</div><h1 style="font-size:28px;margin:4px 0 0">${rec.length?`${rec.length}번 만나 ${Math.round(hrs)}시간 함께`:'이번 달 첫 기록을 남겨보세요'}</h1><div class="month-grid"><div class="month-stat"><span>총 사용</span><b>${money(total)}</b></div><div class="month-stat"><span>평균 만족도</span><b>${rating}</b></div><div class="month-stat"><span>사진</span><b>${photos}장</b></div><div class="month-stat"><span>평균 데이트</span><b>${rec.length?(hrs/rec.length).toFixed(1):0}h</b></div></div></div></div><div class="section compact"><div class="row-between"><h2 class="section-title">날짜별 기록</h2><button class="textbtn" onclick="navigate('addRecord')">기록 추가</button></div>${rec.length?rec.map(r=>recordHTML(r)).join(''):`<div class="feed-card" style="margin-top:12px"><div class="feed-pad"><div class="feed-desc">아직 9월 기록이 없어요. 데이트가 끝나면 자동으로 추가되고, 직접 추가할 수도 있어요.</div></div></div>`}</div>`}
routes.record=({id})=>{const r=state.records.find(x=>x.id===id);if(!r)return '';return `${pagebar('데이트 기록')}<div class="section compact"><div class="feed-card"><img class="memory-img" src="${IMG.memory}"><div class="feed-pad"><div class="feed-kicker">${esc(r.date)}</div><div class="feed-title">${esc(r.title)}</div><div class="record-meta"><span>${money(r.cost)}</span><span>${r.hours}시간</span><span>만족도 ${r.rating}</span><span>사진 ${r.photos}장</span></div><div class="feed-desc" style="margin-top:13px">${esc(r.memo)}</div></div></div><div class="field" style="margin-top:12px"><div class="field-label">그날 방문</div><div class="chips">${r.places.map(x=>`<span class="chip on">${esc(x)}</span>`).join('')}</div></div></div>`}
routes.addRecord=()=>`${pagebar('기록 추가')}<div class="section compact"><div class="field"><div class="field-label">날짜</div><input id="recDate" class="input" type="date" value="${today()}"></div><div class="field"><div class="field-label">제목</div><input id="recTitle" class="input" placeholder="예: 성수에서 느긋하게"></div><div class="field-row"><div class="field"><div class="field-label">실제 사용금액</div><input id="recCost" class="input" type="number" min="0" value="80000"></div><div class="field"><div class="field-label">사진 수</div><input id="recPhotos" class="input" type="number" min="0" value="0"></div></div><div class="field"><div class="field-label">한 줄 기록</div><textarea id="recMemo" class="compose" style="min-height:95px" placeholder="오늘 기억하고 싶은 것"></textarea></div><button class="primary" onclick="addRecord()">기록 저장</button></div>`

routes.dates=()=>{const live=state.live&&state.live.status!=='ended'?state.live:null;return `${topHome().replace('모먼트','데이트')}<div class="section compact">${live?`<div class="live-resume"><div class="tag">진행 중</div><h3>${esc(live.title)}</h3><p>${esc(live.currentLabel||'')}</p><button class="resume-btn" onclick="resumeLive()">이어서 하기</button></div>`:''}<div class="row-between" style="margin-top:${live?'20px':'0'}"><h2 class="section-title">예정된 데이트</h2><button class="textbtn" onclick="navigate('planner')">새로 만들기</button></div>${state.confirmed.length?state.confirmed.map(c=>{const p=findPlan(c.planId);return p?`<button class="record" style="width:100%;border:0;text-align:left" onclick="navigate('course',{id:'${p.id}'})"><b>${esc(p.title)}</b><p>${esc(c.date)} · ${esc(c.time)} · ${money(p.totalCost)}</p></button>`:''}).join(''):`<div class="feed-card" style="margin-top:12px"><div class="feed-pad"><div class="feed-desc">아직 확정한 데이트가 없어요.</div></div></div>`}<div class="row-between" style="margin-top:24px"><h2 class="section-title">고민 중</h2></div>${state.savedCandidates.length?state.savedCandidates.map(s=>`<button class="record" style="width:100%;border:0;text-align:left" onclick="navigate('course',{id:'${s.planId}'})"><b>${esc(s.title)}</b><p>후보로 저장됨 · ${money(s.totalCost)}</p></button>`).join(''):`<div class="section-sub" style="margin-top:10px">마음에 드는 코스를 저장해두면 여기에 모여요.</div>`}<div class="row-between" style="margin-top:24px"><h2 class="section-title">지난 데이트</h2><button class="textbtn" onclick="navigate('records')">전체</button></div>${state.records.slice(0,2).map(recordHTML).join('')}</div>`}
function postSuggestion(id){const map={p2:{name:'성수 쿠킹클래스',area:'성수',cat:'체험',img:IMG.craft},p4:{name:'서촌 골목 산책',area:'서촌',cat:'산책',img:IMG.park},p6:{name:'둘이 요리하는 저녁',area:'집데이트',cat:'체험',img:IMG.meal}};return map[id]||null}
function saveCommunityPlace(id){const x=postSuggestion(id);if(!x)return;if(state.wishlist.some(w=>w.name===x.name)){toast('이미 위시리스트에 있어요');return}state.wishlist.unshift({id:'w_'+Date.now(),sourceId:'community_'+id,...x});save();render();toast('둘의 위시리스트에 저장했어요')}
routes.lounge=()=>{const cats=['전체','데이트 추천','연애 고민','선물·기념일','맛집·장소','장거리'],posts=state.communityCategory==='전체'?state.posts:state.posts.filter(p=>p.cat===state.communityCategory);return `<div class="lounge-top"><h1>커플 라운지</h1><p>익명으로 편하게. 연애 연차와 상황이 보이니 맥락은 더 잘 보여요.</p></div><div class="category-scroll">${cats.map(x=>`<button class="chip ${state.communityCategory===x?'on':''}" onclick="state.communityCategory='${x}';save();render()">${x}</button>`).join('')}</div>${posts.length?posts.map(p=>postHTML(p)).join(''):`<div class="section compact"><div class="feed-card"><div class="feed-pad"><div class="feed-desc">아직 이 카테고리 글이 없어요. 첫 글을 남겨보세요.</div></div></div></div>`}<button class="fab" onclick="navigate('compose')">＋</button>`}
routes.post=({id})=>{const p=state.posts.find(x=>x.id===id);return `${pagebar('라운지')}<div class="section compact"><div class="post-card" style="margin:0"><div class="badge-row"><span class="c-badge">${esc(p.badge)}</span><span class="c-badge">${esc(p.region)}</span></div><h3 style="font-size:20px">${esc(p.title)}</h3><p style="font-size:12px">${esc(p.body)}</p><div class="post-foot"><button class="textbtn" onclick="likePost('${p.id}')">♡ 공감 ${p.likes}</button><span>댓글 ${p.comments.length}</span></div></div><div style="margin-top:18px"><h2 class="section-title" style="font-size:18px">댓글</h2><div class="feed-card" style="margin-top:10px"><div class="feed-pad">${p.comments.length?p.comments.map(c=>`<div class="comment"><b>${esc(c.who)}</b><p>${esc(c.text)}</p></div>`).join(''):`<div class="feed-desc">첫 댓글을 남겨보세요.</div>`}</div></div><textarea id="commentText" class="compose" style="min-height:78px;margin-top:10px" placeholder="익명으로 댓글 남기기"></textarea><button class="secondary" style="width:100%;margin-top:8px" onclick="addComment('${p.id}')">댓글 등록</button></div></div>`}
routes.compose=()=>`${pagebar('글쓰기')}<div class="section compact"><div class="field"><div class="field-label">카테고리</div><select id="postCat" class="input"><option>데이트 추천</option><option>연애 고민</option><option>선물·기념일</option><option>맛집·장소</option><option>장거리</option></select></div><div class="field"><div class="field-label">제목</div><input id="postTitle" class="input" placeholder="무슨 이야기를 나누고 싶나요?"></div><textarea id="postBody" class="compose" placeholder="내용을 적어주세요. 개인을 특정할 수 있는 정보는 피해주세요."></textarea><div class="locked-note" style="margin-top:10px">작성자 표시는 “${relationship()} · ${state.profile.region}”처럼 익명 칭호로 보여요.</div><button class="primary" style="margin-top:12px" onclick="submitPost()">등록하기</button></div>`
routes.us=()=>`${topHome().replace('모먼트','우리')}<div class="section compact"><div class="feed-card"><div class="feed-pad"><div class="feed-kicker">우리의 시간</div><div class="feed-title">${relationship()}</div><div class="feed-desc">다음 500일까지 ${Math.max(0,500-daysTogether())}일 · 함께 쌓인 기록 ${state.records.length}개</div></div></div></div><div class="section"><h2 class="section-title">오늘</h2><div class="mini-grid" style="margin-top:12px"><button class="mini-feed" style="border:0;text-align:left" onclick="navigate('taste')"><strong>취향</strong><p>${state.taste.choice?'오늘 선택 완료':'10초면 끝나요'}</p></button><button class="mini-feed" style="border:0;text-align:left" onclick="navigate('question')"><strong>질문</strong><p>${state.question.my?'내 답 저장됨':'오늘 하나 남기기'}</p></button><button class="mini-feed" style="border:0;text-align:left" onclick="navigate('balance')"><strong>밸런스</strong><p>${state.balance.my?'결과 보기':'서로 고르기'}</p></button><button class="mini-feed" style="border:0;text-align:left" onclick="navigate('month')"><strong>이번 달</strong><p>기록과 소비 보기</p></button></div></div><div class="section"><div class="feed-card"><img class="memory-img" src="${IMG.memory}"><div class="feed-pad"><div class="feed-kicker">랜덤 추억</div><div class="feed-title">말없이 오래 걸었던 날</div><div class="feed-desc">가끔은 계획보다 이미 함께한 시간이 더 오래 머물게 해요.</div><button class="feed-action" onclick="navigate('records')">추억 더 보기</button></div></div></div><div class="section"><div class="row-between"><h2 class="section-title">위시리스트</h2><button class="textbtn" onclick="navigate('wishlist')">전체</button></div><div class="chips" style="margin-top:12px">${state.wishlist.map(w=>`<span class="chip">${esc(w.name)}</span>`).join('')}</div></div>`
routes.profile=()=>`${pagebar('설정')}<div class="section compact"><div class="field"><div class="field-label">내 이름</div><input id="pfMe" class="input" value="${esc(state.profile.me)}"></div><div class="field"><div class="field-label">연인 이름</div><input id="pfPartner" class="input" value="${esc(state.profile.partner)}"></div><div class="field"><div class="field-label">연애 시작일</div><input id="pfStart" class="input" type="date" value="${state.profile.coupleStart}"></div><div class="field"><div class="field-label">내 집 기준 주소</div><input id="pfHomeMe" class="input" value="${esc(state.profile.homeMe)}"></div><div class="field"><div class="field-label">연인 집 기준 주소</div><input id="pfHomePartner" class="input" value="${esc(state.profile.homePartner)}"></div><div class="field"><div class="field-label">기본 데이트 예산</div><input id="pfBudget" class="input" type="number" min="0" value="${state.profile.budget}"></div><div class="field"><div class="field-label">기본 귀가시간</div><input id="pfReturn" class="input" type="time" value="${state.profile.returnTime}"></div><button class="primary" onclick="saveProfile()">저장</button></div>`
function daysTogether(){const a=new Date(state.profile.coupleStart+'T00:00:00'),b=new Date();return Math.max(1,Math.floor((b-a)/86400000)+1)}
function recordHTML(r){return `<button class="record" style="width:100%;border:0;text-align:left" onclick="navigate('record',{id:'${r.id}'})"><b>${esc(r.date.slice(5).replace('-','.'))} · ${esc(r.title)}</b><p>${money(r.cost)} · ${r.hours}시간 · 만족도 ${r.rating}</p><div class="record-meta">${r.places.map(x=>`<span>${esc(x)}</span>`).join('')}</div></button>`}
function postHTML(p){return `<button class="post-card" style="width:calc(100% - 36px);border:0;text-align:left" onclick="navigate('post',{id:'${p.id}'})"><div class="badge-row"><span class="c-badge">${esc(p.badge)}</span><span class="c-badge">${esc(p.region)}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><div class="post-foot"><span>공감 ${p.likes}</span><span>댓글 ${p.comments.length}</span></div></button>`}
function transportLabel(v){return {public:'대중교통',taxi:'택시',car:'자차',walk:'도보',auto:'자동 선택'}[v]||v}
function setPlanOpt(key,val,el){state.planner[key]=val;save();const parent=el.parentElement;parent.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
function openHomeSetup(type){const app=document.getElementById('app');const a=type==='area';app.insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>${a?'어디에서 만나요?':'몇 시에 만나요?'}</h3><p>${a?'지역만 바꾸면 홈에서 바로 코스를 만들 수 있어요.':'오늘 만나는 시간만 빠르게 바꿔요.'}</p>${a?['성수','건대','강남'].map(x=>`<button class="sheet-option ${state.planner.area===x?'on':''}" onclick="state.planner.area='${x}';save();document.querySelector('.sheet-wrap').remove();render()"><div><b>${x}</b><span>${AREA[x].region} 기준</span></div><div>›</div></button>`).join(''):['17:30','18:30','19:30','20:30'].map(x=>`<button class="sheet-option ${state.planner.time===x?'on':''}" onclick="state.planner.time='${x}';save();document.querySelector('.sheet-wrap').remove();render()"><div><b>${x}</b><span>오늘</span></div><div>›</div></button>`).join('')}</div></div>`)}
function quickGenerate(mode){state.planner.date=today();if(mode==='now3'){state.planner.time=nowHM();state.planner.duration=3;state.planner.energy='easy'}else if(mode==='tonight'){state.planner.time='18:30';state.planner.duration=4;state.planner.energy='easy'}else{state.planner.duration=5}save();generatePlans();navigate('results')}
function generateFromPlanner(){const d=document.getElementById('planDate').value,t=document.getElementById('planTime').value,a=document.getElementById('planArea').value,ret=document.getElementById('returnTime');if(!d||!t||!a){toast('날짜, 시간, 지역을 확인해주세요.');return}state.planner.date=d;state.planner.time=t;state.planner.area=a;if(ret)state.planner.returnTime=ret.value;save();generatePlans();navigate('results')}
function generatePlans(){const p=state.planner,a=AREA[p.area],pool=a.pool.slice();const variants=[{type:'best',title:`${p.area}에서 천천히, 둘에게 맞게`,reason:'이동을 줄이고 체험·카페·식사를 균형 있게 섞었어요.'},{type:'value',title:`예산은 가볍게, 만족도는 높게`,reason:'무료·저비용 구간을 섞고 이동비도 줄였어요.'},{type:'new',title:`오늘은 평소보다 조금 다르게`,reason:'평소보다 체험 비중을 높이고 새로운 장소를 넣었어요.'}];state.plans=variants.map((v,i)=>buildPlan(v,i,p,pool));state.selectedPlanId=state.plans[0].id;save()}
function buildPlan(v,i,p,pool){let selected;if(v.type==='value')selected=[pool[0],pool[2]||pool[1],pool[4]||pool[3]].filter(Boolean);else if(v.type==='new')selected=[pool[0],pool[5]||pool[2],pool[3]||pool[1],pool[4]||pool[2]].filter(Boolean);else selected=[pool[0],pool[1],pool[3]||pool[2],pool[4]||pool[5]].filter(Boolean);selected=selected.map(x=>({...x}));if(p.duration<=3)selected=selected.slice(0,3);if(p.energy==='easy')selected=selected.slice(0,3);const rebuild=()=>{const ss=[];for(let j=0;j<selected.length-1;j++)ss.push(makeSegment(selected[j],selected[j+1],p.transport,j,p.area));return ss};let segs=rebuild();let total=()=>selected.reduce((a,x)=>a+x.price,0)+segs.reduce((a,x)=>a+x.cost,0);while(total()>p.budget&&selected.length>2){let cut=selected.length-1;if(selected[cut].price===0&&selected.length>2)cut=selected.length-2;selected.splice(cut,1);segs=rebuild()}if(total()>p.budget){const cheap=pool.map(x=>({...x})).sort((a,b)=>a.price-b.price);selected=[cheap[0],cheap.find(x=>x.id!==cheap[0].id)].filter(Boolean);segs=rebuild()}let totalCost=total();let start=hmToMin(p.time),timeline=[],cursor=start;selected.forEach((pl,j)=>{timeline.push({time:minutesToHM(cursor),placeId:pl.id});cursor+=pl.dur;if(segs[j])cursor+=segs[j].durationMin});const travel=segs.reduce((a,x)=>a+x.durationMin,0),hours=(cursor-start)/60;const ret=makeReturn(selected[selected.length-1],p.returnTime,p.area);return {id:'pl_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,5),type:v.type,title:v.title,reason:v.reason,config:{date:p.date||today(),time:p.time,area:p.area,returnTime:p.returnTime,budget:p.budget,energy:p.energy,transport:p.transport},why:[`${p.area} 안에서 이동이 길어지지 않게 구성했어요.`,`2인 ${money(p.budget)} 예산을 기준으로 조합했어요.`,p.energy==='easy'?'오늘은 체류를 길게, 장소 수는 적게 잡았어요.':'식사·활동·휴식을 한쪽에 치우치지 않게 섞었어요.'],cover:selected[1]?.img||selected[0].img,places:selected,segments:segs,timeline,totalCost,travelMin:travel,totalHours:hours,return:ret,returnLeave:ret.leave}}
function makeSegment(from,to,mode,idx=0,area=state.planner.area){let m=mode==='auto'?(idx%3===0?'walk':idx%3===1?'public':'public'):mode;const seed=hash(from.id+to.id),dist=800+(seed%3600);if(m==='walk'&&dist>1800)m='public';if(m==='public'){const bus=seed%2===0;const d=14+(seed%18),cost=3100;return {mode:'public',durationMin:d,cost,distance:dist,summary:`대중교통 ${d}분 · 2인 ${money(cost)}`,steps:[{type:'walk',title:`${AREA[area].station} ${AREA[area].exit}까지 걷기`,to:`${AREA[area].station} ${AREA[area].exit}`,duration:5+(seed%4),address:`${area}역 인근`},bus?{type:'bus',title:`${2016+(seed%3)}번 버스`,line:String(2016+(seed%3)),from:`${area}역 정류장`,to:`${to.name} 인근`,stopId:'04'+String(120+seed%60),duration:9+(seed%7),stops:5+(seed%4),exit:'하차 후 횡단보도 방향',tip:'내리는 문 가까운 쪽 권장'}:{type:'subway',title:'지하철 이동',line:'2',from:AREA[area].station,to:`${to.name.split(' ')[0]} 인근역`,direction:'내선순환 · 신도림 방면',platform:'2번 승강장',duration:10+(seed%8),stops:4+(seed%4),exit:'3번 출구',tip:'빠른 하차 5-2칸'},{type:'walk',title:`출구에서 ${to.name}까지 걷기`,to:to.name,duration:4+(seed%5),address:to.address}]}}
 if(m==='taxi'){const d=10+(seed%12),base=7000+Math.round(dist*1.8);return {mode:'taxi',durationMin:d,cost:base,distance:dist,costLow:base-1000,costHigh:base+2500,traffic:seed%3===0?'약간 혼잡':'보통',summary:`택시 ${d}분 · 약 ${money(base)}`,steps:[]}}
 if(m==='car'){const d=11+(seed%13),fuel=Math.round((dist/1000/state.profile.car.eff)*state.profile.car.fuel),parking=3000+(seed%4)*1000;return {mode:'car',durationMin:d,cost:fuel+parking,distance:dist,fuelCost:fuel,parkingCost:parking,parkingName:`${to.name} 인근 공영주차장`,parkingAddress:to.address,walkAfter:3+(seed%4),spaces:8+(seed%15),summary:`자차 ${d}분 · 유류+주차 ${money(fuel+parking)}`,steps:[]}}
 const d=Math.max(4,Math.round(dist/75));return {mode:'walk',durationMin:d,cost:0,distance:dist,summary:`도보 ${d}분`,steps:[{type:'walk',title:`${to.name}까지 걷기`,to:to.name,duration:d,address:to.address}]}}
function makeReturn(last,returnTime,area){const base=hash(last.id)%12;const me=32+base,partner=38+(base%9);const leave=minutesToHM(hmToMin(returnTime)-Math.max(me,partner)-8);return {leave,me:{duration:me,lastTrain:'여유 31분',arrive:returnTime,summary:`${last.name} → 지하철 → 내 집`,steps:[{type:'walk',title:'가까운 역까지 걷기',detail:'도보 6분 · 430m'},{type:'subway',title:`${AREA[area].station}에서 이동`,detail:'막차 전 여유 31분 · 환승 1회'},{type:'walk',title:'역에서 집까지 걷기',detail:'도보 7분'}]},partner:{duration:partner,lastTrain:'여유 18분',arrive:returnTime,summary:`${last.name} → 버스 → 연인 집`,steps:[{type:'walk',title:'정류장까지 걷기',detail:'도보 5분 · 360m'},{type:'bus',title:'간선버스 이용',detail:'7정거장 · 막차 여유 18분'},{type:'walk',title:'정류장에서 집까지',detail:'도보 8분'}]}}}
function timelineHTML(p){return p.places.map((pl,i)=>`<div class="place-item"><div class="time-col">${p.timeline[i]?.time||''}</div><div class="place-main"><div class="place-photo"><img src="${pl.img}"></div><div class="place-name">${esc(pl.name)}</div><div class="place-address">${esc(pl.address)} · ${pl.cat} · 약 ${money(pl.price)}</div><div class="place-actions"><button class="smallbtn" onclick="copyText('${esc(pl.address)}')">주소 복사</button><button class="smallbtn" onclick="toast('장소 상세 목업을 열었어요')">장소 정보</button></div></div></div>${i<p.segments.length?`<div class="segment"><div class="segment-head"><div><b>${esc(p.segments[i].summary)}</b><span> · 다음 장소까지</span></div><button onclick="changeTransport('${p.id}',${i})">이동 바꾸기</button></div></div>`:''}`).join('')}
function findPlan(id){return state.plans.find(x=>x.id===id)||state.confirmed.map(x=>x.plan).find(x=>x?.id===id)||state.savedCandidates.map(x=>x.plan).find(x=>x?.id===id)}
function openPlan(id){state.selectedPlanId=id;save();navigate('course',{id})}
function saveCandidate(id){const p=findPlan(id);if(!state.savedCandidates.some(x=>x.planId===id))state.savedCandidates.push({planId:id,title:p.title,totalCost:p.totalCost,plan:structuredClone(p)});save();toast('고민 중 코스에 저장했어요')}
function confirmPlan(id){const p=findPlan(id);let c=state.confirmed.find(x=>x.planId===id);if(!c)state.confirmed.push({planId:id,date:p.config?.date||today(),time:p.config?.time||state.planner.time,plan:structuredClone(p),status:'confirmed'});save();render();toast('데이트를 확정했어요')}
function changeTransport(planId,segIndex){const p=findPlan(planId),s=p.segments[segIndex],app=document.getElementById('app');app.insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>이 구간만 바꾸기</h3><p>확정된 코스라면 실제 데이트 시작에도 그대로 반영돼요.</p>${['walk','public','taxi','car'].map(m=>`<button class="sheet-option ${s.mode===m?'on':''}" onclick="applyTransport('${planId}',${segIndex},'${m}')"><div><b>${transportLabel(m)}</b><span>${m==='taxi'?'호출은 외부 택시 앱에서':m==='car'?'주소·주차·내비 연결':'이동시간과 비용 재계산'}</span></div><div>›</div></button>`).join('')}</div></div>`)}
function applyTransport(planId,segIndex,m){let p=findPlan(planId);const ns=makeSegment(p.places[segIndex],p.places[segIndex+1],m,segIndex,p.config?.area||state.planner.area);p.segments[segIndex]=ns;recalcPlan(p);const c=state.confirmed.find(x=>x.planId===planId);if(c)c.plan=structuredClone(p);const sv=state.savedCandidates.find(x=>x.planId===planId);if(sv)sv.plan=structuredClone(p);save();document.querySelector('.sheet-wrap')?.remove();render();toast(`${transportLabel(m)}으로 바꿨어요`)}
function recalcPlan(p){const cfg=p.config||state.planner;p.totalCost=p.places.reduce((a,x)=>a+x.price,0)+p.segments.reduce((a,x)=>a+x.cost,0);p.travelMin=p.segments.reduce((a,x)=>a+x.durationMin,0);let cursor=hmToMin(cfg.time),start=cursor;p.timeline=[];p.places.forEach((pl,i)=>{p.timeline.push({time:minutesToHM(cursor),placeId:pl.id});cursor+=pl.dur;if(p.segments[i])cursor+=p.segments[i].durationMin});p.totalHours=(cursor-start)/60;p.return=makeReturn(p.places.at(-1),cfg.returnTime,cfg.area);p.returnLeave=p.return.leave}
function makeFirstSegment(p,mode){const first=p.places[0],area=p.config?.area||state.planner.area,origin={id:'current_'+hash(p.id+area),name:'현재 위치',address:'현재 위치 기준'};const seg=makeSegment(origin,first,mode||'auto',-1,area);if(seg.mode==='public'&&seg.steps?.length){seg.steps[0]={...seg.steps[0],title:'현재 위치에서 가까운 역·정류장까지 걷기',from:'현재 위치',address:'현재 위치 기준'};const mid=seg.steps.find(x=>x.type==='bus'||x.type==='subway');if(mid)mid.from=mid.from||`${area} 인근 정류장`;seg.steps[seg.steps.length-1]={...seg.steps[seg.steps.length-1],title:`하차 후 ${first.name}까지 걷기`,to:first.name,address:first.address}}if(seg.mode==='walk'&&seg.steps?.[0])seg.steps[0]={...seg.steps[0],title:`현재 위치에서 ${first.name}까지 걷기`,to:first.name,address:first.address};seg.summary=`현재 위치 → ${first.name} · ${seg.summary}`;return seg}
function startLive(planId){const p=findPlan(planId),existing=state.live&&state.live.planId===planId&&state.live.status!=='ended';if(existing){navigate('live');return}const firstSegment=makeFirstSegment(p,p.config?.transport||'auto');state.live={planId,title:p.title,status:'active',stage:'to_first',placeIndex:0,segmentIndex:-1,currentStep:0,startedAt:Date.now(),currentLabel:p.places[0].name,firstSegment};save();navigate('live')}
function resumeLive(){navigate('live')}
function liveAt(p,L){const pl=p.places[L.placeIndex],next=p.places[L.placeIndex+1];return `<div class="live-head"><div><div class="live-title">데이트 진행 중</div><div class="live-status">현재 ${esc(pl.name)}</div></div><button class="iconbtn" onclick="liveExitSheet()">${icon('more')}</button></div><div class="progress"><i style="width:${Math.round((L.placeIndex/p.places.length)*100)}%"></i></div><div class="live-card"><div class="live-kicker">지금</div><h2>${esc(pl.name)}</h2><p>현재 일정 · ${esc(pl.cat)}</p><div class="live-bigtime">${pl.dur}분</div><p>추천 체류시간. 실제로 더 오래 있어도 다음 일정이 무너지지 않는지 계속 계산해요.</p>${next?`<div class="next-address"><div class="lab">다음 목적지 주소 · 출발 전에 미리 확인</div><b>${esc(next.name)}</b><p>${esc(next.address)}</p><div class="address-actions"><button onclick="copyText('${esc(next.address)}')">주소 복사</button><button onclick="openMapApp('kakao','${esc(next.address)}')">지도에서 보기</button></div></div>`:''}</div>${next?`<div class="section compact"><button class="primary" onclick="departNext()">다음 장소로 출발</button></div>`:`<div class="section compact"><button class="primary" onclick="finishDate()">데이트 마무리</button></div>`}`}
function liveMoving(p,L,s){const first=L.stage==='to_first'||L.segmentIndex<0,dest=first?p.places[0]:p.places[L.segmentIndex+1],pct=first?3:Math.round(((L.segmentIndex+.45)/p.places.length)*100);return `<div class="live-head"><div><div class="live-title">${first?'첫 장소로 이동 중':transportLabel(s.mode)+' 이동 중'}</div><div class="live-status">${esc(dest.name)}로 가는 중</div></div><button class="iconbtn" onclick="liveExitSheet()">${icon('more')}</button></div><div class="progress"><i style="width:${pct}%"></i></div><div class="live-card"><div class="route-summary"><div><div class="live-kicker">${first?'데이트 시작 지점':'최종 목적지'}</div><strong>${esc(dest.name)}</strong><em>${esc(dest.address)}</em></div><button class="smallbtn" onclick="copyText('${esc(dest.address)}')">복사</button></div>${first?`<div class="field-note" style="margin:10px 0 2px">현재 위치에서 첫 코스까지 이동하는 구간이에요. 실제 서비스에서는 GPS 기준으로 경로를 계속 다시 계산해요.</div>`:''}<div class="next-address"><div class="lab">목적지 주소 · 이동 중에도 계속 확인 가능</div><b>${esc(dest.address)}</b><div class="address-actions"><button onclick="copyText('${esc(dest.address)}')">주소 복사</button><button onclick="openMapApp('kakao','${esc(dest.address)}')">지도 앱</button></div></div><div style="margin-top:10px"><div class="route-summary"><strong>${esc(s.summary)}</strong><button class="smallbtn" onclick="changeLiveTransport()">지금 바꾸기</button></div>${segmentStepsHTML(p,L,s)}</div></div><div class="section compact"><button class="primary" onclick="arriveNext()">${first?'첫 장소에 도착했어요':'목적지에 도착했어요'}</button></div>`}
function segmentStepsHTML(p,L,s){const dest=(L.stage==='to_first'||L.segmentIndex<0)?p.places[0]:p.places[L.segmentIndex+1];if(s.mode==='public')return s.steps.map((st,i)=>`<button class="route-step ${i===L.currentStep?'active':''}" style="width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left" onclick="openStep('${p.id}',${L.segmentIndex},${i})"><div class="step-num">${i+1}</div><div><b>${esc(st.type==='bus'?`${st.from}에서 ${st.line}번`:st.type==='subway'?`${st.from} · ${st.lineName||st.line}`:st.title)}</b>${st.type==='walk'?`<span class="transit-mini">${st.duration}분 · 누르면 실시간 도보 길찾기</span>`:st.type==='bus'?`<span class="transit-mini">${esc(st.direction)} · ${esc((st.routes||[st.line]).join(' · '))} 탑승 가능 · ${st.stops}정거장 → ${esc(st.to)}</span>`:`<span class="transit-mini">${esc(st.direction)} · ${esc(st.platform)} · ${st.stops}정거장 → ${esc(st.to)} · ${esc(st.exit)}</span>`}</div><div class="chev">›</div></button>`).join('');if(s.mode==='taxi')return `<button class="route-step active" style="width:100%;border:0;background:none;text-align:left" onclick="navigate('taxi',{planId:'${p.id}',segIndex:${L.segmentIndex}})"><div class="step-num">1</div><div><b>택시 호출·경로 상세</b><p>예상요금, 소요시간, 목적지 주소, 외부 호출 앱</p></div><div class="chev">›</div></button>`;if(s.mode==='car')return `<button class="route-step active" style="width:100%;border:0;background:none;text-align:left" onclick="navigate('car',{planId:'${p.id}',segIndex:${L.segmentIndex}})"><div class="step-num">1</div><div><b>자차 길찾기 상세</b><p>목적지 주소, 유류비, 주차, 지도앱 연결</p></div><div class="chev">›</div></button>`;return `<button class="route-step active" style="width:100%;border:0;background:none;text-align:left" onclick="navigate('walkNav',{planId:'${p.id}',segIndex:${L.segmentIndex},stepIndex:0})"><div class="step-num">1</div><div><b>${esc(dest.name)}까지 걷기</b><p>${s.durationMin}분 · 실시간 도보 길찾기</p></div><div class="chev">›</div></button>`}
function departNext(){const p=findPlan(state.live.planId);if(state.live.placeIndex>=p.places.length-1)return;state.live.stage='moving';state.live.segmentIndex=state.live.placeIndex;state.live.currentStep=0;state.live.currentLabel=p.places[state.live.placeIndex+1].name;save();render()}
function arriveNext(){const p=findPlan(state.live.planId);if(state.live.stage==='to_first'||state.live.segmentIndex<0){state.live.placeIndex=0;state.live.segmentIndex=0;state.live.stage='at';state.live.currentStep=0;state.live.currentLabel=p.places[0].name;save();render();toast('첫 코스를 시작해요');return}state.live.placeIndex=Math.min(p.places.length-1,state.live.segmentIndex+1);state.live.stage='at';state.live.currentStep=0;state.live.currentLabel=p.places[state.live.placeIndex].name;save();render()}
function changeFirstTransport(){const p=findPlan(state.live.planId),s=state.live.firstSegment||makeFirstSegment(p,p.config?.transport||'auto'),app=document.getElementById('app');app.insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>첫 장소까지 어떻게 갈까요?</h3><p>현재 위치에서 첫 코스까지의 이동수단만 바꿔요.</p>${['walk','public','taxi','car'].map(m=>`<button class="sheet-option ${s.mode===m?'on':''}" onclick="applyFirstTransport('${m}')"><div><b>${transportLabel(m)}</b><span>${m==='taxi'?'호출은 외부 택시 앱에서':m==='car'?'주소·주차·내비 연결':'현재 위치 기준 경로 다시 계산'}</span></div><div>›</div></button>`).join('')}</div></div>`)}
function applyFirstTransport(m){const p=findPlan(state.live.planId);state.live.firstSegment=makeFirstSegment(p,m);state.live.currentStep=0;save();document.querySelector('.sheet-wrap')?.remove();render();toast(`첫 이동을 ${transportLabel(m)}으로 바꿨어요`)}
function changeLiveTransport(){if(state.live.stage==='to_first'||state.live.segmentIndex<0){changeFirstTransport();return}changeTransport(state.live.planId,state.live.segmentIndex)}
function liveExitSheet(){const app=document.getElementById('app');app.insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>데이트를 잠시 나갈까요?</h3><p>잠시 나가면 현재 장소·이동 단계·바꾼 교통수단을 그대로 저장합니다.</p><button class="sheet-option" onclick="pauseLive()"><div><b>잠시 나가기</b><span>홈에서 “이어서 하기”로 복귀</span></div><div>›</div></button><button class="sheet-option" onclick="document.querySelector('.sheet-wrap').remove()"><div><b>계속 진행</b><span>지금 화면 유지</span></div><div>›</div></button><button class="sheet-option" onclick="cancelLive()"><div><b style="color:#b33847">데이트 종료</b><span>진행 기록을 정리하고 종료</span></div><div>›</div></button></div></div>`)}
function pauseLive(){save();switchTab('home');toast('진행 상태를 저장했어요')}
function cancelLive(){state.live.status='ended';save();switchTab('home');toast('데이트 진행을 종료했어요')}
function finishDate(){const p=findPlan(state.live.planId);state.records.unshift({id:'r_'+Date.now(),date:p.config?.date||today(),title:p.title,cost:p.totalCost,hours:p.totalHours,rating:4.8,photos:0,places:p.places.map(x=>x.cat),memo:'오늘 데이트가 자동으로 기록됐어요.'});state.live.status='ended';save();switchTab('home');toast('오늘 데이트를 기록했어요')}
function openStep(planId,segIndex,stepIndex){const ctx=getSegmentContext(planId,segIndex),st=ctx?.segment?.steps?.[stepIndex];if(!st){toast('이동 단계를 찾지 못했어요');return}if(st.type==='walk')navigate('walkNav',{planId,segIndex,stepIndex});else navigate('transit',{planId,segIndex,stepIndex})}
function getSegmentContext(planId,segIndex,returnWho){const p=findPlan(planId);if(returnWho||!p)return null;if(Number(segIndex)<0){const live=state.live&&state.live.planId===planId?state.live:null;return {plan:p,segment:live?.firstSegment||makeFirstSegment(p,p.config?.transport||'auto'),destination:p.places[0],origin:{name:'현재 위치',address:'현재 위치 기준'}}}return {plan:p,segment:p.segments[segIndex],destination:p.places[Number(segIndex)+1]}}
function openReturnStep(planId,who,i){const p=findPlan(planId),r=p.return[who],s=r.steps[i];if(s.type==='walk'){const fake={mode:'walk',durationMin:parseInt(s.detail)||6,cost:0,steps:[{type:'walk',title:s.title,to:s.title,duration:parseInt(s.detail)||6,address:'귀가 경로'}]};const tempId='ret_'+planId+'_'+who;state._tempReturn={id:tempId,segment:fake,destination:{name:s.title,address:'귀가 경로'}};save();navigate('returnWalk',{planId,who,i})}else navigate('returnTransit',{planId,who,i})}
routes.returnWalk=({planId,who,i})=>{const p=findPlan(planId),s=p.return[who].steps[i];return `${pagebar('귀가 도보')}<div class="map">${mapSVG('walk')}<div class="map-ui"><div class="map-pill">현재 위치 추적 중</div><div class="map-pill">${parseInt(s.detail)||6}분</div></div><div class="map-bottom"><strong>${esc(s.title)}</strong><p>${esc(s.detail)}</p></div></div><div class="nav-instruction"><div class="instruction-main">120m 직진</div><div class="instruction-sub">현재 위치 기준 귀가 경로를 계속 갱신합니다.</div></div>`}
routes.returnTransit=({planId,who,i})=>{const p=findPlan(planId),s=p.return[who].steps[i],area=p.config?.area||state.planner.area,seed=hash(planId+who+i),bus=s.type==='bus',mock=v27TransitProfile(area,{name:who==='me'?'내 집':'연인 집'},seed,!bus);return `${pagebar('귀가 대중교통')}<div class="section compact"><div class="transit-hero"><div class="transit-route-title"><div class="line-dot">${bus?'BUS':esc(mock.line||'철')}</div><div><h2>${bus?esc(mock.from):`${esc(mock.from)} · ${esc(mock.lineName)}`}</h2><p>${esc(mock.direction)} · ${bus?esc(mock.line)+'번':esc(mock.platform)}</p></div></div><div class="transit-guide">${bus?`<div class="transit-guide-row"><div class="k">타는 정류장</div><div class="v">${esc(mock.from)}<small>정류장 번호 ${esc(mock.stopId)}</small></div></div><div class="transit-guide-row"><div class="k">가능 노선</div><div class="v"><div class="bus-options">${mock.routes.map((n,j)=>`<span class="bus-option ${j===0?'recommended':''}">${esc(n)}${j===0?' · 추천':''}</span>`).join('')}</div></div></div><div class="transit-guide-row"><div class="k">내리는 곳</div><div class="v">${who==='me'?esc(state.profile.homeMe):esc(state.profile.homePartner)}<small>${mock.stops}정거장 · ${mock.duration}분</small></div></div>`:`<div class="transit-guide-row"><div class="k">타는 역</div><div class="v">${esc(mock.from)} · ${esc(mock.lineName)}<small>${esc(mock.platform)}</small></div></div><div class="transit-guide-row"><div class="k">방향</div><div class="v">${esc(mock.direction)}<small>${esc(mock.trainFor)}</small></div></div><div class="transit-guide-row"><div class="k">하차</div><div class="v">${who==='me'?esc(state.profile.homeMe):esc(state.profile.homePartner)}<small>${mock.stops}정거장 · ${esc(mock.exit)}</small></div></div>`}</div><div class="transit-arrivals"><div class="transit-arrival"><div><b>가장 빠른 ${bus?'버스':'열차'}</b><p id="vehicleLoc">${esc(mock.vehicleLoc)} · ${esc(mock.crowd)}</p></div><div class="countdown" data-countdown="${mock.arrivalSec}">도착 계산 중</div></div><div class="transit-arrival"><div><b>다음 ${bus?'버스':'열차'}</b><p>${esc(mock.nextVehicleLoc)}</p></div><div class="countdown" data-countdown="${mock.nextArrivalSec}">도착 계산 중</div></div></div><div class="transit-note">실제 서비스에서는 현재 위치와 막차 시간까지 포함해 귀가 경로를 다시 계산합니다.</div></div></div>`}
function changeTaste(){state.taste.choice=state.taste.choice==='quiet'?'rooftop':'quiet';save();render();toast('오늘 선택을 바꿨어요')}
function chooseTaste(v){if(state.taste.choice){toast('이미 선택했어요. 아래 “선택 변경”을 이용해주세요.');return}state.taste.choice=v;save();render()}
function saveQuestion(){const v=document.getElementById('qAnswer').value.trim();if(!v){toast('답변을 적어주세요');return}state.question.my=v;save();render()}
function editQuestion(){state.question.my=null;save();render()}
function chooseBalance(v){if(state.balance.my)return;state.balance.my=v;save();render()}
function addRecord(){const d=document.getElementById('recDate').value,t=document.getElementById('recTitle').value.trim(),c=Math.max(0,Number(document.getElementById('recCost').value)||0),ph=Math.max(0,Number(document.getElementById('recPhotos').value)||0),m=document.getElementById('recMemo').value.trim();if(!d||!t){toast('날짜와 제목을 확인해주세요');return}state.records.unshift({id:'r_'+Date.now(),date:d,title:t,cost:c,hours:4,rating:4.8,photos:ph,places:['직접 기록'],memo:m||'기억하고 싶은 데이트'});save();goBack();toast('기록을 추가했어요')}
function likePost(id){const p=state.posts.find(x=>x.id===id),i=state.likedPosts.indexOf(id);if(i>=0){state.likedPosts.splice(i,1);p.likes=Math.max(0,p.likes-1)}else{state.likedPosts.push(id);p.likes++}save();render()}
function addComment(id){const v=document.getElementById('commentText').value.trim();if(!v)return;state.posts.find(x=>x.id===id).comments.push({who:`${relationship()} · ${state.profile.region}`,text:v});save();render()}
function submitPost(){const t=document.getElementById('postTitle').value.trim(),b=document.getElementById('postBody').value.trim();if(!t||!b){toast('제목과 내용을 적어주세요');return}state.posts.unshift({id:'p_'+Date.now(),cat:document.getElementById('postCat').value,badge:relationship(),region:state.profile.region,title:t,body:b,likes:0,comments:[]});save();switchTab('lounge');toast('라운지에 글을 올렸어요')}
function saveProfile(){state.profile.me=document.getElementById('pfMe').value.trim()||state.profile.me;state.profile.partner=document.getElementById('pfPartner').value.trim()||state.profile.partner;state.profile.coupleStart=document.getElementById('pfStart').value||state.profile.coupleStart;state.profile.homeMe=document.getElementById('pfHomeMe').value.trim()||state.profile.homeMe;state.profile.homePartner=document.getElementById('pfHomePartner').value.trim()||state.profile.homePartner;state.profile.budget=Math.max(0,Number(document.getElementById('pfBudget').value)||state.profile.budget);state.profile.returnTime=document.getElementById('pfReturn').value||state.profile.returnTime;state.planner.budget=state.profile.budget;state.planner.returnTime=state.profile.returnTime;save();goBack();toast('설정을 저장했어요')}
function regenerate(){generatePlans();render();toast('다른 조합으로 다시 골랐어요')}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast('주소를 복사했어요')).catch(()=>toast('복사할 주소: '+t))}
function openMapApp(type,address){const q=encodeURIComponent(address);const urls={kakao:`https://map.kakao.com/?q=${q}`,naver:`https://map.naver.com/v5/search/${q}`,tmap:`https://www.tmap.co.kr/search?searchKeyword=${q}`};window.open(urls[type]||urls.kakao,'_blank')}
function openTaxiApp(type,address){copyText(address);setTimeout(()=>openMapApp('kakao',address),150)}
function mapSVG(kind){return `<svg viewBox="0 0 450 315" preserveAspectRatio="none"><rect width="450" height="315" fill="#ebe7e0"/><g stroke="#d8d2ca" stroke-width="13" fill="none"><path d="M-20 75 C90 20 170 125 280 70 S430 80 480 30"/><path d="M40 330 C70 230 155 235 220 165 S330 65 470 120"/><path d="M-20 210 C80 180 115 250 205 225 S330 170 470 210"/></g><g stroke="#fff" stroke-width="8" fill="none"><path d="M-20 75 C90 20 170 125 280 70 S430 80 480 30"/><path d="M40 330 C70 230 155 235 220 165 S330 65 470 120"/><path d="M-20 210 C80 180 115 250 205 225 S330 170 470 210"/></g><path d="M65 250 C115 205 145 240 205 192 S300 110 370 85" stroke="${kind==='car'?'#4b67c8':'#ff5f73'}" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="10 7"/><circle id="userDot" cx="80" cy="238" r="10" fill="#fff" stroke="#2676ff" stroke-width="5"/><circle cx="370" cy="85" r="11" fill="#171614"/><circle cx="370" cy="85" r="4" fill="#fff"/></svg>`}
function afterRender(route,params){if(route==='walkNav'||route==='returnWalk'){let sec=0;const id=setInterval(()=>{sec++;const dot=document.getElementById('userDot');if(dot){const x=80+Math.min(250,sec*3.5),y=238-Math.min(140,sec*2);dot.setAttribute('cx',x);dot.setAttribute('cy',y)}const remain=Math.max(60,420-sec*6),dist=document.getElementById('walkDist'),wt=document.getElementById('walkTime'),wr=document.getElementById('walkRemain'),ins=document.getElementById('walkInstruction');if(dist)dist.textContent=remain+'m';if(wt)wt.textContent=Math.max(1,Math.ceil(remain/75))+'분';if(wr)wr.textContent=Math.max(1,Math.ceil(remain/75))+'분 남음';if(ins)ins.textContent=sec<12?'80m 직진 후 오른쪽':sec<26?'50m 앞 횡단보도 건너기':'목적지가 오른쪽에 있어요';},1000);timers.push(id)}if(route==='transit'||route==='returnTransit'){let locSec=0;const locId=setInterval(()=>{locSec++;const v=document.getElementById('vehicleLoc');if(v){v.textContent=locSec<20?'현재 2정거장 전 · 이동 중':locSec<40?'현재 1정거장 전 · 곧 진입':'현재 역 접근 중'}} ,1000);timers.push(locId);document.querySelectorAll('[data-countdown]').forEach(el=>{let n=Number(el.dataset.countdown);const tick=()=>{n=Math.max(0,n-1);el.textContent=`${Math.floor(n/60)}분 ${String(n%60).padStart(2,'0')}초`;if(n===0)el.textContent='곧 도착'};const id=setInterval(tick,1000);timers.push(id)})}}

  const hadOld=!!localStorage.getItem('moment_v11')||!!localStorage.getItem('moment_v13');
  state.v13={onboarded:hadOld,onboardingStep:0,lastRecordId:null,...(state.v13||{})};
  state.placeFeedback=state.placeFeedback||{};state.hiddenPosts=state.hiddenPosts||[];state.reportedPosts=state.reportedPosts||[];

function monthKey(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit'}).format(new Date())}
function monthLabel(){return Number(monthKey().slice(5))+'월'}
function dailyType(){const d=new Date(today()+'T12:00:00');return ['taste','question','balance'][(d.getDate()+d.getMonth())%3]}
function dailyInfo(){const t=dailyType();if(t==='taste')return {type:t,kicker:'오늘의 10초',title:state.taste.choice?'오늘 취향을 골랐어요':'오늘 더 끌리는 분위기는?',desc:state.taste.choice?'이 선택은 다음 데이트 코스의 분위기에 반영돼요.':'두 사진 중 하나만 고르면 돼요. 10초면 충분해요.',route:'taste'};if(t==='question')return {type:t,kicker:'오늘의 질문',title:'처음 만났을 때 내 첫인상은?',desc:state.question.my?'내 답변을 저장했어요. 연인의 답을 기다리는 중이에요.':'둘 다 답하면 서로의 답이 공개돼요.',route:'question'};return {type:t,kicker:'오늘의 밸런스',title:'여행은 자주 짧게 vs 몰아서 길게',desc:state.balance.my?'둘의 선택 결과를 확인해보세요.':'내 선택 전에는 연인의 답이 보이지 않아요.',route:'balance'}}
function wishlistCats(){const out=new Set();state.wishlist.forEach(w=>{const s=(w.name+' '+(w.area||'')).toLowerCase();if(s.includes('공방')||s.includes('체험'))out.add('체험');if(s.includes('한강')||s.includes('피크닉')||s.includes('산책'))out.add('산책');if(s.includes('야경')||s.includes('드라이브'))out.add('산책');if(s.includes('카페'))out.add('카페');if(s.includes('전시'))out.add('전시')});return out}
function visitedCatCount(cat){return state.records.reduce((n,r)=>n+(r.places||[]).filter(x=>String(x).includes(cat)).length,0)}
function feedbackBlocks(pl){const f=state.placeFeedback[pl.id];if(!f)return false;if(['취향 아님','다시는 안 가고 싶어요','이미 가봤어요'].includes(f.reason))return true;if(f.reason==='오늘은 아니에요'&&f.date===today())return true;return false}
function prefScore(pl,type){let sc=0;const wc=wishlistCats();if(wc.has(pl.cat))sc+=5;if(state.taste.choice==='quiet'&&pl.cat==='카페')sc+=3;if(state.taste.choice==='rooftop'&&(pl.cat==='산책'||pl.cat==='저녁'))sc+=2;sc-=Math.min(3,visitedCatCount(pl.cat));const f=state.placeFeedback[pl.id];if(f?.reason==='너무 비싸요')sc-=3;if(f?.reason==='멀어요')sc-=2;if(type==='value')sc+=Math.max(0,5-pl.price/15000);if(type==='new')sc+=Math.max(0,4-visitedCatCount(pl.cat))*1.5+(pl.cat==='체험'||pl.cat==='전시'?2:0);return sc}
function combos(arr,k){const out=[];function rec(path,used){if(path.length===k){out.push(path.slice());return}for(let i=0;i<arr.length;i++){if(used.has(i))continue;used.add(i);path.push(arr[i]);rec(path,used);path.pop();used.delete(i)}}rec([],new Set());return out}
function buildPlan(v,i,p,pool){
  const usable=pool.filter(x=>!feedbackBlocks(x));const source=usable.length>=2?usable:pool.slice();
  const lens=p.duration<=3?[2,3]:p.energy==='easy'?[2,3]:[3,4,2];let best=null;
  for(const len of lens){for(const seq0 of combos(source,Math.min(len,source.length))){const seq=seq0.map(x=>({...x}));const segs=[];for(let j=0;j<seq.length-1;j++)segs.push(makeSegment(seq[j],seq[j+1],p.transport,j,p.area));const cost=seq.reduce((a,x)=>a+x.price,0)+segs.reduce((a,x)=>a+x.cost,0);const mins=seq.reduce((a,x)=>a+x.dur,0)+segs.reduce((a,x)=>a+x.durationMin,0);if(cost>p.budget||mins>p.duration*60)continue;const ret=makeReturn(seq.at(-1),p.returnTime,p.area);const start=hmToMin(p.time),end=start+mins,leave=hmToMin(ret.leave);if(leave>=start&&end>leave)continue;const variety=new Set(seq.map(x=>x.cat)).size*2;const mealBonus=seq.some(x=>['식사','브런치','저녁'].includes(x.cat))?3:0;const pref=seq.reduce((a,x)=>a+prefScore(x,v.type),0);const travel=segs.reduce((a,x)=>a+x.durationMin,0);let score=pref+variety+mealBonus-travel*.05;if(v.type==='value')score+=(p.budget-cost)/12000;if(v.type==='new')score+=seq.reduce((a,x)=>a+(x.cat==='체험'||x.cat==='전시'?2:0),0);if(!best||score>best.score)best={seq,segs,cost,mins,ret,score}}}
  if(!best){const seq=source.slice().sort((a,b)=>a.price-b.price).slice(0,2).map(x=>({...x})),segs=seq.length>1?[makeSegment(seq[0],seq[1],p.transport,0,p.area)]:[];best={seq,segs,cost:seq.reduce((a,x)=>a+x.price,0)+segs.reduce((a,x)=>a+x.cost,0),mins:seq.reduce((a,x)=>a+x.dur,0)+segs.reduce((a,x)=>a+x.durationMin,0),ret:makeReturn(seq.at(-1),p.returnTime,p.area),score:0}}
  const selected=best.seq,segs=best.segs;let cursor=hmToMin(p.time),timeline=[];selected.forEach((pl,j)=>{timeline.push({time:minutesToHM(cursor),placeId:pl.id});cursor+=pl.dur;if(segs[j])cursor+=segs[j].durationMin});const wc=wishlistCats();const wishlistHit=selected.find(x=>wc.has(x.cat));const why=[wishlistHit?`둘이 저장해둔 장소 취향(${wishlistHit.cat})을 코스에 반영했어요.`:`최근 둘의 선택과 방문 기록을 기준으로 장소를 골랐어요.`,`2인 ${money(p.budget)} 안에서 이동비까지 포함했어요.`,p.energy==='easy'?'오늘은 장소 수를 줄이고 한 곳에서 오래 머물게 했어요.':'식사·활동·휴식이 한쪽에 몰리지 않게 구성했어요.'];
  const titles={best:`${p.area}, 이대로 가면 돼요`,value:'비용은 줄이고 동선은 그대로',new:'평소와 한 번 다르게'};const reasons={best:'둘의 최근 선택과 이동 부담을 함께 보고 가장 무난한 한 코스로 골랐어요.',value:'무료·저비용 장소를 섞어서 전체 비용을 낮췄어요.',new:'최근에 덜 해본 체험과 전시 비중을 높였어요.'};
  return {id:'pl_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,6),type:v.type,title:titles[v.type],reason:reasons[v.type],config:{date:p.date||today(),time:p.time,area:p.area,returnTime:p.returnTime,budget:p.budget,energy:p.energy,transport:p.transport},why,cover:selected[1]?.img||selected[0]?.img||IMG.hero,places:selected,segments:segs,timeline,totalCost:best.cost,travelMin:segs.reduce((a,x)=>a+x.durationMin,0),totalHours:best.mins/60,return:best.ret,returnLeave:best.ret.leave}
}
function generatePlans(){const p=state.planner,a=AREA[p.area],pool=a.pool.slice();const variants=[{type:'best'},{type:'value'},{type:'new'}];state.plans=variants.map((v,i)=>buildPlan(v,i,p,pool));state.selectedPlanId=state.plans[0].id;save()}

routes.results=()=>{const best=state.plans[0],alts=state.plans.slice(1);if(!best)return `${pagebar('추천 코스')}<div class="section">추천을 다시 만들어주세요.</div>`;return `${pagebar('오늘의 코스',`<button class="iconbtn" onclick="regenerate()">↻</button>`)}<div class="section compact"><div class="eyebrow">가장 잘 맞는 한 코스</div><h1 style="font-size:31px;letter-spacing:-1.1px;margin:5px 0 7px">고민 줄이려고<br>하나를 먼저 골랐어요.</h1><div class="section-sub">마음에 들면 그대로 가고, 아니면 아래 두 가지만 비교해보세요.</div></div><div class="best-result"><div class="photo"><img src="${best.cover}"><div class="pill">추천 1순위</div></div><h1>${esc(best.title)}</h1><div class="reason">${esc(best.reason)}</div><div class="best-meta"><span class="meta-pill">${best.totalHours.toFixed(1)}시간</span><span class="meta-pill">2인 ${money(best.totalCost)}</span><span class="meta-pill">이동 ${best.travelMin}분</span></div><div class="best-actions"><button class="ghost" onclick="openPlan('${best.id}')">먼저 보기</button><button class="go" onclick="confirmAndOpen('${best.id}')">이 코스로 할게</button></div><div class="alt-list"><div class="row-between"><b style="font-size:16px">다른 선택</b><button class="textbtn" onclick="regenerate()">다시 추천</button></div>${alts.map((p,i)=>`<button class="alt-row" onclick="openPlan('${p.id}')"><img src="${p.cover}"><div><div class="tag">${i===0?'더 저렴하게':'조금 더 특별하게'}</div><b>${esc(p.title)}</b><p>${money(p.totalCost)} · ${p.totalHours.toFixed(1)}시간 · 이동 ${p.travelMin}분</p></div><div class="chev">›</div></button>`).join('')}</div></div>`}
function reservationText(pl){if(pl.cat==='체험'||pl.cat==='전시')return '예약 권장';if(['식사','브런치','저녁'].includes(pl.cat))return '주말 대기 가능';return '바로 방문 가능'}
function inWishlist(pl){return state.wishlist.some(w=>w.sourceId===pl.id||w.name===pl.name)}
function timelineHTML(p){return p.places.map((pl,i)=>{const fb=state.placeFeedback[pl.id];return `<div class="place-item"><div class="time-col">${p.timeline[i]?.time||''}</div><div class="place-main"><div class="place-photo"><img src="${pl.img}"></div><div class="place-name">${esc(pl.name)}</div><div class="place-address">${esc(pl.address)}</div><div class="feedback-tag">${esc(pl.cat)} · ${reservationText(pl)} · 약 ${money(pl.price)}</div>${fb?`<div class="feedback-tag">다음 추천: ${esc(fb.reason)}</div>`:''}<div class="place-actions"><button class="smallbtn" onclick="copyText('${esc(pl.address)}')">주소 복사</button><button class="text-action" onclick="toggleWishlistPlace('${p.id}','${pl.id}')">${inWishlist(pl)?'저장됨 ✓':'위시리스트 저장'}</button><button class="text-action" onclick="openPlaceFeedback('${p.id}','${pl.id}')">별로예요</button></div></div></div>${i<p.segments.length?`<div class="segment"><div class="segment-head"><div><b>${esc(p.segments[i].summary)}</b><span> · 다음 장소까지</span></div><button onclick="changeTransport('${p.id}',${i})">이동 바꾸기</button></div></div>`:''}`}).join('')}
function toggleWishlistPlace(planId,placeId){const p=findPlan(planId),pl=p?.places.find(x=>x.id===placeId);if(!pl)return;const i=state.wishlist.findIndex(w=>w.sourceId===placeId||w.name===pl.name);if(i>=0){state.wishlist.splice(i,1);toast('위시리스트에서 뺐어요')}else{state.wishlist.unshift({id:'w_'+Date.now(),sourceId:pl.id,name:pl.name,area:p.config?.area||'',cat:pl.cat,img:pl.img});toast('다음 추천에 반영할게요')}save();render()}
function openPlaceFeedback(planId,placeId){const p=findPlan(planId),pl=p?.places.find(x=>x.id===placeId);if(!pl)return;const app=document.getElementById('app');app.insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>${esc(pl.name)}이 별로인 이유</h3><p>하나만 알려주면 다음 추천에서 바로 반영해요.</p>${['너무 비싸요','멀어요','이미 가봤어요','취향 아님','오늘은 아니에요','다시는 안 가고 싶어요'].map(r=>`<button class="sheet-option" onclick="setPlaceFeedback('${placeId}','${r}')"><div><b>${r}</b><span>${r==='오늘은 아니에요'?'오늘 코스에서만 낮춰요':'다음 추천에도 반영해요'}</span></div><div>›</div></button>`).join('')}</div></div>`)}
function setPlaceFeedback(placeId,reason){state.placeFeedback[placeId]={reason,date:today()};save();document.querySelector('.sheet-wrap')?.remove();render();toast('다음 추천에 반영했어요')}
routes.wishlist=()=>`${pagebar('위시리스트')}<div class="section compact"><h1 style="font-size:29px;letter-spacing:-1px;margin:2px 0 6px">둘이 저장한 곳</h1><div class="section-sub">저장된 장소의 분위기와 카테고리를 다음 추천에서 우선 참고해요.</div>${state.wishlist.map(w=>`<div class="result-card" style="margin-top:24px"><div class="result-img" style="height:190px"><img src="${w.img}"></div><div class="result-body"><div class="result-title">${esc(w.name)}</div><div class="result-reason">${esc(w.area||'저장한 장소')} · 추천 학습 중</div></div></div>`).join('')}</div>`

function postMenu(id){const app=document.getElementById('app');app.insertAdjacentHTML('beforeend',`<div class="sheet-wrap" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h3>이 글</h3><p>커뮤니티 경험을 직접 조절할 수 있어요.</p><button class="sheet-option" onclick="hidePost('${id}')"><div><b>이 글 숨기기</b><span>내 라운지에서만 보이지 않아요.</span></div><div>›</div></button><button class="sheet-option" onclick="reportPost('${id}')"><div><b style="color:#b33847">신고하고 숨기기</b><span>검토 대상으로 표시하고 즉시 숨겨요.</span></div><div>›</div></button></div></div>`)}
routes.lounge=()=>{const cats=['전체','데이트 추천','연애 고민','선물·기념일','맛집·장소','장거리'],visible=state.posts.filter(p=>!state.hiddenPosts.includes(p.id)),posts=state.communityCategory==='전체'?visible:visible.filter(p=>p.cat===state.communityCategory);return `<div class="lounge-top"><h1>라운지</h1><p>데이트 없는 날에도 가볍게 읽고, 필요한 건 우리 위시리스트로 가져와요.</p></div><div class="lounge-rule">라운지에는 이름·정확한 기념일·실시간 위치가 노출되지 않아요. <b>${relationship()} · ${state.profile.region}</b> 정도만 익명 칭호로 보여요.</div><div class="category-scroll">${cats.map(x=>`<button class="chip ${state.communityCategory===x?'on':''}" onclick="state.communityCategory='${x}';save();render()">${x}</button>`).join('')}</div>${posts.length?posts.map(p=>postHTML(p)).join(''):`<div class="section compact"><div class="section-sub">아직 글이 없어요. 첫 이야기를 남겨보세요.</div></div>`}<button class="fab" onclick="navigate('compose')">＋</button>`}
function postHTML(p){return `<div class="post-card"><div class="row-between"><div class="badge-row"><span class="c-badge">${esc(p.badge)}</span><span class="c-badge">${esc(p.region)}</span></div><button class="post-menu" onclick="postMenu('${p.id}')">···</button></div><button style="width:100%;border:0;background:none;text-align:left;padding:0" onclick="navigate('post',{id:'${p.id}'})"><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><div class="post-foot"><span>공감 ${p.likes}</span><span>댓글 ${p.comments.length}</span></div></button></div>`}
routes.post=({id})=>{const p=state.posts.find(x=>x.id===id);if(!p)return '';const sug=postSuggestion(id);return `${pagebar('라운지',`<button class="post-menu" onclick="postMenu('${p.id}')">···</button>`)}<div class="section compact"><div class="post-card" style="margin:0;padding-top:6px"><div class="badge-row"><span class="c-badge">${esc(p.badge)}</span><span class="c-badge">${esc(p.region)}</span></div><h3 style="font-size:22px;margin-top:13px">${esc(p.title)}</h3><p style="font-size:13px">${esc(p.body)}</p><div class="post-foot"><button class="textbtn" onclick="likePost('${p.id}')">${state.likedPosts.includes(p.id)?'♥':'♡'} 공감 ${p.likes}</button><span>댓글 ${p.comments.length}</span></div></div>${sug?`<div class="auto-summary" style="margin-top:18px"><b>글에서 이런 데이트가 언급됐어요</b><p>${esc(sug.name)} · ${esc(sug.area)}<br>저장하면 다음 코스 추천에서 참고해요.</p><button class="daily-open" onclick="saveCommunityPlace('${id}')">우리 위시리스트에 저장</button></div>`:''}<div style="margin-top:24px"><h2 class="section-title" style="font-size:19px">댓글</h2>${p.comments.length?p.comments.map(c=>`<div class="comment"><b>${esc(c.who)}</b><p>${esc(c.text)}</p></div>`).join(''):`<div class="section-sub" style="margin-top:10px">아직 댓글이 없어요.</div>`}<textarea id="commentText" class="compose" style="min-height:82px;margin-top:15px" placeholder="익명으로 댓글 남기기"></textarea><button class="secondary" style="width:100%;margin-top:8px" onclick="addComment('${p.id}')">댓글 등록</button></div></div>`}
routes.us=()=>{const d=daysTogether();return `${topHome().replace('모먼트','우리')}<div class="section compact"><div class="row-between"><div><div class="eyebrow">우리의 시간</div><h1 style="font-size:31px;letter-spacing:-1.1px;margin:5px 0 4px">${relationship()}</h1><div class="section-sub">D+${d} · 기록 ${state.records.length}개 · 저장한 곳 ${state.wishlist.length}곳</div></div></div></div><div class="section"><h2 class="section-title">매일 하는 것</h2><div class="section-sub">홈에는 하루 하나만 보여주고, 여기서는 언제든 다시 볼 수 있어요.</div><div class="mini-grid" style="margin-top:14px"><button class="mini-feed" onclick="navigate('taste')" style="border:0;text-align:left"><strong>10초 취향</strong><p>${state.taste.choice?'오늘 선택 완료':'둘 중 오늘 더 끌리는 것'}</p></button><button class="mini-feed" onclick="navigate('question')" style="border:0;text-align:left"><strong>오늘의 질문</strong><p>${state.question.my?'내 답 저장됨':'둘이 답하면 공개'}</p></button><button class="mini-feed" onclick="navigate('balance')" style="border:0;text-align:left"><strong>밸런스</strong><p>${state.balance.my?'결과 보기':'상대 답은 선택 후 공개'}</p></button><button class="mini-feed" onclick="navigate('month')" style="border:0;text-align:left"><strong>${monthLabel()} 기록</strong><p>우리의 데이트를 다시 보기</p></button></div></div><div class="section"><div class="row-between"><h2 class="section-title">같이 가고 싶은 곳</h2><button class="textbtn" onclick="navigate('wishlist')">전체</button></div><div class="wish-strip">${state.wishlist.slice(0,5).map(w=>`<div class="wish-item"><img src="${w.img}"><b>${esc(w.name)}</b><span>${esc(w.area||'저장한 장소')}</span></div>`).join('')}</div></div><div class="section"><div class="feed-card" style="border:0"><img class="memory-img" src="${IMG.memory}" style="border-radius:22px"><div class="feed-pad" style="padding-left:0;padding-right:0"><div class="feed-kicker">추억 다시 보기</div><div class="feed-title">우리의 지난 데이트</div><div class="feed-desc">사진, 사용금액, 한 줄 기록을 날짜별로 다시 볼 수 있어요.</div><button class="feed-action" onclick="navigate('records')">기록 열기</button></div></div></div>`}
routes.month=()=>{const key=monthKey(),rec=state.records.filter(r=>r.date.startsWith(key)),total=rec.reduce((a,r)=>a+r.cost,0),hrs=rec.reduce((a,r)=>a+r.hours,0),photos=rec.reduce((a,r)=>a+r.photos,0),rating=rec.length?(rec.reduce((a,r)=>a+r.rating,0)/rec.length).toFixed(1):'-';return `${pagebar(`${monthLabel()} 기록`,`<button class="iconbtn" onclick="navigate('addRecord')">${icon('plus')}</button>`)}<div class="section compact"><div class="month-hero"><div class="eyebrow">${monthLabel()}의 우리</div><h1 style="font-size:28px;margin:4px 0 0">${rec.length?`${rec.length}번 만나 ${Math.round(hrs)}시간 함께`:'이번 달 첫 기록을 남겨보세요'}</h1><div class="month-grid"><div class="month-stat"><span>총 사용</span><b>${money(total)}</b></div><div class="month-stat"><span>평균 만족도</span><b>${rating}</b></div><div class="month-stat"><span>사진</span><b>${photos}장</b></div><div class="month-stat"><span>평균 데이트</span><b>${rec.length?(hrs/rec.length).toFixed(1):0}h</b></div></div></div></div><div class="section compact"><div class="row-between"><h2 class="section-title">날짜별 기록</h2><button class="textbtn" onclick="navigate('addRecord')">+ 기록</button></div>${rec.length?rec.map(r=>recordHTML(r)).join(''):`<div class="section-sub" style="margin-top:12px">데이트를 마치면 자동으로 기록되고, 직접 추가할 수도 있어요.</div>`}</div>`}
function finishDate(){const p=findPlan(state.live.planId);const rec={id:'r_'+Date.now(),date:p.config?.date||today(),title:p.title,cost:p.totalCost,hours:Number(p.totalHours.toFixed(1)),rating:4.8,photos:0,places:p.places.map(x=>x.cat),memo:'오늘 데이트가 자동으로 기록됐어요.'};state.records.unshift(rec);state.v13.lastRecordId=rec.id;state.live.status='ended';save();nav=[{route:'dateWrap',params:{id:rec.id}}];render()}
routes.dateWrap=({id})=>{const r=state.records.find(x=>x.id===id);if(!r)return '';return `${pagebar('데이트 마무리')}<div class="wrap-hero"><div class="check">✓</div><h1>오늘도 잘 놀았어요.</h1><div class="section-sub">기록은 이미 저장했어요. 기억하고 싶은 것만 조금 더 남겨도 돼요.</div><div class="wrap-summary"><div class="wrap-stat"><span>함께한 시간</span><b>${r.hours}시간</b></div><div class="wrap-stat"><span>예상 사용</span><b>${money(r.cost)}</b></div><div class="wrap-stat"><span>장소</span><b>${r.places.length}곳</b></div></div><div class="planner-row" style="margin-top:20px"><label>오늘 한 줄</label><textarea id="wrapMemo" class="compose" style="min-height:90px">${esc(r.memo)}</textarea></div><div class="planner-row"><label>사진 수</label><input id="wrapPhotos" class="input" type="number" min="0" value="${r.photos}"></div><button class="primary" style="margin-top:18px" onclick="saveDateWrap('${r.id}')">기록 마치기</button><button class="textbtn" style="width:100%;margin-top:7px" onclick="switchTab('home')">나중에 할게요</button></div>`}

function v14DailyCompact(){const d=dailyInfo();return `<div class="v14-daily"><div class="daily-feature"><div class="daily-kicker">${esc(d.kicker)}</div><h3>${esc(d.title)}</h3><p>${esc(d.desc)}</p><button class="daily-open" onclick="navigate('${d.route}')">${d.type==='taste'&&state.taste.choice?'선택 보기':d.type==='question'&&state.question.my?'답변 보기':d.type==='balance'&&state.balance.my?'결과 보기':'오늘 하나 하기'}</button></div></div>`}

function v19HomePreview(){
  const a=AREA[state.planner.area]||AREA['성수'];
  const p={...state.planner,date:today(),duration:5,energy:'normal',transport:'auto',budget:state.profile.budget||state.planner.budget,returnTime:state.profile.returnTime||state.planner.returnTime};
  try{
    const plan=buildPlan({type:'best'},91,p,a.pool.slice());
    return {places:plan.places.length,hours:plan.totalHours,cost:plan.totalCost,travel:plan.travelMin};
  }catch(e){return {places:4,hours:5,cost:p.budget,travel:35}}
}

function v28MinutesUntil(date,time='23:59'){return Math.round((new Date(`${date}T${time}:00`).getTime()-Date.now())/60000)}

function v28DateLabel(date){const d=new Date(date+'T00:00:00');return `${d.getMonth()+1}월 ${d.getDate()}일`}
function v28Weekday(date){return ['일','월','화','수','목','금','토'][new Date(date+'T00:00:00').getDay()]+'요일'}
function v28FmtDate(date){return `${v28DateLabel(date)} ${v28Weekday(date)}`}
function v28AddDays(date,days){const d=new Date(date+'T00:00:00');d.setDate(d.getDate()+days);return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function v28AutoMilestones(count=6){const d=daysTogether(),start=state.profile.coupleStart,next=Math.max(100,Math.ceil((d+1)/100)*100),out=[];for(let n=next;n<next+count*100;n+=100){const date=v28AddDays(start,n-1);out.push({id:'auto_'+n,name:`우리 ${n}일`,date,daysLeft:Math.max(0,Math.ceil((new Date(date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)),auto:true})}return out}
function v28CustomAnnivNext(a){let date=a.date;if(a.yearly){const base=new Date(a.date+'T00:00:00'),now=new Date(today()+'T00:00:00');let y=now.getFullYear();let d=new Date(y,base.getMonth(),base.getDate());if(d<now)d=new Date(y+1,base.getMonth(),base.getDate());date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}return {...a,date,daysLeft:Math.max(0,Math.ceil((new Date(date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)),auto:false}}
function v28NextAnniversary(){const all=[...v28AutoMilestones(5),...state.v28.anniversaries.map(v28CustomAnnivNext)].filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));return all[0]||v28AutoMilestones(1)[0]}
